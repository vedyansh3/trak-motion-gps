<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>TRAK MOTION GPS — Inventory & Operations</title>
<style>
:root{--bg:#071426;--bg2:#0b1f3a;--card:#fff;--ink:#142033;--muted:#68758a;--line:#e7edf4;--accent:#16b8d4;--accent2:#4777ff;--ok:#12a66a;--warn:#e9a51b;--danger:#e34d59;--soft:#f4f7fb;--shadow:0 12px 34px rgba(16,37,67,.09);--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f6fa;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(7,20,38,.96);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 25px rgba(0,0,0,.12)}.brand{font-weight:900;letter-spacing:.3px}.brand small{display:block;font-size:10px;opacity:.62;font-weight:600}.top-spacer{flex:1}.role-chip{padding:7px 10px;border:1px solid rgba(255,255,255,.15);border-radius:999px;font-size:11px}.icon-btn{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.1);color:#fff}.layout{display:flex;min-height:calc(100vh - 64px)}.side{width:232px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:64px;height:calc(100vh - 64px);display:flex;flex-direction:column;gap:7px}.side button{background:transparent;text-align:left;padding:12px 13px;border-radius:13px;color:#59677a;font-weight:750}.side button.active,.side button:hover{background:#eaf8fb;color:#087f95}.main{width:100%;max-width:1280px;margin:auto;padding:22px 18px 100px}.hero{background:linear-gradient(135deg,#0a1d35,#10325a 55%,#087f95);color:#fff;border-radius:24px;padding:24px;box-shadow:var(--shadow);display:flex;gap:18px;align-items:center;justify-content:space-between}.hero h1{margin:0 0 5px;font-size:clamp(22px,4vw,34px)}.hero p{margin:0;color:#d9e8f5}.hero-actions{display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary,.danger{padding:11px 15px;border-radius:13px;font-weight:850}.primary{background:#fff;color:#0a5f76}.secondary{background:#eaf0f7;color:#17304d}.danger{background:#ffe9eb;color:#a92b37}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:17px}.kpi{cursor:pointer;transition:.18s transform,.18s box-shadow}.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(16,37,67,.13)}.kpi .label{font-size:12px;color:var(--muted);font-weight:800}.kpi .num{font-size:29px;font-weight:950;margin:7px 0}.kpi .sub{font-size:11px;color:var(--muted)}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.muted{color:var(--muted);font-size:13px}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:15px}.stock-row{display:grid;grid-template-columns:110px 1fr 55px;gap:10px;align-items:center;margin:14px 0}.bar{height:9px;background:#edf2f7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:#f7fafc;border:1px solid var(--line);padding:16px 10px;border-radius:15px;font-weight:850;color:#26364e}.quick span{display:block;font-size:23px;margin-bottom:5px}.list{display:flex;flex-direction:column;gap:9px}.row{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;align-items:center;gap:12px;justify-content:space-between}.row-main{min-width:0}.row-title{font-weight:850}.row-sub{font-size:12px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#edf2f7;color:#506075}.pill.ok{background:#e7f8f0;color:#087a4e}.pill.warn{background:#fff5dc;color:#9a6800}.pill.danger{background:#ffeaec;color:#a92b37}.form{display:grid;gap:13px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dce4ed;border-radius:12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#16b8d4;box-shadow:0 0 0 3px rgba(22,184,212,.12)}.help{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(3,12,24,.68);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{background:#fff;border-radius:24px 24px 14px 14px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet-head h3{margin:0;font-size:19px}.close{width:38px;height:38px;border-radius:12px;background:#edf2f7}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(20px);background:#10243c;color:#fff;padding:12px 16px;border-radius:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100;font-weight:750;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bottom{display:none}.scanner{background:#050b14;color:#fff;border-radius:22px;width:min(520px,100%);padding:16px}.video-wrap{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3}.video-wrap video{width:100%;height:100%;object-fit:cover}.scan-frame{position:absolute;inset:18%;border:2px solid #20d5e8;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.18)}.timeline{border-left:2px solid #dbe5ee;margin:8px 0 4px 8px;padding-left:17px}.event{position:relative;padding:5px 0 14px}.event:before{content:"";position:absolute;left:-25px;top:8px;width:9px;height:9px;border-radius:50%;background:#16b8d4}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tab{white-space:nowrap;padding:9px 12px;border-radius:11px;background:#edf2f7;color:#536176;font-weight:800}.tab.active{background:#102b4a;color:#fff}.notice{padding:12px 14px;border-radius:13px;background:#f0fbfd;border:1px solid #c9eff4;color:#11677a;font-size:12px;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #d5dee8;border-radius:16px}.hide{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.side{display:none}.layout{min-height:auto}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.bottom button{background:none;color:#677489;font-size:10px;font-weight:850;padding:6px 9px;border-radius:12px}.bottom button.active{color:#087f95;background:#eaf8fb}.bottom span{display:block;font-size:19px;margin-bottom:2px}.hero{align-items:flex-start;flex-direction:column}.main{padding:15px 12px 105px}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px}.kpi .num{font-size:24px}.form-grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.hero{padding:18px;border-radius:20px}.hero-actions{width:100%}.hero-actions button{flex:1}.row{align-items:flex-start}.row>button{flex-shrink:0}.role-chip{display:none}}
</style>
</head>
<body>
<div id="app" class="app">
<header class="top"><div class="brand">TRAK MOTION GPS<small>Inventory • Dispatch • Installation</small></div><div class="top-spacer"></div><span id="roleChip" class="role-chip">ADMIN</span><button class="icon-btn" onclick="openPage('settings')" aria-label="Settings">⚙</button></header>
<div class="layout"><aside class="side" id="sideNav"></aside><main class="main" id="main"></main></div>
<nav class="bottom" id="bottomNav"></nav>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"></div><div id="toast" class="toast"></div>
<script>
const USERS=[
 {login:'Admin',pass:'admin123',role:'ADMIN',name:'Admin User',branch:'ALL'},
 {login:'Manager',pass:'1234',role:'MANAGER',name:'Manager User',branch:'Varanasi'},
 {login:'Inventory',pass:'1234',role:'INVENTORY',name:'Inventory User',branch:'Ranchi'},
 {login:'Installer',pass:'1234',role:'INSTALLER',name:'Installer User',branch:'Ranchi',installerId:'INS001'},
 {login:'Partner',pass:'1234',role:'PARTNER',name:'Partner User',branch:'Varanasi',partnerId:'PAR001'},
 {login:'View Only',pass:'1234',role:'VIEW ONLY',name:'View Only User',branch:'ALL'}
];
const state={user:USERS[0],page:'home',lang:'en',simStock:{received:10000,used:2,adjustments:0},tasks:[{id:'T001',type:'Installation',title:'Install GPS',imei:'86753091234562',vehicle:'BR01AB1234',customer:'Rahul Kumar',installerId:'INS001',due:'04 Oct 2026, 4:00 PM',status:'COMPLETED'}],customers:[{id:'C001',userId:'USR001',name:'Rahul Kumar',mobile:'9876543210',alt:'9123456780',vehicle:'BR01AB1234',model:'Swift',state:'Bihar',pin:'800001'}],inventory:[
 {imei:'86753091234561',sim:'8991542404594135536U',model:'BR05M',relay:'12V',price:'',status:'IN STOCK',simStatus:'INACTIVE',locking:'LOCKED',remarks:'',branch:'Ranchi',customer:'',vehicle:'',userId:'',history:[['01 Oct 2026 10:20 AM','INWARD','Admin User']]},
 {imei:'86753091234562',sim:'8991542404594135537U',model:'BR05 V5',relay:'24V',price:'',status:'INSTALLED',simStatus:'ACTIVE',locking:'NOT LOCKED',remarks:'Demo installed device',branch:'Varanasi',customer:'Rahul Kumar',vehicle:'BR01AB1234',userId:'USR001',installerId:'INS001',history:[['01 Oct 2026 10:20 AM','INWARD','Admin User'],['01 Oct 2026 12:10 PM','PACKED','Inventory User'],['02 Oct 2026 09:30 AM','DISPATCHED','Manager User'],['03 Oct 2026 04:15 PM','DELIVERED','Manager User'],['04 Oct 2026 11:00 AM','INSTALLED','Installer User']]}
]};
const branches=['Varanasi','Ranchi','Dehri','Others'];
const can=(p)=>{const r=state.user.role;if(p==='admin')return r==='ADMIN';if(p==='ops')return ['ADMIN','MANAGER','INVENTORY'].includes(r);if(p==='view')return true;if(p==='installer')return r==='INSTALLER';if(p==='partner')return r==='PARTNER';return false};
function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function openPage(p){if(state.user.role==='INSTALLER'&&!['home','operations','more','settings','taskcenter','installation','installerKyc'].includes(p))p='home';state.page=p;render()}
function nav(){const items=[['home','⌂','Home'],['stock','▦','Stock'],['operations','⚡','Operations'],['search','⌕','Search'],['more','•••','More']];document.getElementById('sideNav').innerHTML=items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="openPage('${x[0]}')">${x[1]} &nbsp;${x[2]}</button>`).join('');document.getElementById('bottomNav').innerHTML=items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="openPage('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');document.getElementById('roleChip').textContent=state.user.role}
function render(){nav();const m=document.getElementById('main');const pages={home:home,stock:stock,operations:operations,search:search,more:more,settings:settings,taskcenter:taskcenter,inward:inward,dispatch:dispatch,delivery:delivery,installation:installation,kyc:partnerKyc,installerKyc:installerKyc,import:importPage,customers:customers,movement:movement};m.innerHTML=(pages[state.page]||home)()}
function home(){const inst=state.inventory.filter(x=>x.status==='INSTALLED').length,inStock=state.inventory.filter(x=>x.status==='IN STOCK').length,packed=state.inventory.filter(x=>x.status==='PACKED').length,disp=state.inventory.filter(x=>x.status==='DISPATCHED').length,del=state.inventory.filter(x=>x.status==='DELIVERED').length,open=state.tasks.filter(x=>x.status!=='COMPLETED').length;return `<div class="hero"><div><h1>${state.user.role==='INSTALLER'?'My Installation Desk':'Simple outside. Powerful inside.'}</h1><p>${state.user.role==='INSTALLER'?'Only your assigned installations are shown.':'One device record. Every stage. No repeated entry.'}</p></div><div class="hero-actions">${can('ops')?`<button class="primary" onclick="openPage('inward')">＋ New Inward</button>`:''}<button class="primary" onclick="openPage('search')">⌕ Search</button></div></div>
<div class="grid"><div class="card kpi" onclick="drill('IN STOCK')"><div class="label">Device In Stock</div><div class="num">${inStock}</div><div class="sub">Tap to view actual devices</div></div><div class="card kpi" onclick="drill('INSTALLED')"><div class="label">Installed</div><div class="num">${inst}</div><div class="sub">Permanent installation records</div></div><div class="card kpi" onclick="openPage('stock')"><div class="label">SIM Remaining</div><div class="num">${state.simStock.received-state.simStock.used+state.simStock.adjustments}</div><div class="sub">Received ${state.simStock.received} • Used ${state.simStock.used}</div></div><div class="card kpi" onclick="openPage('taskcenter')"><div class="label">Open Tasks</div><div class="num">${open}</div><div class="sub">Assignments & follow-ups</div></div></div>
<div class="two section"><div class="card"><div class="section-head"><h2>Device flow</h2><span class="muted">Live demo state</span></div>${[['IN STOCK',inStock],['PACKED',packed],['DISPATCHED',disp],['DELIVERED',del],['INSTALLED',inst]].map(a=>`<div class="stock-row"><b>${a[0]}</b><div class="bar"><i style="width:${Math.max(4,a[1]/Math.max(1,state.inventory.length)*100)}%"></i></div><b>${a[1]}</b></div>`).join('')}</div><div class="card"><div class="section-head"><h2>Quick actions</h2></div><div class="quick">${can('ops')?`<button onclick="openPage('inward')"><span>＋</span>Inward</button><button onclick="openPage('dispatch')"><span>⇢</span>Dispatch</button><button onclick="openPage('delivery')"><span>✓</span>Delivery</button>`:''}<button onclick="openPage('search')"><span>⌕</span>Search</button><button onclick="openPage('operations')"><span>▣</span>Scan</button><button onclick="openPage('taskcenter')"><span>☑</span>Tasks</button></div></div></div>
<div class="section card"><div class="section-head"><h2>Recent activity</h2><button class="secondary" onclick="drill('ALL')">View all</button></div><div class="list">${state.inventory.flatMap(d=>d.history.slice(-1).map(h=>({d,h}))).reverse().slice(0,5).map(({d,h})=>`<div class="row" onclick="device('${d.imei}')"><div class="row-main"><div class="row-title">${h[1]} • ${esc(d.imei.slice(-6))}</div><div class="row-sub">${esc(d.customer||d.branch)} • ${h[0]}</div></div><span class="pill ${h[1]==='INSTALLED'?'ok':''}">${h[1]}</span></div>`).join('')}</div></div>`}
function stock(){const total=state.inventory.length;return `<div class="section-head"><div><h2>Stock</h2><div class="muted">Branch-wise devices and SIM inventory</div></div>${can('ops')?`<button class="primary" onclick="openPage('inward')">＋ Inward</button>`:''}</div><div class="grid"><div class="card kpi" onclick="drill('IN STOCK')"><div class="label">In Stock</div><div class="num">${state.inventory.filter(x=>x.status==='IN STOCK').length}</div></div><div class="card kpi" onclick="drill('PACKED')"><div class="label">Packed</div><div class="num">${state.inventory.filter(x=>x.status==='PACKED').length}</div></div><div class="card kpi" onclick="drill('DISPATCHED')"><div class="label">Dispatched</div><div class="num">${state.inventory.filter(x=>x.status==='DISPATCHED').length}</div></div><div class="card kpi" onclick="drill('INSTALLED')"><div class="label">Installed</div><div class="num">${state.inventory.filter(x=>x.status==='INSTALLED').length}</div></div></div><div class="two section"><div class="card"><div class="section-head"><h2>Branch stock</h2><span class="muted">${total} devices</span></div>${branches.map(b=>{let n=state.inventory.filter(x=>x.branch===b).length;return `<div class="stock-row"><b>${b}</b><div class="bar"><i style="width:${Math.max(4,n/Math.max(1,total)*100)}%"></i></div><b>${n}</b></div>`}).join('')}</div><div class="card"><div class="section-head"><h2>SIM Stock</h2></div><div class="notice">Remaining: ${state.simStock.received-state.simStock.used+state.simStock.adjustments}</div><div class="stock-row"><b>Received</b><div class="bar"><i style="width:100%"></i></div><b>${state.simStock.received}</b></div><div class="stock-row"><b>Used</b><div class="bar"><i style="width:${state.simStock.used/state.simStock.received*100}%"></i></div><b>${state.simStock.used}</b></div><div class="stock-row"><b>Adjust.</b><div class="bar"><i style="width:${Math.min(100,Math.abs(state.simStock.adjustments)/Math.max(1,state.simStock.received)*100)}%"></i></div><b>${state.simStock.adjustments}</b></div></div></div>`}
function operations(){if(state.user.role==='INSTALLER')return `<div class="hero"><div><h1>My Operations</h1><p>Scan or open only your assigned installation tasks.</p></div><button class="primary" onclick="openPage('taskcenter')">My Tasks</button></div><div class="section grid"><div class="card kpi" onclick="openScanner('imei','')"><div class="label">Scan Assigned Device</div><div class="num">⌁</div><div class="sub">Use QR to find your assignment</div></div><div class="card kpi" onclick="openPage('installerKyc')"><div class="label">My KYC</div><div class="num">✓</div><div class="sub">Save draft or submit</div></div></div>`;return `<div class="hero"><div><h1>Operations</h1><p>Scan → Select → Confirm → Done</p></div><button class="primary" onclick="openScanner('imei','')">⌁ Scan QR</button></div><div class="section grid"><div class="card kpi" onclick="openPage('inward')"><div class="label">First-time entry</div><div class="num">＋</div><div class="sub">Inward a new device + SIM</div></div><div class="card kpi" onclick="openPage('dispatch')"><div class="label">Dispatch</div><div class="num">⇢</div><div class="sub">Last 6 digits or QR</div></div><div class="card kpi" onclick="openPage('delivery')"><div class="label">Delivery</div><div class="num">✓</div><div class="sub">Advance existing record</div></div><div class="card kpi" onclick="openPage('movement')"><div class="label">Movement</div><div class="num">↔</div><div class="sub">Record stock movement</div></div></div>`}
function search(){return `<div class="card"><div class="section-head"><div><h2>Global Search</h2><div class="muted">Choose one method. IMEI uses last 6 digits.</div></div><button class="secondary" onclick="openScanner('imei','globalSearchInput')">⌁ QR</button></div><div class="tabs"><button class="tab active" onclick="setSearch('imei',this)">IMEI — Last 6</button><button class="tab" onclick="setSearch('vehicle',this)">Vehicle Number</button><button class="tab" onclick="setSearch('customer',this)">Customer Name</button><button class="tab" onclick="setSearch('userid',this)">Customer User ID</button></div><div class="field"><label id="searchLabel">IMEI — Last 6 digits</label><input id="globalSearchInput" placeholder="123456" oninput="runSearch(this.value)"></div><div id="searchResults" class="section"></div></div>`}
let searchType='imei';function setSearch(t,b){searchType=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('searchLabel').textContent={imei:'IMEI — Last 6 digits',vehicle:'Vehicle Number',customer:'Customer Name',userid:'Customer User ID'}[t];document.getElementById('globalSearchInput').value='';document.getElementById('globalSearchInput').placeholder={imei:'123456',vehicle:'BR01AB1234',customer:'Rahul Kumar',userid:'USR001'}[t];document.getElementById('searchResults').innerHTML=''}
function runSearch(q){q=q.trim().toLowerCase();if(!q){document.getElementById('searchResults').innerHTML='';return}let a=state.inventory.filter(d=>searchType==='imei'?d.imei.slice(-6).toLowerCase()===q:searchType==='vehicle'?d.vehicle.toLowerCase().includes(q):searchType==='customer'?d.customer.toLowerCase().includes(q):d.userId.toLowerCase().includes(q));document.getElementById('searchResults').innerHTML=a.length?`<div class="list">${a.map(d=>resultRow(d)).join('')}</div>`:`<div class="empty">No matching record found.</div>`}
function resultRow(d){let showFull=state.user.role==='ADMIN'||state.user.role==='MANAGER'||state.user.role==='INVENTORY';return `<div class="row" onclick="device('${d.imei}')"><div class="row-main"><div class="row-title">${showFull?esc(d.imei):esc(d.imei.slice(-6))} • ${esc(d.customer||'No customer')}</div><div class="row-sub">${esc(d.vehicle||'No vehicle')} • ${esc(d.branch)}</div></div><span class="pill ${d.status==='INSTALLED'?'ok':''}">${d.status}</span></div>`}
function inward(){if(!can('ops'))return denied();return `<div class="card"><div class="section-head"><div><h2>New Inward</h2><div class="muted">First-time device entry only</div></div><span class="pill">IN STOCK</span></div><div class="notice">IMEI and SIM are QR-only in Inward. Date/time, Device Status and SIM Status are automatic.</div><form class="form section" onsubmit="saveInward(event)"><div class="form-grid"><div class="field"><label>IMEI *</label><div style="display:flex;gap:8px"><input id="inImei" readonly placeholder="Scan QR" required><button type="button" class="secondary" onclick="openScanner('imei','inImei')">⌁ Scan</button></div><div class="help">Duplicate IMEI is blocked.</div></div><div class="field"><label>SIM *</label><div style="display:flex;gap:8px"><input id="inSim" readonly placeholder="Scan QR" required><button type="button" class="secondary" onclick="openScanner('sim','inSim')">⌁ Scan</button></div></div><div class="field"><label>Device Model *</label><select id="inModel" required><option value="">Select model</option><option>BR05M</option><option>BR05 V5</option><option>Other</option></select></div><div class="field"><label>Relay *</label><select id="inRelay" required><option value="">Select</option><option>12V</option><option>24V</option><option>Other</option></select></div><div class="field"><label>Purchase Price (₹) — Optional</label><input id="inPrice" type="number" min="0" placeholder="Leave blank if not applicable"></div><div class="field"><label>Locking Status *</label><select id="inLock" required><option value="">Select</option><option>LOCKED</option><option>NOT LOCKED</option></select></div><div class="field"><label>Branch *</label><select id="inBranch" required>${branches.map(b=>`<option>${b}</option>`).join('')}</select></div><div class="field"><label>Remarks — Optional</label><input id="inRemarks"></div></div><div class="actions"><button class="primary">Save Inward</button><button type="button" class="secondary" onclick="openPage('operations')">Cancel</button></div></form></div>`}
function saveInward(e){e.preventDefault();const imei=document.getElementById('inImei').value.trim(),sim=document.getElementById('inSim').value.trim();if(!imei)return toast('IMEI is required.');if(imei.length<6)return toast('Please enter the last 6 digits of IMEI.');if(state.inventory.some(x=>x.imei===imei))return toast('Duplicate IMEI — Record already exists.');if(!sim)return toast('SIM is required.');const d={imei,sim,model:inModel.value,relay:inRelay.value,price:inPrice.value, status:'IN STOCK',simStatus:'INACTIVE',locking:inLock.value,remarks:inRemarks.value,branch:inBranch.value,customer:'',vehicle:'',userId:'',history:[[new Date().toLocaleString(),'INWARD',state.user.name]]};state.inventory.push(d);state.simStock.used++;toast('Saved successfully.');openPage('stock')}
function dispatch(){if(!can('ops'))return denied();return `<div class="card"><div class="section-head"><div><h2>Dispatch</h2><div class="muted">Reuse the existing device record</div></div></div><div class="form"><div class="field"><label>IMEI — Last 6 digits *</label><div style="display:flex;gap:8px"><input id="dispatchLast6" placeholder="123456" maxlength="6"><button class="secondary" type="button" onclick="openScanner('imei','dispatchLast6')">⌁ QR</button></div></div><div id="dispatchFound" class="section"></div></div></div>`}
function findDispatch(v){const d=state.inventory.find(x=>x.imei.slice(-6)===v);document.getElementById('dispatchFound').innerHTML=d?dispatchForm(d):`<div class="empty">Device not found.</div>`}
function dispatchForm(d){return `<div class="card" style="background:#f8fbfd"><div class="section-head"><h2>Existing record</h2><span class="pill">${d.status}</span></div><div class="form-grid"><div><b>IMEI</b><div class="muted">${state.user.role==='ADMIN'?d.imei:d.imei.slice(-6)}</div></div><div><b>SIM</b><div class="muted">${state.user.role==='ADMIN'?d.sim:'Restricted'}</div></div><div><b>Device Model</b><div class="muted">${d.model}</div></div><div><b>Locking</b><div class="muted">${d.locking}</div></div><div class="field"><label>Relay — Editable</label><select id="dispRelay"><option ${d.relay==='12V'?'selected':''}>12V</option><option ${d.relay==='24V'?'selected':''}>24V</option><option>Other</option></select></div><div class="field"><label>Party Type</label><select id="dispParty"><option>DEALER</option><option>DISTRIBUTOR</option><option>INSTALLER</option><option>CAR MECHANIC</option><option>CAR ACCESSORIES</option><option>CUSTOMER</option></select></div><div class="field"><label>Party Name</label><input id="dispName" value="${esc(d.customer)}"></div><div class="field"><label>Mobile</label><input id="dispMobile" value=""></div><div class="field"><label>Address</label><input id="dispAddress"></div><div class="field"><label>City</label><input id="dispCity"></div><div class="field"><label>State</label><input id="dispState" value="Bihar"></div><div class="field"><label>PIN</label><input id="dispPin"></div><div class="field"><label>Source</label><select id="dispSource" onchange="this.value==='Other'?document.getElementById('otherSource').classList.remove('hide'):document.getElementById('otherSource').classList.add('hide')"><option>Website</option><option>Referral</option><option>Dealer</option><option>Distributor</option><option>Other</option></select></div><div id="otherSource" class="field hide"><label>Other Source</label><input></div></div><div class="actions section"><button class="primary" onclick="saveDispatch('${d.imei}')">Confirm Dispatch</button></div></div>`}
function saveDispatch(imei){const d=state.inventory.find(x=>x.imei===imei);d.relay=document.getElementById('dispRelay').value;d.customer=document.getElementById('dispName').value;d.status='DISPATCHED';d.history.push([new Date().toLocaleString(),'DISPATCHED',state.user.name]);toast('Saved successfully.');openPage('stock')}
function delivery(){if(!can('ops'))return denied();return `<div class="card"><div class="section-head"><h2>Delivery</h2></div><div class="field"><label>IMEI — Last 6 digits *</label><div style="display:flex;gap:8px"><input id="deliveryLast6" maxlength="6" placeholder="123456"><button class="secondary" onclick="openScanner('imei','deliveryLast6')">⌁ QR</button></div></div><div id="deliveryFound" class="section"></div></div>`}
function findDelivery(v){const d=state.inventory.find(x=>x.imei.slice(-6)===v);document.getElementById('deliveryFound').innerHTML=d?`<div class="card"><div class="row"><div><div class="row-title">${d.imei.slice(-6)} • ${esc(d.customer||'No customer')}</div><div class="row-sub">${d.status}</div></div><button class="primary" onclick="completeDelivery('${d.imei}')">Mark Delivered</button></div></div>`:`<div class="empty">Device not found.</div>`}
function completeDelivery(i){const d=state.inventory.find(x=>x.imei===i);d.status='DELIVERED';d.history.push([new Date().toLocaleString(),'DELIVERED',state.user.name]);toast('Saved successfully.');openPage('stock')}
function taskcenter(){const my=state.user.role==='INSTALLER'?state.tasks.filter(t=>t.installerId===state.user.installerId):state.tasks;return `<div class="section-head"><div><h2>${state.user.role==='INSTALLER'?'My Tasks':'Task Center'}</h2><div class="muted">Assignments, reminders, follow-ups and overdue work</div></div>${can('ops')?`<button class="primary" onclick="newTask()">＋ Assign Task</button>`:''}</div><div class="list">${my.length?my.map(t=>`<div class="row" onclick="taskDetail('${t.id}')"><div class="row-main"><div class="row-title">${esc(t.title)}</div><div class="row-sub">${esc(t.customer)} • ${esc(t.vehicle||t.imei)} • Due ${esc(t.due)}</div></div><span class="pill ${t.status==='COMPLETED'?'ok':t.status==='OVERDUE'?'danger':'warn'}">${t.status}</span></div>`).join(''):`<div class="empty">No tasks.</div>`}</div>`}
function taskDetail(id){const t=state.tasks.find(x=>x.id===id);const d=state.inventory.find(x=>x.imei===t.imei);openModal(`<div class="sheet"><div class="sheet-head"><h3>${esc(t.title)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="notice">${esc(t.status)} • Due ${esc(t.due)}</div><div class="section card"><b>Customer</b><div class="muted">${esc(t.customer)}</div><b class="section">Vehicle</b><div class="muted">${esc(t.vehicle)}</div></div>${state.user.role==='INSTALLER'&&t.status!=='COMPLETED'?`<button class="primary" onclick="completeTask('${t.id}')">Installation Completed</button>`:''}</div>`)}
function completeTask(id){const t=state.tasks.find(x=>x.id===id);const d=state.inventory.find(x=>x.imei===t.imei);t.status='COMPLETED';if(d){d.status='INSTALLED';d.simStatus='ACTIVE';d.installerId=state.user.installerId;d.history.push([new Date().toLocaleString(),'INSTALLED',state.user.name])}closeModal();toast('Installation completed.');render()}
function newTask(){openModal(`<div class="sheet"><div class="sheet-head"><h3>Assign Task</h3><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Task</label><input id="ntTitle" value="Installation"></div><div class="field"><label>IMEI — Last 6</label><input id="ntImei" maxlength="6"></div><div class="field"><label>Installer</label><select id="ntInstaller"><option>INS001</option></select></div><div class="field"><label>Due date/time</label><input id="ntDue" type="datetime-local"></div><button class="primary" onclick="saveTask()">Assign Task</button></div></div>`)}
function saveTask(){const last=document.getElementById('ntImei').value;const d=state.inventory.find(x=>x.imei.slice(-6)===last);if(!d)return toast('Device not found.');state.tasks.push({id:'T'+String(state.tasks.length+1).padStart(3,'0'),type:'Installation',title:document.getElementById('ntTitle').value,imei:d.imei,vehicle:d.vehicle||'—',customer:d.customer||'—',installerId:document.getElementById('ntInstaller').value,due:document.getElementById('ntDue').value||'Not set',status:'ASSIGNED'});closeModal();toast('Task assigned.');render()}
function installation(){if(state.user.role!=='INSTALLER')return `<div class="card"><h2>Installation</h2><div class="muted">Open an assigned task from Task Center.</div><div class="section"><button class="primary" onclick="openPage('taskcenter')">My Tasks</button></div></div>`;return `<div class="card"><div class="section-head"><div><h2>Complete Installation</h2><div class="muted">Only assigned devices are allowed</div></div></div><div class="field"><label>IMEI — Last 6 / QR</label><div style="display:flex;gap:8px"><input id="installLast6" maxlength="6"><button class="secondary" onclick="openScanner('imei','installLast6')">⌁ QR</button></div></div><div id="installFound" class="section"></div></div>`}
function findInstall(v){const d=state.inventory.find(x=>x.imei.slice(-6)===v),t=state.tasks.find(x=>x.imei===d?.imei&&x.installerId===state.user.installerId&&x.status!=='COMPLETED');document.getElementById('installFound').innerHTML=!d?'<div class="empty">Device not found.</div>':!t?'<div class="empty">Device not assigned to you.</div>':`<div class="card"><div class="row"><div><div class="row-title">${esc(d.customer||'Customer')}</div><div class="row-sub">${esc(d.vehicle||'Vehicle')} • ${esc(t.due)}</div></div><button class="primary" onclick="completeTask('${t.id}')">Installation Completed</button></div></div>`}
function partnerKyc(){if(!can('partner')&&!can('admin'))return denied();return kycTemplate('Partner KYC','partner');}
function installerKyc(){if(state.user.role!=='INSTALLER'&&!can('admin'))return denied();return kycTemplate('Installer KYC','installer');}
function kycTemplate(title,type){return `<div class="card"><div class="section-head"><div><h2>${title}</h2><div class="muted">Simple guided verification • No bank details</div></div><span class="pill warn">NOT SUBMITTED</span></div><div class="notice">KYC 60% Complete • Save draft anytime. Each document supports Take Photo or Choose File.</div><div class="section form"><h3>1. Basic Details</h3><div class="form-grid"><div class="field"><label>${type==='partner'?'Partner':'Installer'} Name *</label><input></div><div class="field"><label>Mobile *</label><input type="tel"></div><div class="field"><label>Alternate Mobile</label><input type="tel"></div><div class="field"><label>Email</label><input type="email"></div><div class="field"><label>Address *</label><input></div><div class="field"><label>City / State / PIN *</label><input></div>${type==='partner'?`<div class="field"><label>Business / Shop Name *</label><input></div><div class="field"><label>Partner Type *</label><select><option>DEALER</option><option>DISTRIBUTOR</option><option>INSTALLER</option><option>CAR MECHANIC</option><option>CAR ACCESSORIES</option></select></div>`:''}</div><h3>2. Identity Documents</h3>${doc('Aadhaar Front',true)}${doc('Aadhaar Back',true)}${doc('PAN',true)}${doc('Photo',true)}<h3>3. ${type==='partner'?'Business Documents':'Work / Address Documents'}</h3>${doc('Business Address Proof',false)}${type==='partner'?doc('GST Certificate — if applicable',false)+doc('Shop & Establishment / Trade Licence — if applicable',false)+doc('Business Registration / Incorporation — if applicable',false)+doc('Partnership Deed — if applicable',false):doc('Applicable Work / Trade Proof — if relevant',false)}${doc('Residential Address Proof — if different',false)}<h3>4. Verification</h3><div class="muted">Status: Not Submitted → Submitted → Under Review → Verified / Correction Required</div><div class="actions"><button class="secondary" onclick="toast('Draft saved.')">Save Draft</button><button class="primary" onclick="toast('KYC submitted for review.')">Submit KYC</button></div></div></div>`}
function doc(name,req){return `<div class="row"><div class="row-main"><div class="row-title">${name}${req?' *':''}</div><div class="row-sub">Take Photo or Choose File • Preview before submit</div></div><button class="secondary" onclick="toast('Upload preview ready in demo.')">Upload</button></div>`}
function more(){return `<div class="section-head"><div><h2>More</h2><div class="muted">Management tools and settings</div></div></div><div class="grid">${can('ops')?`<div class="card kpi" onclick="openPage('taskcenter')"><div class="label">Task Center</div><div class="num">☑</div><div class="sub">Assignments, reminders & follow-ups</div></div>`:''}${state.user.role==='PARTNER'?`<div class="card kpi" onclick="openPage('kyc')"><div class="label">Partner KYC</div><div class="num">✓</div><div class="sub">Guided verification</div></div>`:''}${state.user.role==='INSTALLER'?`<div class="card kpi" onclick="openPage('installerKyc')"><div class="label">Installer KYC</div><div class="num">✓</div><div class="sub">Guided verification</div></div>`:''}${can('ops')?`<div class="card kpi" onclick="openPage('customers')"><div class="label">Customers</div><div class="num">♙</div><div class="sub">Link multiple vehicles safely</div></div><div class="card kpi" onclick="openPage('import')"><div class="label">Import Existing Data</div><div class="num">⇧</div><div class="sub">Analyze • Preview • Confirm</div></div>`:''}<div class="card kpi" onclick="openPage('settings')"><div class="label">Settings</div><div class="num">⚙</div><div class="sub">Language & preferences</div></div></div>`}
function settings(){return `<div class="card"><div class="section-head"><div><h2>Settings</h2><div class="muted">Simple controls for everyday use</div></div></div><div class="row"><div><div class="row-title">Language</div><div class="row-sub">Default: English</div></div><select onchange="state.lang=this.value;toast(this.value==='hi'?'हिंदी चयनित':'English selected')"><option value="en" ${state.lang==='en'?'selected':''}>English</option><option value="hi" ${state.lang==='hi'?'selected':''}>हिन्दी</option></select></div><div class="row section"><div><div class="row-title">Reminder behavior</div><div class="row-sub">Due reminders • follow-up • overdue escalation</div></div><span class="pill ok">ON</span></div><div class="notice section">Task sharing is built into the app: assign → remind → follow-up → complete. No separate policy-analysis task is required.</div><div class="section actions"><button class="danger" onclick="loginDemo()">Switch Demo User</button></div></div>`}
function loginDemo(){openModal(`<div class="sheet"><div class="sheet-head"><h3>Demo Login</h3><button class="close" onclick="closeModal()">×</button></div><div class="list">${USERS.map((u,i)=>`<button class="row" onclick="state.user=USERS[${i}];closeModal();openPage('home');toast('Logged in as ${u.role}')"><div><b>${u.login}</b><div class="muted">${u.role} • ${u.branch}</div></div><span class="pill">${u.pass}</span></button>`).join('')}</div></div>`)}
function importPage(){if(!can('ops'))return denied();return `<div class="card"><div class="section-head"><div><h2>Import Existing Data</h2><div class="muted">Demo preview only — no Sheets modification</div></div></div><div class="field"><label>CSV / XLSX</label><input type="file" accept=".csv,.xlsx,.xls"></div><div class="grid section"><div class="card"><div class="label">READY TO IMPORT</div><div class="num">15</div></div><div class="card"><div class="label">NEEDS REVIEW</div><div class="num">3</div></div><div class="card"><div class="label">DUPLICATE</div><div class="num">2</div></div><div class="card"><div class="label">INVALID</div><div class="num">1</div></div></div><div class="actions section"><button class="secondary" onclick="toast('Analysis complete.')">Analyze</button><button class="secondary" onclick="toast('Preview ready.')">Preview</button><button class="primary" onclick="toast('Demo import confirmed.')">Confirm Import</button></div></div>`}
function customers(){if(!can('ops'))return denied();return `<div class="card"><div class="section-head"><div><h2>Customer Management</h2><div class="muted">Link one customer to multiple vehicles without duplicate device linkage.</div></div></div><div class="field"><label>IMEI — Last 6 / QR</label><input placeholder="123456"></div><div class="section notice">Demo customer: Rahul Kumar • USR001 • BR01AB1234</div><div class="actions section"><button class="primary" onclick="toast('Customer linkage saved in demo.')">Save Customer</button></div></div>`}
function movement(){if(!can('ops'))return denied();return `<div class="card"><h2>Movement</h2><div class="muted">Permanent stock movement record</div><div class="form section"><div class="form-grid"><div class="field"><label>IMEI — Last 6</label><input></div><div class="field"><label>Action</label><select><option>MOVE</option><option>RETURN</option></select></div><div class="field"><label>From</label><input></div><div class="field"><label>To</label><input></div><div class="field"><label>Customer / Mobile</label><input></div><div class="field"><label>Remarks</label><input></div></div><button class="primary" onclick="toast('Movement saved.')">Save Movement</button></div></div>`}
function denied(){return `<div class="card"><h2>Access restricted</h2><div class="muted section">Your role does not have access to this function.</div></div>`}
function drill(status){let a=status==='ALL'?state.inventory:state.inventory.filter(x=>x.status===status);openModal(`<div class="sheet"><div class="sheet-head"><h3>${status==='ALL'?'Recent / All Devices':status}</h3><button class="close" onclick="closeModal()">×</button></div><div class="list">${a.length?a.map(resultRow).join(''):'<div class="empty">No records.</div>'}</div></div>`)}
function device(imei){const d=state.inventory.find(x=>x.imei===imei);const full=state.user.role==='ADMIN'||state.user.role==='MANAGER'||state.user.role==='INVENTORY';openModal(`<div class="sheet"><div class="sheet-head"><h3>Device Details</h3><button class="close" onclick="closeModal()">×</button></div><div class="grid"><div class="card"><div class="muted">IMEI</div><b>${full?d.imei:d.imei.slice(-6)}</b></div><div class="card"><div class="muted">Status</div><b>${d.status}</b></div><div class="card"><div class="muted">Model</div><b>${state.user.role==='INSTALLER'||state.user.role==='PARTNER'?'Restricted':d.model}</b></div><div class="card"><div class="muted">Customer</div><b>${esc(d.customer||'—')}</b></div></div><h3 class="section">Permanent Timeline</h3><div class="timeline">${d.history.map(h=>`<div class="event"><b>${h[1]}</b><div class="muted">${h[0]} • ${h[2]}</div></div>`).join('')}</div></div>`)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal').classList.add('open')};function closeModal(){const v=document.getElementById('scannerVideo');if(v&&v.srcObject)stopScanner();document.getElementById('modal').classList.remove('open');document.getElementById('modal').innerHTML=''}
let scanStream=null,scanTimer=null,scanTarget='',scanKind='imei';
async function openScanner(kind,target){scanKind=kind;scanTarget=target;openModal(`<div class="scanner"><div class="sheet-head"><h3>Scan ${kind==='sim'?'SIM':'QR'}</h3><button class="close" onclick="closeModal()">×</button></div><div class="video-wrap"><video id="scannerVideo" autoplay muted playsinline></video><div class="scan-frame"></div></div><div class="section muted">Camera permission is required. Main/rear camera is preferred. If QR is not detected, use manual fallback.</div><div class="actions section"><button class="secondary" onclick="manualScanFallback()">Enter manually</button><button class="secondary" onclick="stopScanner()">Stop camera</button></div></div>`);try{await startScanner()}catch(e){toast('Camera unavailable — use manual entry.')}}
async function startScanner(){const v=document.getElementById('scannerVideo');if(!navigator.mediaDevices?.getUserMedia){throw Error('no camera');}scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=scanStream;await v.play();if('BarcodeDetector' in window){const detector=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{const codes=await detector.detect(v);if(codes[0]?.rawValue)handleScan(codes[0].rawValue)}catch(e){}},350)}}
function stopScanner(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
function handleScan(raw){if(scanTimer)clearInterval(scanTimer);const val=scanKind==='sim'?parseSimQR(raw):parseImeiQR(raw);applyScan(val)}
function parseImeiQR(raw){const s=String(raw||'').trim();const m=s.match(/imei\s*[:=]\s*["']?([0-9]{6,20})/i);return m?m[1]:s.replace(/\D/g,'')}
function parseSimQR(raw){const s=String(raw||'').trim();let m=s.match(/simNo\s*=\s*["']([^"']+)["']/i);if(!m)m=s.match(/simNo\s*[:=]\s*([A-Za-z0-9]+)/i);return m?m[1]:s}
function applyScan(val){stopScanner();if(!val){toast('No QR value detected.');return}if(scanKind==='imei'&&val.length>6&&scanTarget&&scanTarget!=='globalSearchInput'){document.getElementById(scanTarget).value=val;closeModal();if(scanTarget==='dispatchLast6')findDispatch(val.slice(-6));else if(scanTarget==='deliveryLast6')findDelivery(val.slice(-6));else if(scanTarget==='installLast6')findInstall(val.slice(-6));else if(scanTarget==='inImei'){}return}if(scanTarget){const e=document.getElementById(scanTarget);if(e)e.value=val.slice(-6);closeModal();if(scanTarget==='dispatchLast6')findDispatch(val.slice(-6));else if(scanTarget==='deliveryLast6')findDelivery(val.slice(-6));else if(scanTarget==='installLast6')findInstall(val.slice(-6));else if(scanTarget==='globalSearchInput'){e.value=val.slice(-6);runSearch(val.slice(-6))}else if(scanTarget==='inSim'&&scanKind==='sim')e.value=val;return}closeModal();toast('Scanned: '+val)}
function manualScanFallback(){const v=prompt(scanKind==='sim'?'Enter SIM QR value':'Enter IMEI / QR value');if(v)applyScan(v)}
// Smart listeners for lookup fields.
document.addEventListener('input',e=>{if(e.target.id==='dispatchLast6'&&e.target.value.length===6)findDispatch(e.target.value);if(e.target.id==='deliveryLast6'&&e.target.value.length===6)findDelivery(e.target.value);if(e.target.id==='installLast6'&&e.target.value.length===6)findInstall(e.target.value)});
render();
</script>
</body></html>
