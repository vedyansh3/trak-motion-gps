<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087a4b">
<title>TRAK MOTION GPS</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f8f6;color:#17251f}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
:root{--g:#087a4b;--dg:#063b2a;--line:#dce8e2;--muted:#6b7b73}

.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#043222,#087a4b)}
.loginbox{width:min(420px,100%);background:#fff;padding:28px;border-radius:24px;box-shadow:0 20px 60px #0005}
.logo{width:65px;height:65px;margin:auto auto 12px;background:var(--g);border-radius:18px;display:grid;place-items:center;color:#fff;font-size:30px}
.brand{text-align:center;font-size:24px;font-weight:900;color:var(--dg)}
.brand span{color:#0fa565}
.sub{text-align:center;color:var(--muted);margin:7px 0 25px}

.field{margin:10px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea{
 width:100%;padding:12px;border:1px solid var(--line);
 border-radius:11px;background:#fff
}
.field textarea{min-height:80px}

.primary,.save{background:var(--g);color:#fff;padding:13px;border-radius:11px;font-weight:bold}
.primary{width:100%}
.secondary{background:#eaf1ed;color:var(--dg);padding:9px 12px;border-radius:10px;font-weight:bold}

.top{height:64px;background:#fff;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;padding:0 14px;
position:sticky;top:0;z-index:30}
.topbrand{display:flex;align-items:center;gap:9px;font-weight:900;color:var(--dg)}
.toplogo{width:38px;height:38px;border-radius:11px;background:var(--g);display:grid;place-items:center;color:white}
.user{display:flex;align-items:center;gap:8px;font-size:12px}
.avatar{width:35px;height:35px;border-radius:50%;background:#ddf4e8;color:var(--g);display:grid;place-items:center;font-weight:bold}

.layout{display:flex;min-height:calc(100vh - 64px)}
aside{width:220px;background:var(--dg);padding:12px;flex-shrink:0}
.nav{width:100%;padding:11px;text-align:left;border-radius:10px;background:transparent;color:#d9eee5;font-weight:bold;margin:2px 0}
.nav.active{background:#0b6545;color:#fff}

.main{flex:1;padding:16px;max-width:1400px;margin:auto;width:100%}
.title h1{margin:0;color:var(--dg);font-size:24px}
.title p{margin:5px 0 14px;color:var(--muted);font-size:13px}

.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(5,1fr)}
.two{grid-template-columns:repeat(2,1fr)}
.three{grid-template-columns:repeat(3,1fr)}

.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 3px 12px #1231}
.card h3{margin:0 0 10px;color:var(--dg);font-size:16px}

.label{font-size:12px;color:var(--muted);font-weight:bold}
.value{font-size:25px;font-weight:900}
.green{color:var(--g)}
.orange{color:#ed8b24}
.red{color:#d63d45}
.blue{color:#286bd6}

.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick button{padding:12px;border-radius:10px;background:#edf8f2;color:var(--g);font-weight:bold}

.activity{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}

.table{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f7faf8}

.badge{padding:5px 8px;border-radius:20px;background:#e8f7ef;color:var(--g);font-weight:bold;font-size:11px}
.notice{padding:11px;border-radius:11px;background:#eef8f3;color:var(--dg);font-size:13px;margin-bottom:12px}

.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-box{border:1px dashed #b7cbc1;border-radius:12px;padding:12px;text-align:center}
.photo-box img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:#eef3f0;margin-top:7px}
.photo-box button{margin-top:7px;padding:9px;border-radius:9px;background:#e9f6ef;color:var(--g);font-weight:bold;width:100%}

.mobile{display:none}

.scanner{position:fixed;inset:0;background:#07110d;z-index:100;color:#fff;display:flex;flex-direction:column}
.scanbar,.scancontrols{padding:10px;background:#061c14;display:flex;gap:8px;align-items:center}
.scanbar{justify-content:space-between}
.scanbar select{max-width:180px;padding:8px;border-radius:8px}
.video{position:relative;flex:1;display:grid;place-items:center;overflow:hidden}
.video video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;width:min(78vw,360px);height:min(46vw,190px);border:3px solid white;border-radius:18px;box-shadow:0 0 0 9999px #0004}
.scanhelp{position:absolute;bottom:25px;left:20px;right:20px;text-align:center;background:#0009;padding:10px;border-radius:12px}
.scancontrols button{flex:1;padding:10px;border-radius:9px;background:#174d3b;color:#fff;font-weight:bold}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
background:#123d2e;color:white;padding:11px 15px;border-radius:11px;z-index:120}

@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){
 aside{display:none}
 .mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:6px}
 .mobile button{background:none;color:var(--muted);font-size:10px;font-weight:bold}
 .mobile .active{color:var(--g)}
 .main{padding:14px 12px 80px}
 .two,.three{grid-template-columns:1fr}
 .user .ut{display:none}
}
@media(max-width:500px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .form{grid-template-columns:1fr}
 .full{grid-column:auto}
 .photo-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login" class="login">
<div class="loginbox">
<div class="logo">📍</div>
<div class="brand">TRAK MOTION <span>GPS</span></div>
<div class="sub">Inventory & GPS Management</div>

<div class="field">
<label>Login ID / Mobile</label>
<input id="loginId" placeholder="Enter Login ID">
</div>

<div class="field">
<label>Password / PIN</label>
<input id="loginPass" type="password" placeholder="Enter password or PIN">
</div>

<button class="primary" onclick="doLogin()">Login →</button>

<p style="text-align:center;color:#6b7b73;font-size:12px">
Role and branch are assigned by Admin.
</p>
</div>
</section>


<!-- APP -->
<section id="app" class="hidden">

<header class="top">
<div class="topbrand">
<div class="toplogo">📍</div>
TRAK MOTION GPS
</div>

<div class="user">
<div class="ut">
<b id="userName"></b><br>
<span id="userMeta"></span>
</div>
<div class="avatar" id="avatar"></div>
<button class="secondary" onclick="logout()">Logout</button>
</div>
</header>

<div class="layout">
<aside id="side"></aside>
<main id="main" class="main"></main>
</div>

<nav id="mobile" class="mobile"></nav>

</section>


<!-- SCANNER -->
<div id="scanner" class="scanner hidden">

<div class="scanbar">
<b id="scanTitle">Scan</b>
<select id="cameraSelect"></select>
<button class="secondary" onclick="closeScanner()">✕</button>
</div>

<div class="video">
<video id="cameraVideo" playsinline autoplay muted></video>
<div class="frame"></div>
<div class="scanhelp">QR = IMEI • Barcode/XML = SIM</div>
</div>

<div class="scancontrols">
<button onclick="switchCamera()">🔄 Camera</button>
<button onclick="setZoom()">1× Main</button>
<button onclick="closeScanner()">Close</button>
</div>

</div>

<div id="toast" class="toast hidden"></div>


<script>

const USERS={
 admin:{p:"admin123",n:"Admin",r:"ADMIN",b:"ALL"},
 manager:{p:"1234",n:"Manager",r:"MANAGER",b:"VARANASI"},
 inventory:{p:"1234",n:"Inventory User",r:"INVENTORY",b:"VARANASI"},
 installer:{p:"1234",n:"Installer User",r:"INSTALLER",b:"DELHI"},
 viewer:{p:"1234",n:"View User",r:"VIEW ONLY",b:"VARANASI"}
};

const PERMISSIONS={
 ADMIN:["dashboard","inventory","sim","operations","search","movement","customers","partners","installers","reports","users","settings"],
 MANAGER:["dashboard","inventory","sim","operations","search","movement","customers","partners","installers","reports"],
 INVENTORY:["dashboard","inventory","sim","operations","search","movement"],
 INSTALLER:["dashboard","installation","search","movement"],
 "VIEW ONLY":["dashboard","inventory","search","reports"]
};

const LABELS={
 dashboard:"🏠 Home",
 inventory:"📦 Inventory",
 sim:"📶 SIM Stock",
 operations:"⚙️ Operations",
 search:"🔎 Search",
 movement:"🔄 Movement",
 customers:"👤 Customers",
 partners:"🤝 Partners",
 installers:"🛠 Installers",
 reports:"📊 Reports",
 users:"👥 Users",
 settings:"⚙️ Settings"
};

let USER=null;
let currentPage="dashboard";
let scanMode="";
let stream=null;
let cameras=[];
let cameraIndex=0;
let detectTimer=null;
let zoomTrack=null;


/* LOGIN */

function doLogin(){

let id=document.getElementById("loginId").value.trim().toLowerCase();
let pass=document.getElementById("loginPass").value.trim();

let u=USERS[id];

if(!u || u.p!==pass){
alert("Invalid Login ID or Password");
return;
}

USER={id,...u};

document.getElementById("login").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

document.getElementById("userName").textContent=USER.n;
document.getElementById("userMeta").textContent=USER.r+" • "+USER.b+" BRANCH";
document.getElementById("avatar").textContent=USER.n.charAt(0);

buildNavigation();
page("dashboard");
}


function logout(){
USER=null;
document.getElementById("login").classList.remove("hidden");
document.getElementById("app").classList.add("hidden");
}


/* NAVIGATION */

function buildNavigation(){

let allowed=PERMISSIONS[USER.r];

document.getElementById("side").innerHTML=
allowed.map(p=>
`<button class="nav" data-page="${p}" onclick="page('${p}')">
${LABELS[p]}
</button>`
).join("");

let mobilePages=["dashboard","inventory","operations","search","settings"];

document.getElementById("mobile").innerHTML=
mobilePages.filter(p=>allowed.includes(p)).map(p=>
`<button data-page="${p}" onclick="page('${p}')">
${LABELS[p]}
</button>`
).join("");
}


function page(p){

if(!PERMISSIONS[USER.r].includes(p)){
alert("Access denied");
return;
}

currentPage=p;

document.querySelectorAll("[data-page]").forEach(x=>{
x.classList.toggle("active",x.dataset.page===p);
});

let functions={
dashboard:dashboardPage,
inventory:inventoryPage,
sim:simPage,
operations:operationsPage,
search:searchPage,
movement:movementPage,
customers:customersPage,
partners:partnersPage,
installers:installersPage,
reports:reportsPage,
users:usersPage,
settings:settingsPage,
installation:installationPage
};

document.getElementById("main").innerHTML=functions[p]();
}


/* COMMON */

function header(title,subtitle){
return `
<div class="title">
<h1>${title}</h1>
<p>${subtitle}</p>
</div>`;
}

function input(id,label,placeholder="",full=false,type="text"){
return `
<div class="field ${full?"full":""}">
<label>${label}</label>
<input id="${id}" type="${type}" placeholder="${placeholder}">
</div>`;
}

function select(id,label,items,full=false){
return `
<div class="field ${full?"full":""}">
<label>${label}</label>
<select id="${id}">
<option value="">Select</option>
${items.map(x=>`<option>${x}</option>`).join("")}
</select>
</div>`;
}

function actions(html){
return `<div class="actions">${html}</div>`;
}

function toast(message){
let t=document.getElementById("toast");
t.textContent=message;
t.classList.remove("hidden");
clearTimeout(window.toastTimer);
window.toastTimer=setTimeout(()=>t.classList.add("hidden"),2200);
}

function demoSave(name){
toast(name+" saved — backend connection will be added next.");
}


/* HOME */

function dashboardPage(){

return header("Dashboard","TRAK MOTION GPS — Simple outside, powerful inside.")

+`
<div class="grid stats">

<div class="card">
<div class="label">GPS Stock</div>
<div class="value green">1,250</div>
</div>

<div class="card">
<div class="label">SIM Remaining</div>
<div class="value blue">5,000</div>
</div>

<div class="card">
<div class="label">Today's Dispatch</div>
<div class="value orange">28</div>
</div>

<div class="card">
<div class="label">Installed</div>
<div class="value green">19</div>
</div>

<div class="card">
<div class="label">Alerts</div>
<div class="value red">3</div>
</div>

</div>

<br>

<div class="grid two">

<div class="card">
<h3>⚡ Quick Actions</h3>

<div class="quick">
<button onclick="page('inventory')">📦 Add Inventory</button>
<button onclick="operationsPageNav('dispatch')">🚚 Dispatch</button>
<button onclick="operationsPageNav('delivery')">📍 Delivery</button>
<button onclick="operationsPageNav('installation')">🔧 Installation</button>
<button onclick="operationsPageNav('return')">↩ Return</button>
<button onclick="page('search')">🔎 Search</button>
</div>

</div>

<div class="card">
<h3>🔔 Recent Activity</h3>

<div class="activity"><span>IMEI 865432109876543</span><b>DISPATCHED</b></div>
<div class="activity"><span>IMEI 865432109876544</span><b>INSTALLED</b></div>
<div class="activity"><span>SIM Stock Inward</span><b>+10,000</b></div>
<div class="activity"><span>GPS Returned</span><b>RETURNED</b></div>

</div>

</div>

<br>

<div class="card">
<h3>⚠️ Alerts</h3>
<div class="notice">3 devices require attention.</div>
<div class="notice">SIM stock is being monitored by quantity.</div>
<div class="notice">Aadhaar documents are restricted to installation records.</div>
</div>
`;
}


/* INVENTORY */

function inventoryPage(){

return header("Inventory","INWARD → PACKING → STOCK")

+`
<div class="card">

<div class="notice">
IMEI must be numeric and more than 10 digits. Duplicate IMEI will be blocked by backend.
</div>

<div class="form">

<div class="field">
<label>IMEI No. *</label>
<div style="display:flex;gap:6px">
<input id="inventoryImei" placeholder="Scan QR / enter IMEI">
<button class="save" onclick="openScanner('imei')">📷</button>
</div>
</div>

<div class="field">
<label>SIM No. *</label>
<div style="display:flex;gap:6px">
<input id="inventorySim" placeholder="Scan barcode / enter SIM">
<button class="save" onclick="openScanner('sim')">📷</button>
</div>
</div>

${select("deviceModel","Device Model *",["BR05M","BR05 V5","SK05","OTHERS"])}
${select("relay","Relay *",["12V","24V"])}

${input("purchasePrice","Purchase Price (₹)","Enter amount",false,"number")}

${select("locking","Locking Status *",["LOCKED","NOT LOCKED"])}

${input("remarks","Remarks","Optional",true)}

</div>

${actions(`
<button class="save" onclick="saveInventory()">💾 SAVE INVENTORY</button>
`)}

</div>

<br>

<div class="card">
<h3>📦 Inventory Status</h3>

<div class="table">
<table>
<tr>
<th>IMEI</th>
<th>SIM</th>
<th>Model</th>
<th>Status</th>
<th>Locking</th>
</tr>
<tr>
<td>865432109876543</td>
<td>8991542404594135536U</td>
<td>BR05M</td>
<td><span class="badge">IN STOCK</span></td>
<td>NOT LOCKED</td>
</tr>
</table>
</div>

</div>
`;
}

function saveInventory(){

let imei=document.getElementById("inventoryImei").value.trim();
let sim=document.getElementById("inventorySim").value.trim();

if(!/^\d+$/.test(imei) || imei.length<=10){
alert("Invalid IMEI. IMEI must contain numbers only and be more than 10 digits.");
return;
}

if(!sim){
alert("SIM No. is required.");
return;
}

if(!document.getElementById("deviceModel").value){
alert("Select Device Model.");
return;
}

if(!document.getElementById("relay").value){
alert("Select Relay.");
return;
}

if(document.getElementById("purchasePrice").value===""){
alert("Purchase Price is required.");
return;
}

if(Number(document.getElementById("purchasePrice").value)<0){
alert("Purchase Price cannot be negative.");
return;
}

if(!document.getElementById("locking").value){
alert("Select Locking Status.");
return;
}

toast("Inventory validated. Backend save will be connected next.");
}


/* SIM STOCK */

function simPage(){

return header("SIM Stock","Quantity based SIM inventory — no individual SIM tracking.")

+`
<div class="grid stats">

<div class="card">
<div class="label">Total Received</div>
<div class="value blue">10,000</div>
</div>

<div class="card">
<div class="label">Used</div>
<div class="value orange">5,000</div>
</div>

<div class="card">

</div>

<div class="card">

</div>

</div>

<br>

<div class="card">
<h3>➕ SIM Stock Inward</h3>

<div class="form">

${input("simBatch","Batch / Reference","Optional")}
${input("simQty","Quantity *","e.g. 10000",false,"number")}
${input("simRemark","Remarks","Optional",true)}

${actions(`
<button class="save" onclick="demoSave('SIM Inward')">Save SIM Inward</button>
`)}

<div class="card">

<div class="table">
<table>

</tr>

<td>5,000</td>
</tr>
</table>
</div>
</div>
`;
}


/* OPERATIONS */

function operationsPage(){

return header("Operations","Dispatch, Delivery, Installation and Return.")

+`
<div class="grid two">

<div class="card">
<h3>🚚 Dispatch</h3>
<p>Move GPS from stock to a party.</p>
<button class="save" onclick="operationsPageNav('dispatch')">Open Dispatch</button>
</div>

<div class="card">
<h3>📍 Delivery</h3>
<p>Confirm delivery.</p>
<button class="save" onclick="operationsPageNav('delivery')">Open Delivery</button>
</div>

<div class="card">
<h3>🔧 Installation</h3>
<p>Install GPS and capture customer details.</p>
<button class="save" onclick="operationsPageNav('installation')">Open Installation</button>
</div>

<div class="card">
<h3>↩ Return</h3>
<p>Return GPS to stock where permitted.</p>
<button class="save" onclick="operationsPageNav('return')">Open Return</button>
</div>

</div>
`;
}

function operationsPageNav(type){

if(type==="dispatch")return renderOperation("dispatch");
if(type==="delivery")return renderOperation("delivery");
if(type==="installation")return page("installation");
if(type==="return")return renderOperation("return");

}

function renderOperation(type){

let main=document.getElementById("main");

if(type==="dispatch"){

main.innerHTML=header("Dispatch","Scan IMEI → Party → Address → Save")

+`
<div class="card">

<div class="form">

<div class="field">
<label>IMEI No. *</label>
<div style="display:flex;gap:6px">
<input id="dispatchImei" placeholder="Scan IMEI">
<button class="save" onclick="openScanner('dispatchImei')">📷</button>
</div>
</div>

${select("partyType","Party Type *",[
"DEALER",
"DISTRIBUTOR",
"INSTALLER",
"CAR MECHANIC",
"CAR ACCESSORIES",
"CUSTOMER"
])}

${input("partyName","Party Name *","Manual entry")}
${input("partyMobile","Party Mobile *","Mobile")}
${input("partyAddress","Party Address *","Full address",true)}
${input("partyCity","City *","City")}
${input("partyState","State *","State")}
${input("partyPin","PIN Code *","PIN")}
${input("dispatchAmount","Dispatch Amount (₹)","Enter amount",false,"number")}
${input("dispatchRemarks","Remarks","Optional",true)}

</div>

${actions(`<button class="save" onclick="demoSave('Dispatch')">💾 Save Dispatch</button>`)}

</div>`;

return;
}

if(type==="delivery"){

main.innerHTML=header("Delivery","Confirm GPS delivery")

+`
<div class="card">

<div class="form">

${input("deliveryImei","IMEI No. *","Scan or enter IMEI")}

${select("deliveryStatus","Delivery Status",["DELIVERED","PENDING"])}

${input("deliveryParty","Party Name","Customer / Partner")}
${input("deliveryDate","Delivery Date","Date")}
${input("deliveryRemark","Remarks","Optional",true)}

</div>

${actions(`<button class="save" onclick="demoSave('Delivery')">💾 Save Delivery</button>`)}

</div>`;

return;
}

if(type==="return"){

main.innerHTML=header("Return","Return GPS to inventory")

+`
<div class="card">

<div class="form">

${input("returnImei","IMEI No. *","Scan or enter IMEI")}

${select("returnReason","Return Reason",[
"Customer Return",
"Replacement",
"Installation Removed",
"Other"
])}

${input("returnFrom","Returned From","Customer / Partner")}
${input("returnRemark","Remarks","Optional",true)}

</div>

${actions(`<button class="save" onclick="demoSave('Return')">💾 Save Return</button>`)}

</div>`;

return;
}

}


/* INSTALLATION */

function installationPage(){

return header("Installation","Customer + Vehicle + Installer + Aadhaar")

+`
<div class="card">

<div class="form">

<div class="field">
<label>IMEI No. *</label>
<div style="display:flex;gap:6px">
<input id="installImei" placeholder="Scan IMEI">
<button class="save" onclick="openScanner('installImei')">📷</button>
</div>
</div>

${input("installSim","SIM No.","Auto from inventory")}

${select("installRelay","Relay",["12V","24V"])}

${select("installStatus","Installation Status *",[
"PENDING",
"INSTALLED",
"REPLACED",
"REMOVED"
])}

/* CAMERA */

async function openScanner(mode){

scanMode=mode;

document.getElementById("scanTitle").textContent=
mode==="imei"?"Scan IMEI QR":"Scan SIM Barcode / QR";

document.getElementById("scanner").classList.remove("hidden");

try{
await loadCameras();
await startCamera(cameras[cameraIndex]?.deviceId||null);
startDetection();
}
catch(e){
alert("Camera permission is required.");
closeScanner();
}
}


async function loadCameras(){

let temp=await navigator.mediaDevices.getUserMedia({
video:true,
audio:false
});

temp.getTracks().forEach(t=>t.stop());

let devices=await navigator.mediaDevices.enumerateDevices();

cameras=devices.filter(x=>x.kind==="videoinput");

document.getElementById("cameraSelect").innerHTML=
cameras.map((c,i)=>
`<option value="${i}">${c.label||"Camera "+(i+1)}</option>`
).join("");
}


async function startCamera(id){

if(stream){
stream.getTracks().forEach(t=>t.stop());
}

let videoConfig=id
?{
deviceId:{exact:id},
width:{ideal:1920},
height:{ideal:1080}
}
:{
facingMode:{ideal:"environment"},
width:{ideal:1920},
height:{ideal:1080}
};

stream=await navigator.mediaDevices.getUserMedia({
video:videoConfig,
audio:false
});

let video=document.getElementById("cameraVideo");

video.srcObject=stream;

await video.play();

zoomTrack=stream.getVideoTracks()[0];
}


async function switchCamera(){

if(!cameras.length)return;

cameraIndex=(cameraIndex+1)%cameras.length;

document.getElementById("cameraSelect").value=String(cameraIndex);

await startCamera(cameras[cameraIndex].deviceId);
}


async function setZoom(){

let c=zoomTrack?.getCapabilities?.();

if(c?.zoom){

let target=Math.max(c.zoom.min,Math.min(1,c.zoom.max));

await zoomTrack.applyConstraints({
advanced:[{zoom:target}]
});

toast("1× zoom requested");

}else{

toast("Lens control is not exposed by this browser");

}
}


/* BARCODE / QR DETECTION */

async function startDetection(){

if(!("BarcodeDetector" in window)){
toast("Barcode scanning is not supported in this browser");
return;
}

try{

let formats=await BarcodeDetector.getSupportedFormats();

let wanted=scanMode==="imei"
?["qr_code"]
:formats;

let valid=wanted.filter(x=>formats.includes(x));

let detector=new BarcodeDetector({formats:valid});

async function loop(){

if(document.getElementById("scanner").classList.contains("hidden"))return;

try{

let result=await detector.detect(
document.getElementById("cameraVideo")
);

if(result.length){

handleScanResult(result[0].rawValue);
return;

}

}catch(e){}

detectTimer=requestAnimationFrame(loop);

}

loop();

}catch(e){

toast("Scanner could not initialize");

}
}


/* SIM XML PARSER */

function extractSIMFromXML(value){

let text=String(value||"").trim();

let match=text.match(
/(?:^|\s)simNo\s*=\s*["']([^"']+)["']/i
);

if(match)return match[1].trim();

try{

let doc=new DOMParser().parseFromString(
text,
"application/xml"
);

let value2=doc.documentElement?.getAttribute("simNo");

if(value2)return value2.trim();

}catch(e){}

return text;
}


/* SCAN RESULT */

function handleScanResult(value){

let result=String(value||"").trim();

if(scanMode==="sim"){
result=extractSIMFromXML(result);
}

if(scanMode==="imei"){

if(!/^\d+$/.test(result)||result.length<=10){

toast("Invalid IMEI");

return;

}

let target=
document.getElementById("inventoryImei")||
document.getElementById("dispatchImei")||
document.getElementById("installImei");

if(scanMode==="dispatchImei")
target=document.getElementById("dispatchImei");

if(scanMode==="installImei")
target=document.getElementById("installImei");

if(target)target.value=result;

toast("IMEI captured");

}else{

let target=document.getElementById("inventorySim");

if(target)target.value=result;

toast("SIM captured");
}

closeScanner();
}


function closeScanner(){

if(detectTimer){
cancelAnimationFrame(detectTimer);
detectTimer=null;
}

if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}

document.getElementById("scanner").classList.add("hidden");
}


/* CAMERA SELECT */

document.getElementById("cameraSelect").addEventListener("change",async function(){

let index=Number(this.value);

if(cameras[index]){
cameraIndex=index;
await startCamera(cameras[index].deviceId);
}

});

</script>
