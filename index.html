<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#063b70">
<title>TRAK MOTION GPS</title>
<style>
:root{
  --navy:#063b70;--navy2:#075a9e;--blue:#1677e8;--cyan:#18b9d1;
  --green:#25b96a;--orange:#ffab12;--purple:#6654e9;--pink:#ef4f8b;
  --red:#e85d6e;--bg:#f3f7fb;--text:#183550;--muted:#71869b;
  --line:#e4edf4;--card:#fff;--shadow:0 4px 14px rgba(22,63,97,.08);
}
*{box-sizing:border-box}
body{margin:0;background:#dce7f0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
#app{width:min(430px,100%);min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.header{height:65px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:10px 13px;display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:10}
.pin{width:31px;height:31px;border-radius:50%;background:#fff;color:#0873d5;display:grid;place-items:center;font-size:18px}
.brand{font-weight:900;font-size:13px;line-height:1}.brand small{display:block;font-size:7px;font-weight:500;opacity:.85;margin-top:2px}
.avatar{width:31px;height:31px;border-radius:50%;background:#fff;color:#3857b0;display:grid;place-items:center;font-size:10px;font-weight:900}
.grow{flex:1}.headbtn{border:0;background:transparent;color:#fff;font-size:21px;width:29px;height:29px}
.title{font-size:14px;font-weight:850}
main{padding:12px 12px 82px}
.hero{background:linear-gradient(135deg,#eefaff,#e3f5fd);border:1px solid #d9edf6;border-radius:12px;padding:13px;margin-bottom:10px}
.heroRow{display:flex;justify-content:space-between}.hello{font-size:10px;color:#627b91}.hero h1{font-size:17px;margin:2px 0}.hero p{font-size:8px;color:#6b8092;margin:0}.date{font-size:8px;color:#5d7489;text-align:right}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:0;border-radius:11px;min-height:91px;padding:10px;text-align:left;color:#fff;box-shadow:var(--shadow)}
.kpi.p{background:linear-gradient(135deg,#6150e4,#7862ee)}.kpi.g{background:linear-gradient(135deg,#2db86a,#4ac97e)}
.kpi.o{background:linear-gradient(135deg,#ffb00f,#ff9710)}.kpi.c{background:linear-gradient(135deg,#11b9d0,#22bfd0)}
.kpi .ico{font-size:18px}.kpi small{display:block;font-size:8px;margin-top:3px}.kpi b{display:block;font-size:18px;margin:2px 0}.kpi em{font-size:7px;font-style:normal;opacity:.92}
.section{font-size:11px;font-weight:900;margin:14px 2px 7px}
.card{background:#fff;border-radius:11px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:9px;min-height:58px;padding:9px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row.click{cursor:pointer}
.icon{width:34px;height:34px;border-radius:10px;background:#eef6ff;color:var(--blue);display:grid;place-items:center;flex:none;font-size:17px}
.content{flex:1;min-width:0}.rt{font-size:9.5px;font-weight:850}.rs{font-size:7.5px;color:var(--muted);line-height:1.45;margin-top:2px}.arrow{font-size:17px;color:#8295a7}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:9px;padding:1px}.tab{border:0;background:#edf3f8;color:#70849a;border-radius:18px;padding:8px 12px;font-size:7.5px;font-weight:850;white-space:nowrap}.tab.active{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#fff;border-radius:10px;padding:9px;text-align:center;box-shadow:var(--shadow)}.stat small{display:block;font-size:7px;color:var(--muted)}.stat strong{display:block;font-size:15px;margin-top:3px}.stat.blue strong{color:#27559c}.stat.green strong{color:#16975b}.stat.red strong{color:#d95364}
.stateHero{background:linear-gradient(135deg,#fbf9ff,#f0f8ff);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:9px;border:1px solid #e5eaf4}.stateMap{font-size:30px}.stateHero b{font-size:14px}
.chip{display:inline-block;border-radius:20px;padding:3px 7px;font-size:6.8px;font-weight:900;vertical-align:middle}.active{background:#dff7ea;color:#15935a}.inactive{background:#ffe3e8;color:#d94d5e}.warn{background:#fff0d3;color:#ae6c00}.bluechip{background:#e3efff;color:#176ec5}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.action{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 4px;box-shadow:var(--shadow);color:var(--text)}.action span{display:block;color:var(--blue);font-size:18px}.action b{font-size:7.5px;display:block;margin-top:4px}
.form{background:#fff;border-radius:11px;padding:11px;box-shadow:var(--shadow)}.field{margin-bottom:9px}.field label{display:block;font-size:7.5px;font-weight:900;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #dce7ef;border-radius:8px;background:#fbfdff;padding:9px;font-size:8.5px;outline:0}.field textarea{min-height:58px}.primary{width:100%;border:0;border-radius:9px;padding:11px;background:linear-gradient(135deg,#0875da,#0753a2);color:#fff;font-size:8.5px;font-weight:900}.secondary{border:1px solid #d6e3ee;background:#fff;color:#146ec7;border-radius:8px;padding:7px 9px;font-size:7.5px;font-weight:850}
.search{display:flex;gap:5px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px}.search input{flex:1;border:0;outline:0;font-size:8.5px}.search button{border:0;background:#e9f3ff;color:var(--blue);border-radius:7px;padding:6px 9px}
.timeline .event{display:flex;gap:9px;position:relative;padding-bottom:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:3px}.event:not(:last-child):before{content:"";position:absolute;left:4px;top:12px;width:1px;height:calc(100% - 5px);background:#d5e3ee}.event b{font-size:8.5px}.event small{display:block;color:var(--muted);font-size:7px;margin-top:2px}
.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:64px;background:rgba(255,255,255,.97);border-top:1px solid #dce6ee;display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav{border:0;background:transparent;color:#73879b;font-size:7px;font-weight:700}.nav span{display:block;font-size:17px;margin-bottom:2px}.nav.on{color:#0875da;font-weight:900}
.toast{position:fixed;z-index:50;bottom:74px;left:50%;transform:translate(-50%,15px);background:#173550;color:#fff;border-radius:9px;padding:9px 12px;font-size:8px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none}
.scannerOverlay{position:fixed;inset:0;background:rgba(0,20,40,.92);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.scannerOverlay.show{display:flex}.scannerBox{width:min(390px,100%);background:#fff;border-radius:16px;padding:12px;box-shadow:0 15px 50px rgba(0,0,0,.35)}.scannerVideo{width:100%;aspect-ratio:1/1;border-radius:12px;background:#061827;object-fit:cover}.scanFrame{position:absolute;inset:15%;border:2px solid #18b9d1;border-radius:18px;pointer-events:none}.scannerStage{position:relative}.scannerActions{display:flex;gap:7px;margin-top:9px}.cameraSelect{width:100%;margin:7px 0 2px;padding:9px 10px;border:1px solid #d8e2eb;border-radius:10px;background:#fff;color:#10263a;font-size:9px;font-weight:800;outline:none}.scannerActions button{flex:1}.roleBadge{font-size:7px;background:#e8f3ff;color:#176ec5;border-radius:12px;padding:4px 7px;font-weight:900}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div><div id="scanner" class="scannerOverlay"><div class="scannerBox"><div class="section" style="margin:2px 0 7px">QR Scanner</div><div class="scannerStage"><video id="scannerVideo" class="scannerVideo" playsinline muted></video><div class="scanFrame"></div></div><select id="cameraSelect" class="cameraSelect" onchange="changeCamera(this.value)" aria-label="Select rear camera"><option value="">Selecting rear camera…</option></select><div class="rs" style="margin:7px 1px">Rear camera preferred • Select Main/Wide/1x when available • QR only • camera stops when closed</div><div class="scannerActions"><button class="secondary" onclick="manualScanFallback()">Manual</button><button class="secondary" onclick="stopScanner()">Close</button></div><div id="manualScan" class="hidden" style="margin-top:8px"><div class="search"><input id="manualQr" placeholder="Paste / type QR value"><button onclick="applyScan()">Use</button></div></div></div></div>
<script>
const D={
  partners:[["R K Enterprises","Retail Partner","+91 98765 43210","Active"],["S K Associates","Distributor Partner","+91 87654 32109","Active"],["M G Trading","Channel Partner","+91 76543 21098","Inactive"],["A P Solutions","Retail Partner","+91 65432 10987","Active"],["V S Telecom","Distributor Partner","+91 54321 09876","Active"]],
  installers:[["R S Telecom","Senior Installer","+91 98765 12345","Active"],["A K Solutions","Senior Installer","+91 87654 23456","Active"],["P J Enterprises","Field Installer","+91 76543 34567","Inactive"],["M D Telecom","Senior Installer","+91 65432 45678","Active"],["S T Network","Field Installer","+91 54321 56789","Active"]],
  states:[["Bihar",80,68,12,"🟪"],["Jharkhand",90,75,15,"🟩"],["Uttar Pradesh",100,82,18,"🟧"],["Maharashtra",45,38,7,"🟦"],["Others",32,26,6,"🩷"]],
  stock:[["Bihar",320,890,"🟪"],["Jharkhand",280,760,"🟩"],["Uttar Pradesh",350,1020,"🟧"],["Maharashtra",180,540,"🟦"],["Others",115,310,"🩷"]],
  devices:[
    ["862145123456789","Tracker Pro","12V","Locked","IN STOCK","Bihar"],
    ["862145987654321","Tracker Mini","24V","Locked","PACKED","Jharkhand"],
    ["862145112233445","Tracker Pro","12V","Unlocked","DISPATCHED","Uttar Pradesh"],
    ["862145556677889","Tracker Pro","12V","Locked","DELIVERED","Maharashtra"],
    ["862145998877665","Tracker Mini","24V","Locked","INSTALLED","Delhi"]
  ]
};
const TAGS=[
  {name:"Bihar • Patna",type:"District",count:12},
  {name:"Bihar • Gaya",type:"District",count:8},
  {name:"Bihar • Muzaffarpur",type:"District",count:7},
  {name:"Jharkhand • Ranchi",type:"District",count:10},
  {name:"Jharkhand • Dhanbad",type:"District",count:6},
  {name:"UP • Varanasi",type:"District",count:14},
  {name:"UP • Lucknow",type:"District",count:11},
  {name:"New Installation",type:"Work Type",count:18},
  {name:"Installation Pending",type:"Work Type",count:9},
  {name:"Follow-up Required",type:"Work Type",count:6}
];
let screen="home",history=[],device=D.devices[0];
let state={user:{role:"ADMIN",branch:"ALL",installerId:"INS-001",partnerId:"PT-BR-001"},tasks:[],searchMode:"IMEI Last 6",scannerStream:null,scanTarget:null};
const DEMO_MODE=true;const APPS_SCRIPT_URL="";
function mockApi(action,payload={}){if(DEMO_MODE)return Promise.resolve({ok:true,action,data:payload});return fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})}).then(r=>r.json())}
function can(p){const r=state.user.role;if(p==="admin")return r==="ADMIN";if(p==="ops")return ["ADMIN","MANAGER","INVENTORY"].includes(r);if(p==="view")return ["ADMIN","MANAGER","INVENTORY","VIEW ONLY"].includes(r);if(p==="installer")return r==="INSTALLER";if(p==="partner")return r==="PARTNER";if(p==="stock")return ["ADMIN","MANAGER","INVENTORY","VIEW ONLY"].includes(r);if(p==="search")return ["ADMIN","MANAGER","INVENTORY","PARTNER","VIEW ONLY"].includes(r);if(p==="tasks")return ["ADMIN","MANAGER","INVENTORY","INSTALLER"].includes(r);return false}
function visibleInventory(){const r=state.user.role;if(r==="INSTALLER")return D.devices.filter(x=>x.installerId===state.user.installerId);if(r==="PARTNER")return D.devices.filter(x=>x.partnerId===state.user.partnerId);return D.devices}
function parseImeiQR(raw){const s=String(raw||"").trim();const m=s.match(/(?:IMEI|imei)\s*[:=]\s*([0-9]{15})/i)||s.match(/\b([0-9]{15})\b/);return m?m[1]:""}
function parseSimQR(raw){const s=String(raw||"").trim();let m=s.match(/simNo\s*=\s*["']([^"']+)["']/i);if(!m)m=s.match(/simNo\s*[:=]\s*([A-Za-z0-9]+)/i);return m?m[1]:""}

function go(s){if(screen!==s)history.push(screen);screen=s;render();scrollTo(0,0)}
function back(){screen=history.pop()||"home";render();scrollTo(0,0)}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2200)}
function status(x){let c=x==="Active"||x==="INSTALLED"?"active":x==="Inactive"?"inactive":x==="DISPATCHED"||x==="DELIVERED"?"warn":"bluechip";return `<span class="chip ${c}">${x}</span>`}
function row(icon,title,sub,action="",extra=""){return `<div class="row ${action?"click":""}" ${action?`onclick="${action}"`:""}><div class="icon">${icon}</div><div class="content"><div class="rt">${title}</div><div class="rs">${sub}</div></div>${extra}<div class="arrow">›</div></div>`}
function stats(a,b,c){return `<div class="stat ${c}"><small>${a}</small><strong>${b}</strong></div>`}
function header(title=""){return `<header class="header"><button class="headbtn" onclick="${title?"back()":"toast('Menu')"}">${title?"‹":"☰"}</button>${!title?'<div class="pin">⌖</div>':""}<div class="${title?"title":"brand"}">${title||"TRAK MOTION"}${!title?'<small>All-in-One Management</small>':""}</div><div class="grow"></div>${title?'<button class="headbtn" onclick="go(\'search\')">⌕</button><button class="headbtn" onclick="toast(\'Filters opened\')">⚑</button>':'<button class="headbtn" onclick="toast(\'3 notifications: task due • KYC • overdue\')">♧</button><div class="avatar">AD</div>'}</header>`}
function home(){
return `<main>
<div class="hero"><div class="heroRow"><div><div class="hello">Good Morning,</div><h1>Admin <span class="chip bluechip">ADMIN</span></h1><p>Everything in one place. Simple outside. Powerful inside.</p></div><div class="date">12 Apr 2025<br>Saturday</div></div></div>
<div class="grid">
<button class="kpi p" onclick="go('partners')"><span class="ico">♙</span><small>Total Partners</small><b>270</b><em>Active: 212 | Inactive: 58</em></button>
<button class="kpi g" onclick="go('installers')"><span class="ico">♙</span><small>Total Installers</small><b>48</b><em>Active: 34 | Inactive: 14</em></button>
<button class="kpi o" onclick="go('inventory')"><span class="ico">▣</span><small>Combined Inventory</small><b>1,284</b><em>Admin • All states</em></button>
<button class="kpi c" onclick="toast('SIM Remaining 9,998 = received - used + adjustments')"><span class="ico">▤</span><small>SIM Remaining</small><b>9,998</b><em>Stock & history</em></button>
</div>
<div class="section">Quick Actions</div><div class="actions">
<button class="action" onclick="go('inward')"><span>＋</span><b>Inward</b></button><button class="action" onclick="go('dispatch')"><span>⇢</span><b>Dispatch</b></button><button class="action" onclick="go('delivery')"><span>✓</span><b>Delivery</b></button><button class="action" onclick="scan()"><span>⌗</span><b>Scan QR</b></button><button class="action" onclick="go('tasks')"><span>◷</span><b>Tasks</b></button><button class="action" onclick="go('customer')"><span>♙</span><b>Customers</b></button></div>
<div class="section">State-wise Overview</div><div class="card">${row("⌖","State-wise Overview","Partners & Installers","go('partners')")}${row("▣","Inventory (State-wise)","Devices & SIM stock","go('inventory')")}${row("◷","Recent Activities","Permanent lifecycle history","go('history')")}</div>
</main>`}
function partners(){return `<main>${tabs(["All","State-wise","KYC","Master"],0)}<div class="grid">${stats("Total Partners","270","blue")}${stats("Active Partners","212","green")}</div><div class="section">State-wise Partners</div><div class="card">${D.states.map((s,i)=>row(s[4],s[0],`Total: ${s[1]} • Active: ${s[2]} | Inactive: ${s[3]}`,`go('${i===0?"partnerState":"partners"}')`)).join("")}</div></main>`}
function partnerState(){return `<main><div class="stateHero"><div class="stateMap">🟪</div><div><b>Bihar</b><div class="rs">Partner Accounts</div></div></div><div class="stats">${stats("Total","80","blue")}${stats("Active","68","green")}${stats("Inactive","12","red")}</div><div class="section">Partner Accounts (Bihar)</div><div class="card">${D.partners.map((p,i)=>row(p[0].slice(0,2),`${p[0]} ${status(p[3])}`,`${p[1]} • ${p[2]}<br>Partner ID PT-BR-00${i+1} • KYC Verified`,"go('partnerDetail')")).join("")}</div></main>`}
function partnerDetail(){return `<main><div class="form"><div class="row" style="padding:0 0 10px"><div class="icon">RK</div><div class="content"><div class="rt">R K Enterprises</div><div class="rs">Retail Partner • Bihar</div></div>${status("Active")}</div>${row("ID","Partner ID","PT-BR-001 • Account Active")}${row("✓","KYC Status","Verified • Bank information not collected","go('partnerKyc')")}<div class="section">KYC Documents</div><div class="actions"><button class="action" onclick="toast('File picker opened')"><span>＋</span><b>Add File</b></button><button class="action" onclick="toast('Camera opened')"><span>⌾</span><b>Camera</b></button><button class="action" onclick="go('partnerKyc')"><span>▤</span><b>View KYC</b></button></div></div></main>`}
function installers(){return `<main>${tabs(["All","State-wise","Type","KYC","Master"],0)}<div class="grid">${stats("Total Installers","48","blue")}${stats("Active Installers","34","green")}</div><div class="section">State-wise Installers</div><div class="card">${D.states.map((s,i)=>row(s[4],s[0],`Total: ${[60,55,40,20,11][i]} • Active: ${[48,44,32,16,9][i]} | Inactive: ${[12,11,8,4,2][i]}`,`go('${i===2?"installerState":"installers"}')`)).join("")}</div></main>`}
function installerState(){return `<main><div class="stateHero"><div class="stateMap">🟧</div><div><b>Uttar Pradesh</b><div class="rs">Installer Accounts</div></div></div><div class="stats">${stats("Total","40","blue")}${stats("Active","32","green")}${stats("Inactive","8","red")}</div><div class="section">District / Work Tags</div><div class="card">${row("#","UP • Varanasi","District tag • 14 tagged installers","go('tags')")}${row("#","New Installation","Work Type tag • 18 tagged records","go('tags')")}</div><div class="section">Installer Accounts (Uttar Pradesh)</div><div class="card">${D.installers.map(p=>row(p[0].slice(0,2),`${p[0]} ${status(p[3])}`,`${p[1]} • ${p[2]}<br>Installer ID INS-001 • KYC Verified`,"go('tags')")).join("")}</div></main>`}
function inventory(){return `<main>${tabs(["All","State-wise","Devices","SIMs","Combined"],0)}<div class="grid">${stats("Total Devices","1,284","blue")}${stats("Total SIMs","3,420","green")}</div><div class="section">State-wise Inventory</div><div class="card">${D.stock.map(s=>row(s[3],s[0],`Devices: ${s[1]} • SIMs: ${s[2]}`,`toast('${s[0]}: ${s[1]} devices')`)).join("")}</div><div class="section">Device Status</div><div class="card">${["IN STOCK","PACKED","DISPATCHED","DELIVERED","INSTALLED"].map(x=>row("▣",x,"Open actual device records",`go('devices')`)).join("")}</div></main>`}
function devices(){return `<main><div class="tabs"><button class="tab active">Device Records</button><button class="tab" onclick="toast('Filters: status • state • branch')">Filters</button></div><div class="card">${D.devices.map((d,i)=>row("▣",`••••••${d[0].slice(-6)} ${status(d[4])}`,`${d[1]} • Relay ${d[2]} • ${d[5]}`,`device=D.devices[${i}];go('device')`)).join("")}</div></main>`}
function devicePage(){let d=device;return `<main><div class="form">${row("▣","IMEI (Last 6)",`••••••${d[0].slice(-6)} • ${d[5]}`,"",status(d[4]))}${row("▤","Device Model",d[1])}${row("⚡","Relay",d[2])}${row("◈","Locking Status",d[3])}${row("SIM","SIM Status",d[4]==="INSTALLED"?"ACTIVE":"INACTIVE")}${row("♙","Customer","Rahul Kumar • BR01AB1234","go('customerDetail')")}${row("♙","Partner","R K Enterprises")}<div class="section">Lifecycle Timeline</div><div class="timeline">${[["INWARD","12 Apr 2025 • 09:41","Admin • Bihar"],["PACKED","12 Apr 2025 • 10:12","Inventory • Bihar"],["DISPATCHED","13 Apr 2025 • 15:20","DO-00021"],["DELIVERED","14 Apr 2025 • 11:05","Customer confirmation"],["INSTALLATION","Pending","Assigned installer"]].map(e=>`<div class="event"><span class="dot"></span><div><b>${e[0]}</b><small>${e[1]} • ${e[2]}</small></div></div>`).join("")}</div></div></main>`}
function combined(){return `<main>${tabs(["Overview","State-wise","Details"],0)}<div class="grid">${stats("Total Devices","1,284","blue")}${stats("Total SIMs","3,420","green")}</div><div class="section">State-wise Combined Inventory</div><div class="card">${D.stock.map(s=>`<div class="row"><div class="icon">${s[3]}</div><div class="content"><div class="rt">${s[0]}</div></div><b style="font-size:8px">${s[1]} devices</b><b style="font-size:8px;color:#168ca3">${s[2]} SIMs</b></div>`).join("")}</div><div class="section">Grand Total (Admin Only)</div><div class="stateHero"><div class="icon">▣</div><div><b>1,284 devices • 3,420 SIMs</b><div class="rs">All states combined</div></div></div></main>`}
function operations(){return `<main><div class="actions"><button class="action" onclick="go('inward')"><span>＋</span><b>Inward</b></button><button class="action" onclick="go('dispatch')"><span>⇢</span><b>Dispatch</b></button><button class="action" onclick="go('delivery')"><span>✓</span><b>Delivery</b></button><button class="action" onclick="scan()"><span>⌗</span><b>Scan QR</b></button><button class="action" onclick="go('installation')"><span>⚙</span><b>Installation</b></button><button class="action" onclick="go('tasks')"><span>◷</span><b>Tasks</b></button></div><div class="section">Operational Flow</div><div class="card">${row("⌗","SCAN → SELECT → CONFIRM → DONE","QR-first workflow","scan()")}${row("▣","One device = one master record","No duplicate device records")}${row("◷","Permanent history","Inward → Packing → Dispatch → Delivery → Installation","go('history')")}</div></main>`}

function searchPage(){return `<main><div class="tabs">${["IMEI Last 6","Vehicle Number","Customer Name","Customer User ID","Tag"].map(x=>`<button class="tab ${state.searchMode===x?"active":""}" onclick="state.searchMode='${x}';render()">${x}</button>`).join("")}</div><div class="search"><input id="q" placeholder="${state.searchMode==='Tag'?"Search tag / district / work type":"Search "+state.searchMode}"><button onclick="doSearch()">⌕</button>${state.searchMode==='IMEI Last 6'?`<button onclick="openScanner('search')">⌗</button>`:''}</div><div id="results" style="margin-top:9px"></div></main>`}
function doSearch(){const q=(document.getElementById("q")?.value||"").trim();const low=q.toLowerCase();let html="";if(!q){html=`<div class="card">${row("⌕","No search yet","Enter a value and tap Find")}</div>`}else if(state.searchMode==="Tag"){const list=TAGS.filter(t=>t.name.toLowerCase().includes(low)||t.type.toLowerCase().includes(low));html=`<div class="card">${list.map(t=>row("#",t.name,`${t.type} • ${t.count} tagged records`,`toast('Tag: ${t.name}')`)).join("")||row("⌕","No matching record","No matching record found.")}</div>`}else{const ok=(state.searchMode==="IMEI Last 6"&&q==="123456")||(state.searchMode==="Vehicle Number"&&low==="br01ab1234")||(state.searchMode==="Customer Name"&&low.includes("rahul kumar"))||(state.searchMode==="Customer User ID"&&low==="usr001");html=ok?`<div class="card">${row("▣","Rahul Kumar","BR01AB1234 • USR001 • IMEI ••••••123456","device=D.devices[0];go('device')")}${row("☎","Customer Contact","+91 98765 43210","go('customerDetail')")}</div>`:`<div class="card">${row("⌕","No matching record found.","Try the exact demo value or another search method")}</div>`}document.getElementById("results").innerHTML=html}

function more(){return `<main><div class="card">${row("◷","Task Center","Pending, assigned, due today, overdue","go('tasks')")}${row("♙","Add Customer","Customer + vehicle + device linkage","go('customer')")}${row("⇧","Import Existing Data","CSV / XLSX analysis","go('import')")}${row("◷","History","Permanent lifecycle & audit","go('history')")}${row("▤","Partner KYC","No bank information","go('partnerKyc')")}${row("▤","Installer KYC","Documents + review","go('installerKyc')")}${row("#","Tag Center","District, work type & custom tags • searchable","go('tags')")}${row("⚙","Settings","Roles, reminders, language","go('settings')")}</div></main>`}
function tags(){return `<main><div class="card"><div class="section" style="margin-top:0">Tag Search</div><div class="search"><input id="tagQ" placeholder="Search 100+ tags e.g. Patna / New Installation"><button onclick="searchTags()">⌕</button></div><div class="rs" style="margin-top:7px">Search by district, work type, installer, customer or custom tag.</div></div><div class="section">Create / Apply Tag</div><div class="actions"><button class="action" onclick="toast('Create Tag: enter name + type')"><span>＋</span><b>Create Tag</b></button><button class="action" onclick="toast('Select a record first, then apply multiple tags')"><span>✓</span><b>Apply Tags</b></button><button class="action" onclick="toast('Multiple tags can be attached to one record')"><span>#</span><b>Multi Tag</b></button></div><div class="section">Popular / Recent Tags</div><div id="tagResults" class="card">${TAGS.map(t=>row("#",t.name,`${t.type} • ${t.count} records`,"toast('Tag selected')")).join("")}</div><div class="section">District Coverage</div><div class="card">${row("⌖","Bihar","38 districts • tag each installer by district","toast('Bihar district tags')")}${row("⌖","Jharkhand","24 districts • tag each installer by district","toast('Jharkhand district tags')")}${row("⌖","Uttar Pradesh","75 districts • tag each installer by district","toast('UP district tags')")}</div></main>`}
function searchTags(){const q=(document.getElementById("tagQ")?.value||"").trim().toLowerCase();const list=TAGS.filter(t=>!q||t.name.toLowerCase().includes(q)||t.type.toLowerCase().includes(q));document.getElementById("tagResults").innerHTML=list.length?list.map(t=>row("#",t.name,`${t.type} • ${t.count} records`,"toast('Tag selected')")).join(""):`<div class="empty">No matching tag found.</div>`}
function importPage(){return `<main><div class="stats">${stats("Ready to Import","15","green")}${stats("Needs Review","3","blue")}${stats("Duplicate","2","red")}</div><div class="stats" style="margin-top:7px">${stats("Invalid","1","red")}${stats("Format","CSV/XLSX","blue")}${stats("Mode","Demo","green")}</div><div class="section">Actions</div><div class="actions"><button class="action" onclick="toast('CSV/XLSX picker opened')"><span>＋</span><b>Add File</b></button><button class="action" onclick="toast('Analysis complete')"><span>⌕</span><b>Analyze</b></button><button class="action" onclick="toast('Preview generated')"><span>▤</span><b>Preview</b></button></div><button class="primary" style="margin-top:9px" onclick="toast('Demo only • backend not connected')">Confirm Import</button></main>`}
function partnerKyc(){return `<main><div class="form"><div class="section" style="margin-top:0">Basic Details</div>${["Partner Name *","Partner Type","Mobile *","State","Address"].map(x=>field(x,"x","Enter "+x)).join("")}<div class="section">Identity Documents</div><div class="actions"><button class="action" onclick="toast('Aadhaar Front picker/camera')"><span>＋</span><b>Aadhaar Front</b></button><button class="action" onclick="toast('Aadhaar Back picker/camera')"><span>＋</span><b>Aadhaar Back</b></button><button class="action" onclick="toast('PAN picker/camera')"><span>＋</span><b>PAN</b></button></div><div class="section">Business Details</div>${field("Business Proof","bp","Add proof") }<div class="section">Verification</div><div class="card" style="padding:9px">${status("Active")}<div class="rs">No Bank Account, IFSC or Cancelled Cheque fields.</div></div></div></main>`}
function installerKyc(){return `<main><div class="form"><div class="section" style="margin-top:0">Basic Details</div>${["Installer Name *","Installer Type","Mobile *","State","Address"].map(x=>field(x,"ix","Enter "+x)).join("")}<div class="section">Identity Documents</div><div class="actions">${["Aadhaar Front","Aadhaar Back","PAN"].map(x=>`<button class="action" onclick="toast('${x}: Add File / Camera')"><span>＋</span><b>${x}</b></button>`).join("")}</div><div class="section">Other Documents</div><div class="actions">${["Photo","Address Proof","Work / Trade Proof"].map(x=>`<button class="action" onclick="toast('${x}: Add File / Camera')"><span>＋</span><b>${x}</b></button>`).join("")}</div><div class="section">Review / Correction</div><button class="primary" onclick="toast('KYC submitted for review')">Submit KYC</button></div></main>`}
function historyPage(){return `<main>${tabs(["All","Device","Movement","Audit"],0)}<div class="card">${[["INWARD","••••••123456","Admin • 12 Apr 2025 09:41"],["PACKED","••••••123456","Inventory • 12 Apr 2025 10:12"],["DISPATCHED","••••••123456","DO-00021 • 13 Apr 2025 15:20"],["DELIVERED","••••••123456","Customer • 14 Apr 2025 11:05"],["INSTALLATION","Rahul Kumar","Assigned • 14 Apr 2025 12:00"]].map(x=>row("◷",x[0],x[1]+" • "+x[2],"device=D.devices[0];go('device')")).join("")}</div></main>`}
function settings(){return `<main><div class="card"><div class="section" style="margin:0 0 7px">Demo Role Switch</div><div class="search"><select onchange="state.user.role=this.value;toast('Role changed to '+this.value);render()" style="flex:1;border:0;outline:0;background:#fff;font-size:8px">${["ADMIN","MANAGER","INVENTORY","INSTALLER","PARTNER","VIEW ONLY"].map(r=>`<option ${state.user.role===r?"selected":""}>${r}</option>`).join("")}</select></div>${row("◉","Role","Current: "+state.user.role,"toast('Role permissions are demo-enforced')")}${row("⌁","Reminders","Installation • Follow-up • Delivery • Overdue","toast('Reminder settings')")}${row("文","Language","English • Hindi available","toast('Language selector')")}${row("♢","Notifications","Operational alerts enabled","toast('Notifications enabled')")}${row("☁","Backend","DEMO_MODE = true • Apps Script OFF","toast('Backend not connected')")}</div></main>`}
function tabs(a,n){return `<div class="tabs">${a.map((x,i)=>`<button class="tab ${i===n?"active":""}" onclick="toast('${x} selected')">${x}</button>`).join("")}</div>`}
function cameraScore(label){const s=String(label||"").toLowerCase();let score=0;if(/front|user|facetime|selfie/.test(s))score-=200;if(/back|rear|environment|main|primary/.test(s))score+=50;if(/wide|1x|normal/.test(s))score+=20;if(/ultra|0\.5x|0,5x|uw|ultrawide/.test(s))score-=100;return score}
async function listCameras(){const sel=document.getElementById("cameraSelect");if(!sel||!navigator.mediaDevices?.enumerateDevices)return [];const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");const rear=devices.filter(d=>cameraScore(d.label)>0);const list=rear.length?rear:devices;list.sort((a,b)=>cameraScore(b.label)-cameraScore(a.label));sel.innerHTML=list.length?list.map((d,i)=>{const label=d.label||((cameraScore(d.label)>0?"Rear Camera ":"Camera ")+(i+1));return "<option value=\""+d.deviceId+"\">"+label+"</option>"}).join(""):"<option value=\"\">No camera found</option>";return list}
async function changeCamera(deviceId){if(!deviceId)return;state.cameraDeviceId=deviceId;await startScanner(deviceId)}
async function openScanner(target="search"){state.scanTarget=target;document.getElementById("scanner").classList.add("show");const video=document.getElementById("scannerVideo");try{if(!navigator.mediaDevices?.getUserMedia)throw new Error("camera unsupported");
// First request rear-camera permission, then enumerate so Android exposes camera names/lenses.
const permission=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});permission.getTracks().forEach(t=>t.stop());
const cams=await listCameras();
const preferred=state.cameraDeviceId||cams[0]?.deviceId;
if(!preferred)throw new Error("no camera");
await startScanner(preferred);
}catch(e){toast("Rear camera unavailable • select/allow camera or use Manual");manualScanFallback()}}
async function startScanner(deviceId){const video=document.getElementById("scannerVideo");if(state.scannerStream){state.scannerStream.getTracks().forEach(t=>t.stop());state.scannerStream=null}try{const constraints=deviceId?{video:{deviceId:{exact:deviceId},width:{ideal:1280},height:{ideal:720}}}:{video:{facingMode:{exact:"environment"},width:{ideal:1280},height:{ideal:720}}};const stream=await navigator.mediaDevices.getUserMedia(constraints);state.scannerStream=stream;state.cameraDeviceId=stream.getVideoTracks()[0]?.getSettings?.().deviceId||deviceId||"";video.srcObject=stream;await video.play();const sel=document.getElementById("cameraSelect");if(sel&&state.cameraDeviceId)sel.value=state.cameraDeviceId;if("BarcodeDetector" in window){const detector=new BarcodeDetector({formats:["qr_code"]});const tick=async()=>{if(!state.scannerStream)return;try{const codes=await detector.detect(video);if(codes.length){handleScan(codes[0].rawValue);return}}catch(e){}requestAnimationFrame(tick)};tick()}else{toast("QR detector unavailable • use Manual")}}catch(e){toast("Selected camera could not open • choose another camera");manualScanFallback()}}
function stopScanner(){if(state.scannerStream){state.scannerStream.getTracks().forEach(t=>t.stop());state.scannerStream=null}const v=document.getElementById("scannerVideo");if(v)v.srcObject=null;document.getElementById("scanner").classList.remove("show");document.getElementById("manualScan").classList.add("hidden")}
function handleScan(raw){applyScan(raw)}
function manualScanFallback(){document.getElementById("manualScan").classList.toggle("hidden")}
function applyScan(raw){const value=String(raw||document.getElementById("manualQr")?.value||"").trim();if(!value){toast("No QR value entered");return}const target=state.scanTarget;const parsed=target==="sim"?parseSimQR(value):parseImeiQR(value)||value;if(target==="sim"){const el=document.getElementById("sim");if(el)el.value=parsed}else if(target==="inward"||target==="delivery"||target==="installation"){const ids={inward:"imei",delivery:"deliveryImei",installation:"installImei"};const el=document.getElementById(ids[target]);if(el)el.value=parsed.slice(-6)}else if(target==="search"){stopScanner();go("search");setTimeout(()=>{state.searchMode="IMEI Last 6";render();const q=document.getElementById("q");if(q){q.value=parsed.slice(-6);doSearch()}},0);return}stopScanner();toast("QR scanned successfully");render()}
function scan(){openScanner("search")}
function render(){
let body="",title="";
if(screen==="home"){body=home()}else if(screen==="partners"){title="Partners";body=partners()}else if(screen==="partnerState"){title="Bihar - Partners";body=partnerState()}else if(screen==="partnerDetail"){title="Partner Account";body=partnerDetail()}else if(screen==="installers"){title="Installers";body=installers()}else if(screen==="installerState"){title="Uttar Pradesh - Installers";body=installerState()}else if(screen==="inventory"){title="Inventory";body=inventory()}else if(screen==="devices"){title="Devices";body=devices()}else if(screen==="device"){title="Device Detail";body=devicePage()}else if(screen==="combined"){title="Combined Inventory";body=combined()}else if(screen==="operations"){title="Operations";body=operations()}else if(screen==="inward"){title="New Inward";body=inward()}else if(screen==="dispatch"){title="Dispatch";body=dispatch()}else if(screen==="delivery"){title="Delivery";body=delivery()}else if(screen==="installation"){title="Installation";body=installation()}else if(screen==="tasks"){title="To-do";body=tasks()}else if(screen==="customer"){title="Add Customer";body=customer()}else if(screen==="customerDetail"){title="Customer Detail";body=customerDetail()}else if(screen==="search"){title="Global Search";body=searchPage()}else if(screen==="more"){title="More";body=more()}else if(screen==="import"){title="Import Existing Data";body=importPage()}else if(screen==="partnerKyc"){title="Partner KYC";body=partnerKyc()}else if(screen==="installerKyc"){title="Installer KYC";body=installerKyc()}else if(screen==="history"){title="History";body=historyPage()}else if(screen==="settings"){title="Settings";body=settings()}else if(screen==="tags"){title="Tag Center";body=tags()}
const nav=screen==="home"?"home":["inventory","devices","device","combined"].includes(screen)?"stock":["operations","inward","dispatch","delivery","installation"].includes(screen)?"operations":screen==="tasks"?"todo":screen==="search"?"search":"more";
document.getElementById("app").innerHTML=header(title)+body+`<nav class="bottom">${[["home","⌂","Home"],["stock","▣","Stock"],["operations","⌘","Operations"],["todo","◷","To-do"],["search","⌕","Search"],["more","•••","More"]].map(n=>`<button class="nav ${nav===n[0]?"on":""}" onclick="go('${n[0]==="stock"?"inventory":n[0]==="todo"?"tasks":n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("")}</nav>`;
}
render();
</script>
