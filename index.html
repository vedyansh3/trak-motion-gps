<script>
'use strict';
/* =====================================================================
   TRAK MOTION GPS — Frontend (single file)
   Sections: 1 Config · 2 Utils · 3 State/Permissions · 4 API layer
             5 (removed) · 6 UI kit · 7 Screens · 8 Actions · 9 Scanner · 10 Boot
   ===================================================================== */

/* ---------- 1. CONFIG ---------- */
const CFG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbz-DSwi9o0m6ur9iJ7rJqfMfTOXrpWl-cjQ3Ua_0N3TjCBwmLLZCY56OsBHtnI-ReWe3g/exec'
};
/* ---------- 2. UTILS ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
};
const last6 = i => String(i || '').slice(-6);
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fdt(ts) { if (!ts) return '—'; const d = new Date(ts); if (isNaN(d)) return String(ts); return `${pad(d.getDate())} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fd(ts) { if (!ts) return '—'; const d = new Date(ts); if (isNaN(d)) return String(ts); return `${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`; }
const nowISO = () => new Date().toISOString();
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const timeStr = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const n0 = v => (v === undefined || v === null || v === '') ? '—' : (typeof v === 'number' ? v.toLocaleString('en-IN') : esc(v));

const BRANCHES = ['Varanasi', 'Ranchi', 'Dehri', 'Others'];
const MODELS = ['BR05M', 'BR05 V5', 'SK05', 'OTHERS'];
const RELAYS = ['12V', '24V', 'Other'];
const STATES = ['Bihar', 'Jharkhand', 'Uttar Pradesh'];
const STATUSES = ['IN STOCK', 'PACKED', 'DISPATCHED', 'DELIVERED', 'INSTALLED', 'RETURNED'];
const PARTY_TYPES = ['Dealer', 'Distributor', 'Installer', 'Car Mechanic', 'Car Accessories', 'Customer'];
const PARTNER_TYPES = ['Dealer', 'Distributor', 'Car Mechanic', 'Car Accessories'];
const INSTALLER_TYPES = ['Freelance', 'Workshop', 'Company'];
const SOURCES = ['Website', 'Referral', 'Dealer', 'Distributor', 'Other'];
const TASK_TYPES = ['Installation', 'Customer Follow-up', 'Delivery', 'Dispatch', 'Stock Review', 'KYC Correction', 'Device Replacement', 'SIM-Related', 'Custom'];
const TASK_STATUSES = ['Pending', 'In Progress', 'Follow-up Due', 'Overdue', 'Completed'];
const KYC_STATUSES = ['Pending', 'Submitted', 'Verified', 'Correction'];
const ACCOUNT_STATUSES = ['Active', 'Inactive', 'Blocked'];
const VERIFY_STATUSES = ['Unverified', 'Verified'];
const RETURN_REASONS = ['Faulty device', 'Wrong model', 'Customer cancelled', 'Other'];
const PARTNER_DOCS = ['Aadhaar Front', 'Aadhaar Back', 'PAN', 'Shop / Address Proof'];   /* no bank section */
const INSTALLER_DOCS = ['Aadhaar Front', 'Aadhaar Back', 'PAN', 'Photo', 'Address Proof', 'Work / Trade Proof'];
const stCls = s => ({ 'IN STOCK': 's-in', 'PACKED': 's-pk', 'DISPATCHED': 's-dp', 'DELIVERED': 's-dl', 'INSTALLED': 's-ok', 'RETURNED': 's-rt' }[s] || 'pn_');
const kycCls = s => ({ Verified: 'pg', Pending: 'py', Submitted: 'pb', Correction: 'pr' }[s] || 'pn_');
const taskCls = s => ({ Pending: 'py', 'In Progress': 'pb', 'Follow-up Due': 'po', Overdue: 'pr', Completed: 'pg' }[s] || 'pn_');
const acctCls = s => ({ Active: 'pg', Inactive: 'pn_', Blocked: 'pr' }[s] || 'pn_');

/* ---------- 3. STATE + PERMISSIONS ---------- */
const S = {
  mode: 'live',
  user: null, token: null, perms: [],
  screen: 'login', params: {}, stack: [], F: {}, files: {}, branch: 'All'
};
const ROLES = ['ADMIN', 'MANAGER', 'INVENTORY', 'INSTALLER', 'PARTNER', 'VIEW ONLY'];
/* Live mode: what the screen shows follows the permission list the backend sent at login. */
const PMAP = {
  stock: ['inventory.view', 'mystock.view'], inward: ['inward.create'], pack: ['packing.do'], dispatch: ['dispatch.do'], deliver: ['delivery.do'],
  install: ['installation.do'], return: ['return.do'], search: ['search.global'], customer: ['customer.view', 'customer.manage'],
  partners: ['partner.manage'], installers: ['installer.manage'], people: ['partner.view', 'installer.view'], tasks: ['tasks.view', 'tasks.own'],
  sim: ['sim.view'], simManage: ['sim.manage'], kyc: ['kyc.view', 'kyc.own'], kycReview: ['partner.manage'], import: ['import.run'],
  history: ['history.view'], notifications: ['notifications.view'], price: ['finance.view'], reports: ['reports.view'], users: ['users.manage']
};
function can(a) {
  if (!S.user) return false;
  const m = PMAP[a]; return !!m && m.some(x => S.perms.includes(x));
}
const isRole = (...r) => S.user && r.includes(S.user.role);
/* Branch choices for this user: non-admins can only work in their own branch (backend enforces it too). */
const branchOpts = () => (S.mode === 'live' && S.user && S.user.branch && S.user.branch !== 'All' && !isRole('ADMIN')) ? [S.user.branch] : BRANCHES;
const imeiDisp = i => (S.user && S.user.role === 'PARTNER') ? '····' + last6(i) : (i || '—');
const demoTag = () => '';

/* ---------- 4. API LAYER ---------- */
/* Request:  POST text/plain  { action, token?, requestId, ...payload }
   Response: { ok:true, data } | { ok:false, error:{ code, message } }
   Every UI call goes through api(key, payload). In live mode `Live[key]` turns the UI's
   payload into real backend actions and turns the backend rows back into the shapes the
   screens use. Action names below are the REAL names from the Apps Script action table. */
const uuid = () => { try { return crypto.randomUUID(); } catch (e) { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); } };
const mkErr = (msg, code) => { const e = new Error(msg); e.code = code || 'ERROR'; return e; };

/* ---- speed: reads fired together go to the server as ONE request (batch); identical reads share one call; any write clears the cache ---- */
const RQ = new Map(), RQ_SKIP = new Set(['me', 'logout', 'markNotificationRead']), RQ_NOCACHE = new Set(['listNotifications']);
const BQ = []; let bTimer = null;
function batchRead(action, payload) {
  return new Promise((resolve, reject) => { BQ.push({ action, payload, resolve, reject }); if (!bTimer) bTimer = setTimeout(flushBatch, 12); });
}
function flushBatch() {
  bTimer = null; const items = BQ.splice(0, BQ.length);
  if (!items.length) return;
  if (items.length === 1) { const it = items[0]; rpcRaw(it.action, it.payload).then(it.resolve, it.reject); return; }
  for (let i = 0; i < items.length; i += 40) {
    const chunk = items.slice(i, i + 40);
    rpcRaw('batch', { requests: chunk.map(it => Object.assign({}, it.payload, { action: it.action })) }).then(d => {
      const res = (d && d.results) || [];
      chunk.forEach((it, j) => {
        const r = res[j];
        if (r && r.ok === true) it.resolve(r.data);
        else { const er = r && r.error, code = (er && er.code) || 'ERROR'; if (code === 'AUTH' && S.token) sessionExpired(); it.reject(mkErr((er && er.message) || 'Request failed.', code)); }
      });
    }, err => chunk.forEach(it => it.reject(err)));
  }
}
function rpc(action, payload = {}) {
  if (!READ_ACTIONS.has(action) || RQ_SKIP.has(action)) return rpcRaw(action, payload);
  if (RQ_NOCACHE.has(action)) return batchRead(action, payload);
  let key; try { key = action + '|' + (S.token || '') + '|' + JSON.stringify(payload); } catch (e) { return batchRead(action, payload); }
  const hit = RQ.get(key);
  if (hit && Date.now() - hit.t < 8000) return hit.p;
  const p = batchRead(action, payload);
  RQ.set(key, { p, t: Date.now() });
  if (RQ.size > 60) RQ.delete(RQ.keys().next().value);
  p.catch(() => { const h = RQ.get(key); if (h && h.p === p) RQ.delete(key); });
  return p;
}
async function rpcRaw(action, payload = {}) {
  if (!READ_ACTIONS.has(action)) lcClear();
  const body = Object.assign({}, payload, { action, requestId: uuid() });
  if (S.token) body.token = S.token;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 60000);
  let res, txt;
  try {

/* ---- files: shrink big phone photos, then base64 (backend limit 5 MB per file) ---- */
const MAX_UPLOAD = 5 * 1024 * 1024, KYC_MIME = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Could not read the image.')); };
    im.src = u;
  });
}
async function prepFile(f) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 900 * 1024) return f;
  try {
    const im = await loadImg(f), k = Math.min(1, 1800 / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (b && b.size < f.size) return new File([b], f.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { /* keep original */ }
  return f;
}
async function fileToPayload(f0) {
  const f = await prepFile(f0);
  if (f.size > MAX_UPLOAD) throw new Error(f.name + ' is larger than 5 MB. Choose a smaller file.');
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res({ name: f.name, mime: f.type, size: f.size, dataBase64: String(rd.result).split(',')[1] || '' });
    rd.onerror = () => rej(new Error('Could not read file ' + f.name));
    rd.readAsDataURL(f);
  });
}
async function collectDocs(ids) {            /* attach selected documents (live mode only) */
  const out = [];
  for (const id of ids) { const x = S.files[id]; if (!x) continue; out.push(Object.assign({ type: id }, await fileToPayload(x.file))); }
  return out;
}
function b64Blob(b64, mime) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || 'application/octet-stream' });
}
function loadXlsx() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('Excel reader did not load.')); s.onerror = () => rej(new Error('Could not load the Excel reader. Check your connection, or save the file as CSV.'));
    document.head.appendChild(s);
  });
}
async function readImportFile(file) {        /* -> { rows } for Excel, { csvText } for CSV */
  if (file.size > MAX_UPLOAD) throw new Error('File is larger than 5 MB. Split it and try again.');
  if (/\.csv$/i.test(file.name)) return { csvText: await file.text() };
  const X = await loadXlsx(), wb = X.read(await file.arrayBuffer(), { type: 'array' });

let rt = 0, hn = 0;
async function render() {
  const tok = ++rt, app = $('#app');
  if (!S.user && S.screen !== 'login') { S.screen = 'login'; }
  let sc = SCREENS[S.screen]; if (!sc) { S.screen = 'home'; sc = SCREENS.home; }
  if (sc.perm && !can(sc.perm)) { app.innerHTML = scr(sc.title, empty('Not available', 'Your role does not have access to this section.'), { back: true }); return; }
  const paint = (data) => {
    S.data = data;
    try { app.innerHTML = sc.view(data); } catch (e) { console.error(e); app.innerHTML = scr(sc.title || '', errBox('This screen could not be shown: ' + e.message), { tab: sc.tab, back: !sc.tab }); return; }
    if (sc.after) { try { sc.after(data); } catch (e) { console.error(e); } }
  };
  let data = null;
  if (sc.load) {
    const ck = sc.swr ? lcKey() : null, hit = ck ? LC.get(ck) : null, gen = lcGen;
    if (hit && Date.now() - hit.t < 600000) {                       /* show the last result at once, then refresh quietly */
      data = hit.d; paint(data);
      sc.load().then(f => {
        if (tok !== rt || gen !== lcGen) return;
        const m = sc.merge ? sc.merge(data, f) : f; lcSet(ck, m);
        if (sig(m) !== sig(data)) { if (typing()) return; paint(m); }
        else { S.data = m; if (m._lazy && sc.after) sc.after(m); }
      }).catch(() => { /* keep showing the cached screen */ });
      return;
    }
    app.innerHTML = scr(sc.title || '', skeleton(4), { tab: sc.tab, back: !sc.tab });
    try { data = await sc.load(); } catch (e) { if (tok !== rt) return; app.innerHTML = scr(sc.title || '', errBox(e.message), { tab: sc.tab, back: !sc.tab }); return; }
    if (tok !== rt) return;
    if (ck && gen === lcGen) lcSet(ck, data);
  }
  paint(data);
}

  if (rear.some(d => CAM_REAR.test(lbl(d)))) rear = rear.filter(d => CAM_REAR.test(lbl(d)));
  const good = rear.filter(d => !CAM_SKIP.test(lbl(d))), pool = good.length ? good : rear;

  const n = $('#scanner'); if (n) { const v = n.querySelector('video'); if (v) v.srcObject = null; n.remove(); }

    const caps = track.getCapabilities ? track.getCapabilities() : {}; if (!caps.zoom) return;
    const want = (opt && opt.zoom) || 1, z = Math.min(Math.max(want, caps.zoom.min || 1), caps.zoom.max || want);
    await track.applyConstraints({ advanced: [{ zoom: z }] });
  } catch (e) { /* zoom not supported */ }
}
async function attachStream(stream, opt) {
  SC.stream = stream; const vid = SC.vid; if (!vid) return;
  vid.srcObject = stream;
  const tr = stream.getVideoTracks()[0]; if (tr) await applyZoom(tr, opt);
  try { await vid.play(); } catch (e) { /* autoplay */ }
}
async function buildCamOpts(track) {
  let devs = []; try { devs = await navigator.mediaDevices.enumerateDevices(); } catch (e) { /* no list */ }
  const st = track && track.getSettings ? track.getSettings() : {}, caps = track && track.getCapabilities ? track.getCapabilities() : {};
  const c = classifyCams(devs, st.deviceId), opts = [];
  const normal = { key: 'normal', label: 'Normal (1x)', deviceId: c.normal ? c.normal.deviceId : (st.deviceId || '') };
  opts.push(normal);
  if (c.wide) opts.push({ key: 'wide', label: 'Wide', deviceId: c.wide.deviceId });
  else if (caps.zoom && caps.zoom.min && caps.zoom.min < 1) opts.push({ key: 'wide', label: 'Wide', deviceId: normal.deviceId, zoom: caps.zoom.min });   /* one logical camera with 0.5x zoom */
  return opts;
}
function renderCamSel() {
  const b = $('#camsel'); if (!b) return; const o = SC.opts || [];
  b.innerHTML = o.length ? `<div class="seg" role="group" aria-label="Rear camera">${o.map(x => `<button type="button" class="${SC.cur === x.key ? 'on' : ''}" aria-pressed="${SC.cur === x.key}" data-act="camPick" data-k="${x.key}">${esc(x.label)}</button>`).join('')}</div>` : '';
}
/* Stop the old stream first, then start the chosen camera. The scan loop keeps running and just pauses meanwhile. */
async function switchCam(key) {
  const opt = (SC.opts || []).find(o => o.key === key); if (!opt || SC.switching || key === SC.cur) return;
  const prev = (SC.opts || []).find(o => o.key === SC.cur) || { key: 'normal', label: 'Normal (1x)', deviceId: '' }, sid = SC.sid, vid = SC.vid;
  SC.switching = true; const before = SC.cur; SC.cur = key; renderCamSel(); scanMsg('Switching camera…');
  const gone = () => sid !== SC.sid || !$('#scanner');
  try {
    const tr = SC.stream && SC.stream.getVideoTracks()[0], curDev = tr && tr.getSettings ? tr.getSettings().deviceId : '';
    if (tr && opt.deviceId && curDev === opt.deviceId) await applyZoom(tr, opt);        /* same lens, only zoom changes — no restart */
    else {
      stopStream(); if (vid) vid.srcObject = null; await sleep(250);                       /* let Android release the camera */
      if (gone()) return;
      const s = await openCam(opt);
      if (gone()) { s.getTracks().forEach(t => t.stop()); return; }
      await attachStream(s, opt);
    }
    scanMsg('Scanning…');
  } catch (e) {
    if (gone()) return;
    if (key === 'wide') SC.opts = SC.opts.filter(o => o.key !== 'wide');                  /* this phone cannot open it: hide the option */
    SC.cur = before || 'normal'; renderCamSel();
    try {
      stopStream(); await sleep(250);
      const s = await openCam(prev); if (gone()) { s.getTracks().forEach(t => t.stop()); return; }
      await attachStream(s, prev); scanMsg(key === 'wide' ? 'Wide camera is not available on this phone.' : 'Could not switch camera.', true);
    } catch (e2) { if (!gone()) scanMsg('Could not start the camera. Enter the number below.', true); }
  } finally { if (sid === SC.sid) SC.switching = false; }
}
ACT.camPick = el => switchCam(el.dataset.k);
function scanMsg(t, bad) { const m = $('#scmsg'); if (m) { m.textContent = t; m.style.color = bad ? '#b3261e' : ''; } }
function scanDone(val) {
  const sc = S.scan; closeScanner(); if (!sc) return;
  if (sc.target === 'home') { go('device', { imei: val }); return; }
  const inp = document.getElementById(sc.target); if (!inp) return;
  inp.value = val; const er = document.getElementById('e-' + sc.target); if (er) er.textContent = ''; inp.classList.remove('bad');
  toast('Scanned', 'ok');
  if (sc.target === 'q') runFind(null); else if (sc.target === 'dq') ACT.addDev(null); else if (sc.target === 'sq') ACT.doSearch(null);
}
function loadJsQR() {
  return new Promise((res, rej) => {
    if (window.jsQR) return res();
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'; s.onload = () => window.jsQR ? res() : rej(); s.onerror = rej; document.head.appendChild(s);
  });
}
async function openScanner(kind, target) {
  closeScanner(); S.scan = { kind, target };
  const lab = kind === 'sim' ? 'SIM number' : 'IMEI';
  const d = document.createElement('div'); d.className = 'scanner'; d.id = 'scanner'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'QR scanner');
  d.innerHTML = `<video playsinline muted autoplay></video><div class="fr"></div><div class="pan"><b id="scmsg">Starting camera…</b><div class="sub">Point the rear camera at the ${kind === 'sim' ? 'SIM' : 'IMEI'} QR.</div><div id="camsel"></div><div class="row"><input class="inp" id="scman" placeholder="Or type the ${lab}" inputmode="${kind === 'imei' ? 'numeric' : 'text'}" autocomplete="off"><button class="btn sm" data-act="scanManual" style="height:48px">Use</button></div><button class="btn ghost" data-act="scanClose">Close</button></div>`;
  $('#layer').appendChild(d);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { scanMsg('Camera is not available here (it needs https). Enter the number below.', true); return; }
  const sid = ++SC.sid, vid = d.querySelector('video'); SC.vid = vid; SC.switching = false;
  let stream;
  try { stream = await openCam({ deviceId: '' }); }                                   /* default REAR camera first (normal 1x on most phones) */
  catch (e) {
    scanMsg(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') ? 'Camera permission was denied. Allow camera access in your browser settings, or enter the number below.' : (e && e.name === 'NotFoundError' ? 'No camera found. Enter the number below.' : 'Could not start the camera. Enter the number below.'), true); return;
  }
  if (!$('#scanner') || sid !== SC.sid) { stream.getTracks().forEach(t => t.stop()); return; }       /* closed while asking permission */
  await attachStream(stream, { zoom: 1 });
  /* Camera labels are readable now: build the Normal / Wide choices, default to Normal. */
  try {
    const opts = await buildCamOpts(stream.getVideoTracks()[0]);
    if (!$('#scanner') || sid !== SC.sid) return;
    SC.opts = opts; SC.cur = '';
    const st = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {}, nrm = opts[0];
    if (nrm.deviceId && st.deviceId && nrm.deviceId !== st.deviceId) await switchCam('normal');   /* default stream was not the 1x lens */
    else { SC.cur = 'normal'; renderCamSel(); }
  } catch (e) { SC.opts = [{ key: 'normal', label: 'Normal (1x)', deviceId: '' }]; SC.cur = 'normal'; renderCamSel(); }
  if (!$('#scanner') || sid !== SC.sid) return;
  let mode = null;
  if ('BarcodeDetector' in window) { try { SC.det = new BarcodeDetector({ formats: ['qr_code'] }); mode = 'native'; } catch (e) { /* fall through */ } }
  if (!mode) { try { await loadJsQR(); mode = 'js'; SC.cv = document.createElement('canvas'); } catch (e) { scanMsg('Automatic scanning is not supported on this browser. Enter the number below.', true); return; } }
  scanMsg('Scanning…'); let last = 0;
  SC.timer = setInterval(async () => {
    if (!$('#scanner') || SC.switching || vid.readyState < 2 || SC.busy) return; SC.busy = true;
    try {
      let raw = null;
      if (mode === 'native') { const r = await SC.det.detect(vid); if (r && r.length) raw = r[0].rawValue; }
      else { const w = 480, h = Math.round(w * vid.videoHeight / vid.videoWidth) || 360; SC.cv.width = w; SC.cv.height = h; const cx = SC.cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(vid, 0, 0, w, h); const q = window.jsQR(cx.getImageData(0, 0, w, h).data, w, h); if (q) raw = q.data; }
      if (raw) { const p = parseScan(S.scan.kind, raw); if (p.ok) scanDone(p.ok); else if (Date.now() - last > 1500) { last = Date.now(); scanMsg(p.err, true); } }
    } catch (e) { /* frame error — keep scanning */ } finally { SC.busy = false; }
  }, 250);
}
ACT.scan = el => openScanner(el.dataset.kind, el.dataset.target);
ACT.scanClose = () => closeScanner();
ACT.scanManual = () => {
  const sc = S.scan; if (!sc) return; const val = ($('#scman').value || '').trim();
  const p = parseScan(sc.kind, val); const okLen = sc.kind === 'imei' ? /^\d{15}$/.test(val) : !!p.ok;
  if (!okLen || !p.ok) return scanMsg(sc.kind === 'imei' ? 'Enter the full 15-digit IMEI.' : 'Enter a valid SIM number (starts with 89).', true);
  scanDone(p.ok);
};

/* ---------- 10. ACTIONS, EVENTS, BOOT ---------- */
ACT.go = el => go(el.dataset.to, JSON.parse(el.dataset.p || '{}'));
ACT.tab = el => tab(el.dataset.to);
ACT.back = () => back();
ACT.retry = () => render();
ACT.pick = el => {
  const g = el.dataset.g; S.F[g] = el.dataset.v;
  $$('[data-act="pick"][data-g="' + g + '"]').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const er = document.getElementById('e-' + g); if (er) er.textContent = '';
  const sc = SCREENS[S.screen]; if (sc && sc.onpick) sc.onpick(g, el.dataset.v);
};
ACT.pickfile = el => { const i = document.getElementById((el.dataset.cam ? 'fc-' : 'fi-') + el.dataset.id); if (i) i.click(); };
ACT.pickfileany = el => { const i = document.getElementById('fi-' + el.dataset.id); if (i) i.click(); };
ACT.mok = () => { closeSheet(); const r = modalRes; modalRes = null; if (r) r(true); };
ACT.mcancel = () => { closeSheet(); const r = modalRes; modalRes = null; if (r) r(false); };
ACT.closesheet = () => ACT.mcancel();
ACT.logout = async () => { if (!await confirmBox('Sign out?', 'You will need to sign in again.', 'Sign out')) return; if (S.mode === 'live' && S.token) rpc('logout').catch(() => { /* already expired */ }); doLogout(); };
function doLogout() { lcClear(); S.user = null; S.token = null; S.perms = []; try { sessionStorage.removeItem('trak_sess'); } catch (e) { /* ignore */ } S.stack = []; S.branch = 'All'; reset('login', {}); try { history.replaceState({ n: 0 }, ''); } catch (e) { /* ignore */ } hn = 0; render(); }
ACT.ping = el => busy(el, async () => {
  const b = $('#pingres'); b.innerHTML = '';
  try { const r = await pingBackend(); b.innerHTML = `<div class="note ${r.status === 200 ? 'g' : 'y'}">HTTP ${r.status}<br><span class="mono" style="word-break:break-all;font-weight:500">${esc(r.body)}</span></div>`; }
  catch (e) { b.innerHTML = '<div class="note r">Could not reach the backend from this browser. Check the internet connection and the Apps Script deployment access.</div>'; }
});

ACT.changePw = el => busy(el, async () => {
  const o = v('opw'), n1 = v('npw1'), n2 = v('npw2');
  if (!validate([['opw', !!o, 'Enter your current password'], ['npw1', n1.length >= 8 && n1.length <= 64, 'Password must be 8 to 64 characters'], ['npw2', n1 === n2, 'The two passwords do not match']])) return;
  try { await api('changePassword', { oldPassword: o, newPassword: n1 }); } catch (e) { toast(e.message, 'bad'); return; }
  ['opw', 'npw1', 'npw2'].forEach(id => { const i = document.getElementById(id); if (i) i.value = ''; }); toast('Password changed.', 'ok');
});

const SUBMIT = {
  async login(form) {
    const uid = v('uid'), pw = v('pw');
    if (!validate([['uid', !!uid, 'Enter your User ID'], ['pw', !!pw, 'Enter your password']])) return;
    const btn = form.querySelector('[type=submit]');
    await busy(btn, async () => {
      let r;
      try { r = await api('login', { userId: uid, password: pw }); }
      catch (e) { toast(e.message, 'bad'); return; }
      const u = (r && r.user) || r || {}, role = String(u.role || '').toUpperCase();
      if (!ROLES.includes(role)) { toast('Sign-in worked but the server sent an unknown role (“' + (u.role || 'none') + '”).', 'bad'); return; }
      S.token = r.token || null; S.perms = r.perms || []; S.user = { id: u.id || uid, name: u.name || uid, role, branch: u.branch || 'All', installerId: u.installerId || '', partnerId: u.partnerId || '' }; if (S.mode === 'live') saveSession(r.expiresInSec || 21600);
      S.branch = 'All'; S.stack = []; reset('home', {});
      try { history.replaceState({ n: 0 }, ''); } catch (e) { /* ignore */ } hn = 0; render();
    });
  }
};

const run = (fn, el, e) => { try { const r = fn(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast(err.message || 'Something went wrong', 'bad'); }); } catch (err) { console.error(err); toast(err.message || 'Something went wrong', 'bad'); } };
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('ov')) { ACT.mcancel(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); run(f, el, e); }
});
document.addEventListener('change', e => {
  const fi = e.target.closest('[data-file]');
  if (fi) {
    const f = fi.files && fi.files[0], id = fi.dataset.file; if (!f) return;
    if (f.size > (/^image\//.test(f.type) && id !== 'imp_file' ? 25 : 5) * 1024 * 1024) { setErr(id, 'File is larger than ' + (/^image\//.test(f.type) && id !== 'imp_file' ? 25 : 5) + ' MB. Choose a smaller file.'); fi.value = ''; return; }
    const imp = id === 'imp_file';
    if (imp ? !/\.(xlsx|xls|csv)$/i.test(f.name) : !(S.mode === 'live' ? KYC_MIME.includes(f.type) : (/^image\//.test(f.type) || f.type === 'application/pdf'))) { setErr(id, imp ? 'Choose an Excel or CSV file.' : 'Use a JPG, PNG, WEBP or PDF file.'); fi.value = ''; return; }
    S.files[id] = { name: f.name, file: f }; const n = document.getElementById('fn-' + id); if (n) n.textContent = f.name; const er = document.getElementById('e-' + id); if (er) er.textContent = ''; return;
  }
  const el = e.target.closest('[data-change]'); if (el && ACT[el.dataset.change]) run(ACT[el.dataset.change], el, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && ACT[el.dataset.input]) run(ACT[el.dataset.input], el, e); if (e.target.classList && e.target.classList.contains('bad')) { e.target.classList.remove('bad'); const er = document.getElementById('e-' + e.target.id); if (er) er.textContent = ''; } });
document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); const fn = SUBMIT[f.dataset.submit]; if (fn) run(fn, f, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#scanner')) closeScanner(); else if ($('#sheet')) ACT.mcancel(); return; }
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const m = { q: () => runFind(null), dq: () => ACT.addDev(null), sq: () => ACT.doSearch(null), oq: () => ACT.findOrder(null), hq: () => ACT.histFind(), scman: () => ACT.scanManual() }[e.target.id];
    if (m) { e.preventDefault(); run(m); }
  }
});
window.addEventListener('unhandledrejection', e => { console.error(e.reason); toast((e.reason && e.reason.message) || 'Something went wrong', 'bad'); });

/* ---- speed: keep the Apps Script server awake while the app is open (avoids the slow first call after idle) ---- */
const keepWarm = () => { if (S.user && !document.hidden) { try { fetch(CFG.APPS_SCRIPT_URL, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => { /* ignore */ }); } catch (e) { /* ignore */ } } };
setInterval(keepWarm, 240000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepWarm(); });

try { history.replaceState({ n: 0 }, ''); } catch (e) { /* ignore */ }
(async function boot() {
  try {                                          /* keep the person signed in across a page refresh (same tab only) */
    const s = JSON.parse(sessionStorage.getItem('trak_sess') || 'null');
    if (s && s.token && s.exp > Date.now() && s.user && ROLES.includes(s.user.role)) {
      S.token = s.token; S.user = s.user; S.perms = s.perms || []; reset('home', {});
      Live.me().then(r => { if (S.token === s.token && r.user) { S.user = r.user; S.perms = r.perms; } }).catch(() => { /* AUTH errors sign out inside rpc() */ });
    }
  } catch (e) { S.token = null; S.user = null; S.perms = []; try { sessionStorage.removeItem('trak_sess'); } catch (x) { /* ignore */ } }
  render();
  if (!S.user) { try { fetch(CFG.APPS_SCRIPT_URL, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => { /* warm-up only */ }); } catch (e) { /* ignore */ } }
})();
