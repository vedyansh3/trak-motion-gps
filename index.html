<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63f6">
<title>TRAK MOTION GPS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0b63f6;
  --primary-dark:#084dbb;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#697386;
  --border:#e4e9f1;
  --success:#0f9d58;
  --warning:#f59e0b;
  --danger:#dc3545;
  --shadow:0 8px 28px rgba(30,50,90,.08);
  --radius:18px;
}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{min-height:100vh}
.screen{min-height:100vh}

/* LOGIN */
.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(145deg,#eaf2ff,#f8fbff);
}
.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:26px;
  padding:30px 22px;
  box-shadow:0 18px 55px rgba(30,70,130,.14);
}
.logo{
  width:66px;height:66px;border-radius:19px;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary);color:#fff;
  font-weight:900;font-size:21px;
  margin:0 auto 15px;
}
.brand{text-align:center}
.brand h1{font-size:25px;letter-spacing:-.5px}
.brand p{color:var(--muted);font-size:13px;margin-top:5px}
.form-group{margin-bottom:14px}
label{
  display:block;
  font-size:12px;
  font-weight:750;
  margin-bottom:7px;
  color:#3e4758;
}
input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  padding:12px 13px;
  color:var(--text);
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(11,99,246,.1);
}
textarea{min-height:90px;resize:vertical}
.btn{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-weight:750;
  transition:.15s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#edf3ff;color:#1258c4}
.btn-light{background:#f2f4f8;color:#3b4555}
.btn-danger{background:#fff0f1;color:var(--danger)}
.btn-success{background:#eaf8f0;color:#0b8a4b}
.btn-block{width:100%}
.login-demo{
  margin-top:18px;
  padding:12px;
  background:#f7f9fc;
  border-radius:13px;
  font-size:11px;
  color:var(--muted);
  line-height:1.7;
}

/* HEADER */
.topbar{
  position:sticky;top:0;z-index:30;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:11px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.top-brand{display:flex;align-items:center;gap:10px}
.top-logo{
  width:38px;height:38px;border-radius:11px;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12px;
}
.top-brand strong{font-size:14px}
.top-brand small{display:block;color:var(--muted);font-size:10px}
.profile-btn{
  border:0;background:#eef4ff;color:var(--primary);
  width:40px;height:40px;border-radius:50%;
  font-weight:800;
}

/* CONTENT */
.main{
  max-width:1000px;
  margin:auto;
  padding:16px 15px 92px;
}
.page-title{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:16px;
}
.page-title h2{font-size:22px}
.page-title p{font-size:12px;color:var(--muted);margin-top:3px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:15px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.card-title{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:13px;
}
.card-title h3{font-size:15px}
.card-title span{font-size:11px;color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.grid-1{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* DASHBOARD */
.hero{
  background:linear-gradient(135deg,#0b63f6,#0750c9);
  color:#fff;
  border-radius:22px;
  padding:19px;
  margin-bottom:14px;
  box-shadow:0 12px 30px rgba(11,99,246,.22);
}
.hero small{opacity:.8}
.hero h2{font-size:22px;margin:5px 0}
.hero p{font-size:12px;opacity:.85}
.stat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}
.stat-icon{font-size:21px}
.stat strong{display:block;font-size:22px;margin-top:8px}
.stat span{font-size:11px;color:var(--muted)}
.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.quick{
  border:1px solid var(--border);
  background:#fff;
  border-radius:15px;
  padding:15px;
  text-align:left;
}
.quick b{display:block;margin-top:8px;font-size:13px}
.quick small{color:var(--muted);font-size:10px}
.alert{
  padding:12px;
  border-radius:13px;
  background:#fff8e7;
  color:#8a5b00;
  font-size:12px;
  margin-bottom:8px;
}
.alert:last-child{margin-bottom:0}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  z-index:40;
  height:70px;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  border:0;background:transparent;color:#788294;
  font-size:10px;font-weight:700;
}
.nav-btn .ico{font-size:20px;display:block;margin-bottom:3px}
.nav-btn.active{color:var(--primary)}

/* ACTION CARDS */
.action-list{display:grid;gap:10px}
.action-item{
  display:flex;align-items:center;gap:13px;
  background:#fff;border:1px solid var(--border);
  border-radius:15px;padding:14px;
  text-align:left;width:100%;
}
.action-icon{
  width:42px;height:42px;border-radius:13px;
  background:#edf3ff;color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:none;
}
.action-item strong{font-size:13px}
.action-item small{display:block;color:var(--muted);font-size:10px;margin-top:3px}

/* BADGES */
.badge{
  display:inline-flex;
  padding:5px 8px;
  border-radius:999px;
  font-size:9px;
  font-weight:800;
}
.b-IN-STOCK{background:#e9f8ef;color:#13874d}
.b-PACKED{background:#edf3ff;color:#2162c5}
.b-DISPATCHED{background:#fff5df;color:#a96900}
.b-DELIVERED{background:#eaf6ff;color:#1375a7}
.b-INSTALLED{background:#e8f7ef;color:#13864b}
.b-RETURNED{background:#f0ecff;color:#6846c7}
.b-DAMAGED,.b-LOST,.b-SCRAPPED{background:#fff0f1;color:#c72f40}

/* SEARCH */
.search-box{
  display:flex;gap:8px;
}
.search-box input{flex:1}
.search-result{
  margin-top:12px;
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
}
.device-row{
  display:flex;justify-content:space-between;gap:10px;
  align-items:flex-start;
}
.device-imei{font-size:14px;font-weight:850}
.device-sim{font-size:11px;color:var(--muted);margin-top:4px;word-break:break-all}
.meta{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;margin-top:12px;
}
.meta div{
  background:#f7f9fc;border-radius:9px;padding:8px;
}
.meta small{display:block;color:var(--muted);font-size:9px}
.meta b{font-size:11px}
.match-select{
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px;
  margin-top:8px;
  background:#fff;
  width:100%;
  text-align:left;
}
.match-select:hover{border-color:var(--primary)}
.timeline{margin-top:14px}
.timeline-item{
  position:relative;
  padding:0 0 15px 22px;
  border-left:2px solid #dce5f5;
  margin-left:5px;
}
.timeline-item:last-child{border-left:0}
.timeline-dot{
  position:absolute;left:-6px;top:1px;
  width:10px;height:10px;border-radius:50%;
  background:var(--primary);
}
.timeline-item strong{font-size:11px}
.timeline-item small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.timeline-item p{font-size:11px;margin-top:4px;color:#4b5565}

/* CAMERA */
.camera-box{
  background:#111827;
  border-radius:17px;
  overflow:hidden;
  position:relative;
}
#cameraVideo{
  width:100%;
  display:block;
  max-height:360px;
  object-fit:cover;
}
.camera-controls{
  padding:10px;
  display:grid;
  gap:8px;
}
.scan-overlay{
  position:absolute;
  left:12%;
  right:12%;
  top:28%;
  height:35%;
  border:2px solid #fff;
  border-radius:14px;
  pointer-events:none;
  box-shadow:0 0 0 999px rgba(0,0,0,.18);
}
.camera-status{
  color:#fff;
  text-align:center;
  font-size:11px;
  padding:5px;
}

/* FORMS */
.section-label{
  font-size:11px;
  color:var(--primary);
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin:18px 0 10px;
}
.required::after{content:" *";color:var(--danger)}
.two-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.file-box{
  border:1px dashed #bdc8da;
  border-radius:14px;
  padding:12px;
  background:#fafcff;
}
.file-box strong{font-size:12px}
.file-box small{display:block;color:var(--muted);font-size:10px;margin:5px 0 9px}
.file-preview{
  width:100%;max-height:150px;object-fit:cover;
  border-radius:10px;margin-top:8px;
}

/* TABLE */
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:10px;min-width:650px}
th,td{border-bottom:1px solid var(--border);padding:10px 8px;text-align:left}
th{background:#f8faff;font-size:9px;color:#5f6878;position:sticky;top:0}
td{vertical-align:top}

/* TOAST / MODAL */
.toast{
  position:fixed;
  left:50%;bottom:83px;
  transform:translateX(-50%) translateY(15px);
  z-index:100;
  background:#172033;color:#fff;
  padding:11px 15px;border-radius:12px;
  font-size:11px;
  opacity:0;pointer-events:none;
  transition:.2s;
  max-width:90%;
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{
  position:fixed;inset:0;z-index:80;
  background:rgba(10,20,40,.55);
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-card{
  width:100%;max-width:650px;
  max-height:92vh;overflow:auto;
  background:#fff;border-radius:22px 22px 0 0;
  padding:18px;
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:15px;
}
.close{
  border:0;background:#f0f2f6;
  width:34px;height:34px;border-radius:50%;
}

/* MORE */
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu-btn{
  background:#fff;border:1px solid var(--border);
  border-radius:15px;padding:16px;text-align:left;
}
.menu-btn b{font-size:12px;display:block;margin-top:8px}
.menu-btn small{font-size:9px;color:var(--muted)}

.empty{
  text-align:center;padding:30px 15px;color:var(--muted);
  font-size:12px;
}
.error-text{color:var(--danger);font-size:10px;margin-top:5px}
.success-text{color:var(--success);font-size:10px;margin-top:5px}

.permission-note{
  background:#eef5ff;
  color:#285fae;
  border-radius:12px;
  padding:10px;
  font-size:10px;
  line-height:1.5;
}

.import-drop{
  border:2px dashed #cbd5e1;
  padding:25px 15px;
  border-radius:16px;
  text-align:center;
}
.import-drop b{font-size:13px}
.import-drop p{font-size:10px;color:var(--muted);margin:5px 0 13px}

.switch{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 0;border-bottom:1px solid var(--border);
}
.switch:last-child{border:0}
.switch span{font-size:12px;font-weight:700}
.switch input{width:auto}

/* DESKTOP */
@media(min-width:800px){
  .bottom-nav{left:50%;transform:translateX(-50%);max-width:1000px;border:1px solid var(--border);border-radius:18px 18px 0 0}
  .modal{align-items:center}
  .modal-card{border-radius:22px}
}
</style>
</head>

function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.classList.remove("show"),2600);

function can(action){
  const r=state.user?.role;
  if(r==="ADMIN") return true;
  if(r==="VIEW ONLY") return ["search","reports"].includes(action);
  if(r==="MANAGER") return !["users","settings"].includes(action);
  if(r==="INVENTORY") return ["inventory","dispatch","search","movement"].includes(action);
  if(r==="INSTALLER") return ["installation","search"].includes(action);
  return false;
}

function last6Component(id,source){
  return `
    <div class="search-box">
      <input
        id="${id}"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter last 6 digits of IMEI"
        oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6)"
        onkeydown="if(event.key==='Enter') runLast6Search('${id}','${source}')"
      >
      <button class="btn btn-primary" onclick="runLast6Search('${id}','${source}')">Search</button>
    </div>
    <div style="margin-top:8px">
      <button class="btn btn-secondary" onclick="openScanner('${id}')">📷 Scan IMEI</button>
    </div>
    <div id="${id}Result"></div>
  `;
}

function runLast6Search(inputId,source){
  const value=document.getElementById(inputId)?.value.trim();

  if(!/^\d{6}$/.test(value)){
    toast("Last 6 digits of IMEI are mandatory.");
    return;
  }

  const matches=state.inventory.filter(x=>String(x.imei).slice(-6)===value);

  if(!matches.length){
    document.getElementById(inputId+"Result").innerHTML=`
      <div class="empty">No device found for last 6 digits: <b>${escapeHtml(value)}</b></div>
    `;
    return;
  }

  if(matches.length===1){
    selectDevice(matches[0].imei,inputId+"Result",source);
    return;
  }

  document.getElementById(inputId+"Result").innerHTML=`
    <div style="margin-top:12px">
      <b style="font-size:12px">Multiple devices found</b>
      ${matches.map(x=>`
        <button class="match-select" onclick="selectDevice('${x.imei}','${inputId}Result','${source}')">
          <div class="device-row">
            <div>
              <div class="device-imei">${escapeHtml(x.imei)}</div>
              <div class="device-sim">${escapeHtml(x.sim)}</div>
            </div>
            <span class="badge b-${x.status.replaceAll(" ","-")}">${escapeHtml(x.status)}</span>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:7px">
            ${escapeHtml(x.model)} • ${escapeHtml(x.relay)} • ${escapeHtml(x.lockingStatus)}
          </div>
        </button>
      `).join("")}
    </div>
  `;
}

function parseSimXml(raw){
  if(!raw)return "";
  const text=String(raw).trim();

  if(text.startsWith("<")){
    try{
      const xml=new DOMParser().parseFromString(text,"text/xml");
      const node=xml.documentElement;
      const value=node?.getAttribute("simNo");
      return value ? value : text;
    }catch(e){
      return text;
    }
  }

  return text;
}

function validateImei(imei){
  return /^\d+$/.test(imei) && imei.length>10;
}

function saveInward(){
  let imei=document.getElementById("inwardImei").value.trim();
  let sim=parseSimXml(document.getElementById("inwardSim").value.trim());

  if(!validateImei(imei)){
    toast("IMEI must contain numbers only and be more than 10 digits.");
    return;
  }

  if(state.inventory.some(x=>x.imei===imei)){
    toast("Duplicate IMEI — Record already exists.");
    return;
  }

  if(!sim){
    toast("SIM No. is required.");
    return;
  }

  const price=Number(document.getElementById("inwardPrice").value);

  if(!Number.isFinite(price)||price<0){
    toast("Enter a valid non-negative Purchase Price.");
    return;
  }

  const branchValue=document.getElementById("inwardBranch").value;
  const branch=branchValue==="Others"
    ? document.getElementById("inwardOtherBranchInput").value.trim()
    : branchValue;

  if(!branch){
    toast("Branch is required.");
    return;
  }

  const purchasedFromValue=document.getElementById("inwardPurchasedFrom").value;
  const purchasedFrom=purchasedFromValue==="Others"
    ? document.getElementById("inwardPurchasedOtherInput").value.trim()
    : purchasedFromValue;

  const record={
    sno:state.inventory.length+1,
    dateTime:now(),
    imei,
    sim,
    model:document.getElementById("inwardModel").value,
    relay:document.getElementById("inwardRelay").value,
    purchasePrice:price,
    status:"IN STOCK",
    simStatus:"INACTIVE",
    lockingStatus:document.getElementById("inwardLock").value,
    remarks:document.getElementById("inwardRemarks").value.trim(),
    purchaseDate:document.getElementById("inwardPurchaseDate").value,
    purchasedFrom,
    branch
  };

  state.inventory.push(record);

  addHistory(imei,"INWARD","GPS device added to inventory");
  state.simStock.used++;
  state.simStock.transactions.push({
    time:now(),type:"USED",quantity:1,imei
  });

  saveState();
  closeModal();
  showPage("inventory");
  toast("Inward saved successfully.");
}

function openOperation(type){
  if(type==="dispatch" && !can("dispatch")){

  if(type==="installation" && !can("installation")){

async function openScanner(targetId,type="IMEI"){
  state.cameraPurpose="scanner";

  openModal(`
    <div class="modal-head">

    </div>

    <div class="form-group">
      <label>Select Rear Camera</label>
      <select id="cameraSelect"></select>
    </div>

    <div class="camera-box">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="scan-overlay"></div>
      <div class="camera-status" id="cameraStatus">
        ${supported?"BarcodeDetector available":"BarcodeDetector unavailable — manual entry fallback"}
      </div>
    </div>

    <div class="camera-controls">
      <button class="btn btn-primary" onclick="startSelectedCamera()">Start Camera</button>
      <button class="btn btn-secondary" onclick="manualScannerFallback()">Enter Manually</button>
    </div>

    <div id="cameraManual" class="hidden" style="margin-top:10px">
      <input id="manualScanValue" placeholder="${type==="SIM"?"SIM number / XML":"IMEI number"}">
      <button class="btn btn-success btn-block" style="margin-top:8px" onclick="useManualScan('${type}')">Use Value</button>
    </div>
  `);

  await populateCameraList();
}

async function populateCameraList(){
  const select=document.getElementById("cameraSelect");
  if(!select)return;

  try{
    const temp=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    temp.getTracks().forEach(t=>t.stop());

    const devices=await navigator.mediaDevices.enumerateDevices();

    const rear=devices.filter(d=>{
      if(d.kind!=="videoinput")return false;
      const label=(d.label||"").toLowerCase();

      if(label.includes("front")||label.includes("user")||label.includes("facetime")){
        return false;
      }

      if(label.includes("back")||
         label.includes("rear")||
         label.includes("environment")||
         label.includes("wide")||
         label.includes("main")||
         label.includes("camera")){
        return true;
      }

      return true;
    });

    const unique=[];
    rear.forEach(d=>{
      if(!unique.some(x=>x.deviceId===d.deviceId))unique.push(d);
    });

    unique.sort((a,b)=>cameraScore(b)-cameraScore(a));

    if(!unique.length){
      select.innerHTML=`<option value="">Rear camera not detected</option>`;
      return;
    }

    select.innerHTML=unique.map((d,i)=>`
      <option value="${escapeHtml(d.deviceId)}">${escapeHtml(cameraLabel(d.label,i))}</option>
    `).join("");

  }catch(e){
    select.innerHTML=`<option value="">Use browser default rear camera</option>`;
    toast("Camera permission is needed.");
  }
}

function cameraScore(device){
  const l=(device.label||"").toLowerCase();
  let score=0;

  if(l.includes("front")||l.includes("user")) score-=100;
  if(l.includes("ultra")||l.includes("0.5")) score-=20;
  if(l.includes("main")) score+=50;
  if(l.includes("wide")&&!l.includes("ultra")) score+=45;
  if(l.includes("1x")||l.includes("1×")) score+=40;
  if(l.includes("rear")||l.includes("back")||l.includes("environment")) score+=30;

  return score;
}

function cameraLabel(label,index){
  const l=(label||"").toLowerCase();

  if(l.includes("ultra")||l.includes("0.5")) return `Ultra Wide (Rear)`;
  if(l.includes("main")||l.includes("1x")||l.includes("1×")) return `Main / Wide (Rear)`;
  if(l.includes("wide")) return `Wide (Rear)`;
  if(l.includes("rear")||l.includes("back")||l.includes("environment")) return `Rear Camera ${index+1}`;

  return `Rear Camera ${index+1}`;
}

async function startSelectedCamera(){
  stopCamera();

  const select=document.getElementById("cameraSelect");
  const deviceId=select?.value;

  const constraints={
    audio:false,
    video:deviceId
      ? {deviceId:{exact:deviceId},width:{ideal:1280},height:{ideal:720}}
      : {facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}
  };

  try{
    state.cameraStream=await navigator.mediaDevices.getUserMedia(constraints);

    const video=document.getElementById("cameraVideo");
    video.srcObject=state.cameraStream;

    if(state.cameraPurpose==="scanner"){
      beginBarcodeScanning();
    }

    const status=document.getElementById("cameraStatus");
    if(status)status.textContent="Camera active — align barcode inside the box.";
  }catch(e){
    toast("Could not start selected camera.");
  }
}

function beginBarcodeScanning(){
  if(typeof BarcodeDetector==="undefined"){
    const status=document.getElementById("cameraStatus");
    if(status)status.textContent="BarcodeDetector unavailable. Use manual entry.";
    return;
  }

  const formats=[
    "qr_code",
    "code_128",
    "code_39",
    "ean_13",
    "ean_8",
    "upc_a",
    "upc_e"
  ];

  let detector;

  try{
    detector=new BarcodeDetector({formats});
  }catch(e){
    detector=new BarcodeDetector();
  }

  const video=document.getElementById("cameraVideo");

  const scan=async()=>{
    if(!state.cameraStream||!video||video.readyState<2)return;

    try{
      const codes=await detector.detect(video);

      if(codes.length){
        const raw=codes[0].rawValue||"";

        if(state.cameraPurpose==="scanner"){
          const target=state.cameraTarget;
          const input=document.getElementById(target);

          if(input){
            input.value=raw;
            input.dispatchEvent(new Event("input",{bubbles:true}));
          }

          toast("Scan successful.");
          closeModal();
          return;
        }
      }
    }catch(e){}

async function openCameraCapture(title,callback){
  openModal(`
    <div class="modal-head">
      <h3>${escapeHtml(title)}</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="camera-box">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="camera-status">Rear camera</div>
    </div>

    <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="takeCameraPhoto()">
      Capture Photo
    </button>
  `);

  try{
    state.cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    document.getElementById("cameraVideo").srcObject=state.cameraStream;

    window.__captureCallback=callback;
  }catch(e){
    toast("Camera permission denied/unavailable.");
  }
}

function takeCameraPhoto(){
  const video=document.getElementById("cameraVideo");
  if(!video)return;

  const canvas=document.createElement("canvas");
  canvas.width=video.videoWidth||1280;
  canvas.height=video.videoHeight||720;

  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  const data=canvas.toDataURL("image/jpeg",.85);
  const cb=window.__captureCallback;

  closeModal();

  if(typeof cb==="function")cb(data);
}

function previewFile(file,targetId){
  if(!file)return;

  if(!file.type.startsWith("image/")){
    document.getElementById(targetId).innerHTML=
      `<div class="success-text">File selected: ${escapeHtml(file.name)}</div>`;
    return;
  }

  const reader=new FileReader();

  reader.onload=e=>{
    document.getElementById(targetId).innerHTML=
      `<img class="file-preview" src="${e.target.result}" alt="Preview">`;
  };

  reader.readAsDataURL(file);
}

function previewImportFile(file){
  if(!file)return;

  const ext=file.name.toLowerCase().split(".").pop();

  if(ext==="csv"){
    const reader=new FileReader();

    reader.onload=e=>{
      const rows=parseCsv(e.target.result);
      state.importRows=rows;
      renderImportPreview(rows);
    };

    return;
  }

  if(ext==="xlsx"){
    document.getElementById("importPreview").innerHTML=`

        XLSX file selected successfully. Full XLSX column analysis/mapping will be handled by the Apps Script backend version. For this frontend test, the file is accepted and queued for preview.

        1. Read file<br>

        4. Normalize data<br>
        5. Validate IMEI<br>
        6. Detect duplicates<br>
        7. Separate invalid records<br>
        8. Show preview<br>
        9. Confirm Import
      </div>

      <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="confirmImport()">
        Confirm Import (Demo)
      </button>
    </div>
  `;
}

function parseCsv(text){
  const lines=text.split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length)return [];

  const headers=parseCsvLine(lines[0]);

  return lines.slice(1).map(line=>{
    const values=parseCsvLine(line);
    const obj={};
    headers.forEach((h,i)=>obj[h]=values[i]??"");
    return obj;
  });
}

function parseCsvLine(line){
  const result=[];
  let current="";
  let quote=false;

  for(let i=0;i<line.length;i++){
    const c=line[i];

    if(c==='"'){
      if(quote && line[i+1]==='"'){
        current+='"';
        i++;
      }else{
        quote=!quote;
      }
    }else if(c===","&&!quote){
      result.push(current.trim());
      current="";
    }else{
      current+=c;
    }
  }

  result.push(current.trim());
  return result;
}

function renderImportPreview(rows){
  const target=document.getElementById("importPreview");

  if(!rows.length){
    target.innerHTML=`<div class="empty">No rows found.</div>`;
    return;
  }

  const headers=Object.keys(rows[0]);
  const preview=rows.slice(0,10);

  target.innerHTML=`
    <div class="card" style="box-shadow:none">
      <div class="card-title">
        <h3>Import Preview</h3>
        <span>${rows.length} rows</span>
      </div>

      <div class="permission-note">
        This is a frontend preview. Nothing is silently imported.
      </div>

      <div class="table-wrap" style="margin-top:10px">
        <table>
          <thead>
            <tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}</tr>
          </thead>
          <tbody>
            ${preview.map(row=>`
              <tr>${headers.map(h=>`<td>${escapeHtml(row[h])}</td>`).join("")}</tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      <div class="section-label">Preview Categories</div>
      <div class="meta">
        <div><small>Ready</small><b>${rows.length}</b></div>
        <div><small>Needs Review</small><b>0</b></div>
        <div><small>Duplicate / Invalid</small><b>0</b></div>
        <div><small>Total</small><b>${rows.length}</b></div>
      </div>

      <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="confirmImport()">
        Confirm Import (Demo)
      </button>
    </div>
  `;
}
