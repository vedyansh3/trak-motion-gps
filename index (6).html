<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>TRAK MOTION GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--bg:#f5f8fc;--navy:#0f1a33;--org:#f59e5b;--ink:#0f1a33;--mut:#566280;--soft:#66718e;--line:#e3e9f3;--fld:#eef3fa;
--b-bg:#dbe9ff;--b-fg:#1d4fa8;--y-bg:#fdeebc;--y-fg:#7a5200;--o-bg:#ffdcc2;--o-fg:#8a3a0c;--p-bg:#e6dffa;--p-fg:#4a2d9a;--g-bg:#c9f1de;--g-fg:#0d6a45;--r-bg:#fde2e2;--r-fg:#b5301c;--n-bg:#e3e9f3;--n-fg:#3b4766;
--sh:0 4px 18px rgba(15,26,51,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#e6ecf5;color:var(--ink);font-size:15px;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
a,input,select,textarea,.chip{touch-action:manipulation}
a{color:#1d4fa8}
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(15,26,51,.12)}
.scr{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.main{flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.main.pn{padding-bottom:110px}
.hdr{display:flex;align-items:center;gap:12px}
.hdr h1{margin:0;font-size:24px;font-weight:800;flex:1;line-height:1.15}
.hdr .sub{display:block;font-size:12px;font-weight:500;color:var(--soft)}
.ib{width:46px;height:46px;border-radius:23px;background:#fff;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.ib svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:10px;right:12px;width:9px;height:9px;border-radius:5px;background:var(--org)}
.card{background:#fff;border-radius:26px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.card.navy{background:var(--navy);color:#fff}
.card.flat{box-shadow:none;border:1.5px dashed #e7b4ad}
button.card{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sub{font-size:12px;color:var(--soft)}
.mut{color:var(--mut)}
.sec{font-size:13px;font-weight:700;color:var(--mut);margin:2px 2px 0}
.big{font-size:15px;font-weight:700}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.3px}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.s-in,.pb{background:var(--b-bg);color:var(--b-fg)}.s-pk,.py{background:var(--y-bg);color:var(--y-fg)}.s-dp,.po{background:var(--o-bg);color:var(--o-fg)}
.s-dl,.pp{background:var(--p-bg);color:var(--p-fg)}.s-ok,.pg{background:var(--g-bg);color:var(--g-fg)}.s-rt,.pr{background:var(--r-bg);color:var(--r-fg)}.pn_{background:var(--n-bg);color:var(--n-fg)}
.f{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;font-weight:600;color:var(--mut)}
.rq{color:#c0392b}
.inp,select.inp,textarea.inp{width:100%;min-height:48px;border:0;border-radius:16px;padding:0 16px;background:var(--fld);color:var(--ink);outline:0}
textarea.inp{padding:12px 16px;min-height:76px;resize:vertical}
.inp:focus{box-shadow:0 0 0 2px var(--navy)}
.inp.bad{box-shadow:inset 0 0 0 2px #c0392b;background:#fff}
.inp[readonly]{color:var(--mut);background:#e8edf5}
.err{color:#b3261e;font-size:12px;font-weight:600;min-height:0}
.err:empty{display:none}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btn{min-height:54px;border-radius:27px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;padding:0 22px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.org{background:var(--org);color:var(--navy);box-shadow:0 8px 20px rgba(245,158,91,.4)}
.btn.soft{background:var(--o-bg);color:var(--o-fg)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.danger{background:#fff;color:#b5301c;box-shadow:inset 0 0 0 1.5px #b5301c}
.btn.sm{min-height:46px;width:auto;font-size:14px;padding:0 18px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:20px;background:var(--fld);font-size:14px;font-weight:600;display:inline-flex;align-items:center;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff}
.chips.fl .chip{background:#fff;box-shadow:0 2px 8px rgba(15,26,51,.06)}
.chips.fl .chip.on{background:var(--navy)}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll .chip{flex-shrink:0}
.seg{display:flex;background:var(--fld);border-radius:20px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:16px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 8px rgba(15,26,51,.1)}
.cpy{width:36px;height:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--fld)}
.cpy svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card.navy .cpy{background:rgba(255,255,255,.14)}.card.navy .cpy svg{stroke:#fff}
.ic{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.tile b{font-size:28px;font-weight:800;line-height:1.05}.tile span{font-size:12px;font-weight:600;opacity:.85}
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:calc(min(460px,100%) - 28px);height:68px;border-radius:34px;background:var(--navy);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;box-shadow:0 10px 30px rgba(15,26,51,.35);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#a4b2d2;min-height:56px;justify-content:center}
.nav svg{width:21px;height:21px;fill:none;stroke:#a4b2d2;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav.six button{font-size:10px}.nav button.on{color:#fff}.nav button.on svg{stroke:var(--org)}
.foot{position:sticky;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,26,51,.08);display:flex;gap:12px;z-index:10}
.road{position:relative;display:flex;justify-content:space-between;padding:6px 2px 0}
.road:before{content:"";position:absolute;left:28px;right:28px;top:28px;border-top:3px dashed #cfd9ea}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:56px}
.stop i{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;border:3px solid #fff;box-shadow:0 2px 8px rgba(15,26,51,.14)}
.stop span{font-size:11px;font-weight:600;color:var(--mut)}
.tl{position:relative;display:flex;flex-direction:column;gap:22px;padding-left:2px}
.tl:before{content:"";position:absolute;left:14px;top:14px;bottom:14px;border-left:3px solid #bfe9d3}
.tl .st{display:flex;align-items:center;gap:14px;position:relative}
.tl .st i{width:28px;height:28px;border-radius:14px;background:#4ccf94;color:#fff;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 0 1px #4ccf94;flex-shrink:0}
.tl .st.pend i{background:#e3e9f3;box-shadow:0 0 0 1px #cfd9ea;color:transparent}.tl .st.pend b{color:var(--soft);font-weight:600}
.tl .st.cur i{background:var(--org);box-shadow:0 0 0 1px var(--org)}
.tl .st b{flex:1;font-size:15px;font-weight:700}.tl .st span{font-size:12px;color:var(--soft);text-align:right}
.bar{height:10px;background:var(--fld);border-radius:5px;flex:1}.bar i{display:block;height:10px;border-radius:5px;background:var(--navy)}
.up{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px dashed #c5cde0;border-radius:18px;padding:10px 12px;background:#f9fbfe;font-size:13px;font-weight:600}
.up .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.up .bt{display:flex;gap:6px;flex-shrink:0}
.up button{font-size:12px;font-weight:700;background:#e3ecfb;color:#1d4fa8;border-radius:12px;padding:9px 12px;min-height:38px}
.note{border-radius:18px;padding:12px 14px;font-size:13px;font-weight:600}
.note.b{background:var(--b-bg);color:var(--b-fg)}.note.g{background:var(--g-bg);color:var(--g-fg)}.note.r{background:var(--r-bg);color:var(--r-fg)}.note.y{background:var(--y-bg);color:var(--y-fg)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--mut)}.kv b{color:var(--ink);text-align:right;font-weight:600;word-break:break-word}
.empty,.errbox{text-align:center;padding:30px 16px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b,.errbox b{font-size:16px;color:var(--ink)}
.sk{border-radius:20px;background:linear-gradient(90deg,#e8eef7 25%,#f3f6fb 37%,#e8eef7 63%);background-size:400% 100%;animation:sh 1.3s infinite;height:84px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.brand{background:var(--navy);color:#fff;border-radius:0 0 44px 44px;padding:56px 28px 40px;position:relative;overflow:hidden}
.brand svg.bg{position:absolute;right:-30px;top:20px;width:260px;opacity:.9}
#layer .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;max-width:min(430px,92vw);background:var(--navy);color:#fff;padding:13px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .2s}
#layer .toast.ok{background:#0d6a45}#layer .toast.bad{background:#b3261e}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.ov{position:fixed;inset:0;background:rgba(15,26,51,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:30px 30px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet h3{margin:0;font-size:19px}
.scanner{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;align-items:center}
.scanner video{width:100%;flex:1;min-height:0;object-fit:cover;background:#000}
.scanner .fr{position:absolute;top:22%;left:50%;width:230px;height:230px;transform:translateX(-50%);border:3px solid var(--org);border-radius:28px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.scanner .pan{width:100%;max-width:460px;background:#fff;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:6px}.step i{flex:1;height:6px;border-radius:3px;background:#d3dbea}.step i.on{background:var(--org)}
.lg{display:flex;gap:10px;align-items:center;font-size:14px}
a.btn{text-decoration:none}
#found,#res,#devlist{display:flex;flex-direction:column;gap:14px}#devlist{gap:0}
@media(min-width:700px){body{padding:18px 0}#app{min-height:calc(100vh - 36px);border-radius:32px;overflow:hidden}.nav{bottom:32px}}
.pwwrap{position:relative}.pwwrap .inp{padding-right:52px}
.eye{position:absolute;right:4px;top:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--mut);border-radius:24px}
.eye:active{background:var(--fld)}

/* ===== TRAK MOTION GPS — Premium Navy + Cyan theme (v2) ===== */
:root{--bg:#f2f7fc;--navy:#0a1f44;--navy2:#123a73;--org:#17c3e6;--cy:#17c3e6;--cy2:#0ea5c9;--ink:#0a1f44;--mut:#4d5f80;--soft:#6a7b99;--line:#dfe8f3;--fld:#eaf1f9;
--sh:0 6px 22px rgba(10,31,68,.08);--sh2:0 14px 34px rgba(10,31,68,.16);--grad:linear-gradient(135deg,#0a1f44 0%,#123a73 60%,#0e6a98 100%);
--b-bg:#d9efff;--b-fg:#0b57a8;--o-bg:#d4f6fc;--o-fg:#07768f;--g-bg:#cdf5e3;--g-fg:#0b6b45;--y-bg:#fff0c2;--y-fg:#7a5200;--p-bg:#e4e0fb;--p-fg:#4328a6}
body{background:#dfe9f5;font-feature-settings:"tnum"}
#app{background:linear-gradient(180deg,#e3f1fb 0,var(--bg) 220px);box-shadow:0 0 60px rgba(10,31,68,.18)}
.main{animation:fi .28s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hdr h1{letter-spacing:-.4px;background:linear-gradient(90deg,#0a1f44,#0e6a98);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:#fff;border:1px solid var(--line);transition:transform .15s}.ib:active{transform:scale(.92)}
.ib svg{stroke:var(--navy2)}.dot{background:var(--cy);box-shadow:0 0 0 3px #fff}
.card{border-radius:22px;border:1px solid rgba(223,232,243,.9);box-shadow:var(--sh);transition:transform .15s,box-shadow .2s}
button.card:active{transform:scale(.985)}
.card.navy{background:var(--grad);border:0;box-shadow:var(--sh2);position:relative;overflow:hidden}
.card.navy:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(23,195,230,.35),transparent 70%);pointer-events:none}
.card.flat{border:1.5px dashed #9ddbe9;background:#f4fcff}
.sec{text-transform:uppercase;letter-spacing:.9px;font-size:11.5px;color:var(--cy2);font-weight:800}
.tile{border-radius:20px;box-shadow:var(--sh);border:1px solid rgba(255,255,255,.6);position:relative;overflow:hidden}
.tile b{font-size:30px;letter-spacing:-.6px}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--cy),var(--navy2))}
.pill{border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.2px}
.inp,select.inp,textarea.inp{background:#fff;border:1.5px solid var(--line);border-radius:14px;min-height:50px;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--cy);box-shadow:0 0 0 4px rgba(23,195,230,.18)}
.inp[readonly]{background:#eef3f9}
.btn{background:var(--grad);border-radius:16px;min-height:54px;box-shadow:0 8px 20px rgba(10,31,68,.28);transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn.org{background:linear-gradient(135deg,#17c3e6,#0ea5c9);color:#04263a;box-shadow:0 8px 22px rgba(23,195,230,.45)}
.btn.soft{background:var(--o-bg);color:var(--o-fg);box-shadow:none}
.btn.ghost{background:#fff;color:var(--navy2);box-shadow:inset 0 0 0 1.5px var(--navy2)}
.btn.danger{box-shadow:inset 0 0 0 1.5px #c0392b}
.chip{border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--navy2)}
.chip.on,.chips.fl .chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(10,31,68,.25)}
.seg{background:#e2edf8;border-radius:16px}.seg button{border-radius:12px}.seg button.on{color:var(--navy2)}
.cpy{background:#e3f6fb}.cpy svg{stroke:var(--cy2)}
.nav{background:rgba(10,31,68,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(23,195,230,.25);border-radius:30px;box-shadow:0 14px 36px rgba(10,31,68,.4)}
.nav button{color:#8fa6cc;transition:color .15s}.nav button.on{color:#fff}.nav button.on svg{stroke:var(--cy);filter:drop-shadow(0 0 6px rgba(23,195,230,.7))}
.nav svg{stroke:#8fa6cc}
.foot{border-radius:26px 26px 0 0;border-top:1px solid var(--line)}
.brand{background:var(--grad);border-radius:0 0 46px 46px}
.brand:before{content:"";position:absolute;inset:auto -60px -80px auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(23,195,230,.4),transparent 70%)}
.sk{background:linear-gradient(90deg,#e3edf8 25%,#f2f8fd 37%,#e3edf8 63%);background-size:400% 100%}
.bar{background:#e2edf8}.bar i{background:linear-gradient(90deg,var(--cy),var(--navy2))}
.step i.on{background:var(--cy)}
.road:before{border-top-color:#b6dcea}
.tl:before{border-left-color:#b9eaf3}.tl .st.cur i{background:var(--cy);box-shadow:0 0 0 1px var(--cy)}
.up{background:#f4fbfe;border-color:#a9dcea}.up button{background:#d4f6fc;color:#07768f}
.note.b{background:#d9efff}.ov{background:rgba(6,18,42,.6);backdrop-filter:blur(3px)}
.sheet{border-radius:26px 26px 0 0;animation:sl .25s ease both}
@keyframes sl{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.scanner .fr{border-color:var(--cy)}
#layer .toast{background:var(--grad);border:1px solid rgba(23,195,230,.35)}
a{color:var(--cy2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3 — ONE consistent premium CARD system (tokens: radius 22 / pad 16 / gap 12 / shadow var(--sh)) ===== */
:root{--r:22px;--r2:16px;--g-blue:linear-gradient(135deg,#1e6fe0,#17c3e6);--g-amber:linear-gradient(135deg,#f5a623,#ffd36b);--g-orange:linear-gradient(135deg,#ff7a45,#ffb067);--g-purple:linear-gradient(135deg,#6a4cf0,#a58bff);--g-green:linear-gradient(135deg,#0fa968,#4be3a0);--g-red:linear-gradient(135deg,#e2432f,#ff8a73);--g-slate:linear-gradient(135deg,#334a75,#5d79ad);--g-navy:linear-gradient(135deg,#0a1f44,#123a73 60%,#0e6a98)}
.card{border-radius:var(--r);padding:16px;gap:12px}
.main{gap:14px}
/* KPI cards: colourful gradients, big value, short label */
.tile{color:#fff;border:0;padding:16px 14px;min-height:92px;justify-content:flex-end;box-shadow:0 10px 24px rgba(10,31,68,.16)}
.tile:before{display:none}
.tile:after{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.18)}
.tile b{font-size:30px;color:#fff;position:relative;z-index:1}.tile span{color:rgba(255,255,255,.92);font-weight:600;position:relative;z-index:1}
.tile.s-in,.tile.pb{background:var(--g-blue)}.tile.s-pk,.tile.py{background:var(--g-amber)}.tile.s-dp,.tile.po{background:var(--g-orange)}
.tile.s-dl,.tile.pp{background:var(--g-purple)}.tile.s-ok,.tile.pg{background:var(--g-green)}.tile.s-rt,.tile.pr{background:var(--g-red)}.tile.pn_{background:var(--g-slate)}
button.tile{transition:transform .15s}button.tile:active{transform:scale(.96)}
.tile.s-pk b,.tile.s-pk span,.tile.py b,.tile.py span{color:#3d2a00}
/* icon badges: gradient discs */
.ic{border-radius:15px;width:44px;height:44px;box-shadow:0 4px 10px rgba(10,31,68,.12)}
.ic.s-in,.ic.pb{background:var(--g-blue);color:#fff}.ic.s-pk,.ic.py{background:var(--g-amber);color:#4a3200}.ic.s-dp,.ic.po{background:var(--g-orange);color:#fff}

<body>
<div id="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* =====================================================================
   TRAK MOTION GPS — Frontend (single file)
   Sections: 1 Config · 2 Utils · 3 State/Permissions · 4 API layer
             5 (removed) · 6 UI kit · 7 Screens · 8 Actions · 9 Scanner · 10 Boot
   ===================================================================== */

/* ---------- 1. CONFIG ---------- */
const CFG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbz-DSwi9o0m6ur9iJ7rJqfMfTOXrpWl-cjQ3Ua_0N3TjCBwmLLZCY56OsBHtnI-ReWe3g/exec'
};
/* ---------- 2. UTILS ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
};
const last6 = i => String(i || '').slice(-6);
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fdt(ts) { if (!ts) return '—'; const d = new Date(ts); if (isNaN(d)) return String(ts); return `${pad(d.getDate())} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fd(ts) { if (!ts) return '—'; const d = new Date(ts); if (isNaN(d)) return String(ts); return `${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`; }
const nowISO = () => new Date().toISOString();
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const timeStr = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const n0 = v => (v === undefined || v === null || v === '') ? '—' : (typeof v === 'number' ? v.toLocaleString('en-IN') : esc(v));

const BRANCHES = ['Varanasi', 'Ranchi', 'Dehri', 'Others'];
const MODELS = ['BR05M', 'BR05 V5', 'SK05', 'OTHERS'];
const RELAYS = ['12V', '24V', 'Other'];
const STATES = ['Bihar', 'Jharkhand', 'Uttar Pradesh'];
const STATUSES = ['IN STOCK', 'PACKED', 'DISPATCHED', 'DELIVERED', 'INSTALLED', 'RETURNED'];
const PARTY_TYPES = ['Dealer', 'Distributor', 'Installer', 'Car Mechanic', 'Car Accessories', 'Customer'];
const PARTNER_TYPES = ['Dealer', 'Distributor', 'Car Mechanic', 'Car Accessories'];
const INSTALLER_TYPES = ['Freelance', 'Workshop', 'Company'];
const SOURCES = ['Website', 'Referral', 'Dealer', 'Distributor', 'Other'];
const TASK_TYPES = ['Installation', 'Customer Follow-up', 'Delivery', 'Dispatch', 'Stock Review', 'KYC Correction', 'Device Replacement', 'SIM-Related', 'Custom'];
const TASK_STATUSES = ['Pending', 'In Progress', 'Follow-up Due', 'Overdue', 'Completed'];
const KYC_STATUSES = ['Pending', 'Submitted', 'Verified', 'Correction'];
const ACCOUNT_STATUSES = ['Active', 'Inactive', 'Blocked'];
const VERIFY_STATUSES = ['Unverified', 'Verified'];
const RETURN_REASONS = ['Faulty device', 'Wrong model', 'Customer cancelled', 'Other'];
const PARTNER_DOCS = ['Aadhaar Front', 'Aadhaar Back', 'PAN', 'Shop / Address Proof'];   /* no bank section */
const INSTALLER_DOCS = ['Aadhaar Front', 'Aadhaar Back', 'PAN', 'Photo', 'Address Proof', 'Work / Trade Proof'];
const stCls = s => ({ 'IN STOCK': 's-in', 'PACKED': 's-pk', 'DISPATCHED': 's-dp', 'DELIVERED': 's-dl', 'INSTALLED': 's-ok', 'RETURNED': 's-rt' }[s] || 'pn_');
const kycCls = s => ({ Verified: 'pg', Pending: 'py', Submitted: 'pb', Correction: 'pr' }[s] || 'pn_');
const taskCls = s => ({ Pending: 'py', 'In Progress': 'pb', 'Follow-up Due': 'po', Overdue: 'pr', Completed: 'pg' }[s] || 'pn_');
const acctCls = s => ({ Active: 'pg', Inactive: 'pn_', Blocked: 'pr' }[s] || 'pn_');

/* ---------- 3. STATE + PERMISSIONS ---------- */
const S = {
  mode: 'live',
  user: null, token: null, perms: [],
  screen: 'login', params: {}, stack: [], F: {}, files: {}, branch: 'All'
};
const ROLES = ['ADMIN', 'MANAGER', 'INVENTORY', 'INSTALLER', 'PARTNER', 'VIEW ONLY'];
/* Live mode: what the screen shows follows the permission list the backend sent at login. */
const PMAP = {
  stock: ['inventory.view', 'mystock.view'], inward: ['inward.create'], pack: ['packing.do'], dispatch: ['dispatch.do'], deliver: ['delivery.do'],
  install: ['installation.do'], return: ['return.do'], search: ['search.global'], customer: ['customer.view', 'customer.manage'],
  partners: ['partner.manage'], installers: ['installer.manage'], people: ['partner.view', 'installer.view'], tasks: ['tasks.view', 'tasks.own'],
  sim: ['sim.view'], simManage: ['sim.manage'], kyc: ['kyc.view', 'kyc.own'], kycReview: ['partner.manage'], import: ['import.run'],
  history: ['history.view'], notifications: ['notifications.view'], price: ['finance.view'], reports: ['reports.view'], users: ['users.manage'],
  directInstall: ['installation.do']
};
function can(a) {
  if (!S.user) return false;
  if (a === 'directInstall') return isRole('ADMIN', 'MANAGER', 'INSTALLER') && S.perms.includes('installation.do');   /* same people who may install straight from stock */
  const m = PMAP[a]; return !!m && m.some(x => S.perms.includes(x));
}
const isRole = (...r) => S.user && r.includes(S.user.role);
/* Branch choices for this user: non-admins can only work in their own branch (backend enforces it too). */
const branchOpts = () => (S.mode === 'live' && S.user && S.user.branch && S.user.branch !== 'All' && !isRole('ADMIN')) ? [S.user.branch] : BRANCHES;
const imeiDisp = i => (S.user && S.user.role === 'PARTNER') ? '····' + last6(i) : (i || '—');
const demoTag = () => '';

/* ---------- 4. API LAYER ---------- */
/* Request:  POST text/plain  { action, token?, requestId, ...payload }
   Response: { ok:true, data } | { ok:false, error:{ code, message } }
   Every UI call goes through api(key, payload). In live mode `Live[key]` turns the UI's
   payload into real backend actions and turns the backend rows back into the shapes the
   screens use. Action names below are the REAL names from the Apps Script action table. */
const uuid = () => { try { return crypto.randomUUID(); } catch (e) { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); } };
const mkErr = (msg, code) => { const e = new Error(msg); e.code = code || 'ERROR'; return e; };

/* ---- speed: reads fired together go to the server as ONE request (batch); identical reads share one call; any write clears the cache ---- */
const RQ = new Map(), RQ_SKIP = new Set(['me', 'logout', 'markNotificationRead']), RQ_NOCACHE = new Set(['listNotifications']);
const BQ = []; let bTimer = null;
function batchRead(action, payload) {
  return new Promise((resolve, reject) => { BQ.push({ action, payload, resolve, reject }); if (!bTimer) bTimer = setTimeout(flushBatch, 12); });
}
function flushBatch() {
  bTimer = null; const items = BQ.splice(0, BQ.length);
  if (!items.length) return;
  if (items.length === 1) { const it = items[0]; rpcRaw(it.action, it.payload).then(it.resolve, it.reject); return; }
  for (let i = 0; i < items.length; i += 40) {
    const chunk = items.slice(i, i + 40);
    rpcRaw('batch', { requests: chunk.map(it => Object.assign({}, it.payload, { action: it.action })) }).then(d => {
      const res = (d && d.results) || [];
      chunk.forEach((it, j) => {
        const r = res[j];
        if (r && r.ok === true) it.resolve(r.data);
        else { const er = r && r.error, code = (er && er.code) || 'ERROR'; if (code === 'AUTH' && S.token) sessionExpired(); it.reject(mkErr((er && er.message) || 'Request failed.', code)); }
      });
    }, err => chunk.forEach(it => it.reject(err)));
  }
}
function rpc(action, payload = {}) {
  if (!READ_ACTIONS.has(action) || RQ_SKIP.has(action)) return rpcRaw(action, payload);
  if (RQ_NOCACHE.has(action)) return batchRead(action, payload);
  let key; try { key = action + '|' + (S.token || '') + '|' + JSON.stringify(payload); } catch (e) { return batchRead(action, payload); }
  const hit = RQ.get(key);
  if (hit && Date.now() - hit.t < 8000) return hit.p;
  const p = batchRead(action, payload);
  RQ.set(key, { p, t: Date.now() });
  if (RQ.size > 60) RQ.delete(RQ.keys().next().value);
  p.catch(() => { const h = RQ.get(key); if (h && h.p === p) RQ.delete(key); });
  return p;
}
async function rpcRaw(action, payload = {}) {
  if (!READ_ACTIONS.has(action)) lcClear();
  const body = Object.assign({}, payload, { action, requestId: (payload && payload.requestId) || uuid() });
  if (S.token) body.token = S.token;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 60000);
  let res, txt;
  try {
    res = await fetch(CFG.APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal });
    txt = await res.text();
  } catch (e) {
    throw mkErr(e && e.name === 'AbortError' ? 'The server took too long to answer. Please try again.' : 'Cannot reach the server. Check your internet connection and try again.', 'NETWORK');
  } finally { clearTimeout(timer); }
  let json; try { json = JSON.parse(txt); } catch (e) { throw mkErr('Unexpected server response (not JSON).', 'BAD_RESPONSE'); }
  if (!json || json.ok !== true) {
    const er = json && json.error, code = (er && er.code) || 'ERROR';
    const msg = (er && (er.message || (typeof er === 'string' ? er : ''))) || ('Request failed (' + res.status + ')');
    if (code === 'AUTH' && S.token && action !== 'login') sessionExpired();
    if (code === 'UNKNOWN_ACTION' || code === 'NOT_IMPLEMENTED') throw mkErr('The server you are connected to does not have this feature yet ("' + action + '"). In Apps Script use Deploy > Manage deployments > Edit > New version, then reload this page.', code);
    throw mkErr(msg, code);
  }
  return json.data;
}
function saveSession(ttl) { try { localStorage.setItem('trak_sess', JSON.stringify({ token: S.token, exp: Date.now() + ttl * 1000, user: S.user, perms: S.perms })); } catch (e) { /* storage blocked */ } }
function sessionExpired() { if (!S.user) return; toast('Session expired. Please sign in again.', 'bad'); doLogout(); }

async function api(key, payload = {}) {
  const h = Live[key];
  if (!h) throw new Error('This feature is not connected to the backend yet: ' + key);
  return h(payload);
}
async function pingBackend() {
  const r = await fetch(CFG.APPS_SCRIPT_URL, { method: 'GET' });
  const t = await r.text();
  return { status: r.status, body: t.slice(0, 400) };
}

/* ---- speed: small in-memory screen cache (shown instantly, refreshed in the background; cleared by any write) ---- */
const LC = new Map(); let lcGen = 0;
const lcClear = () => { LC.clear(); lcGen++; RQ.clear(); };
const lcKey = () => S.screen + '|' + JSON.stringify(S.params) + '|' + S.branch + '|' + (S.user ? S.user.id : '');
const lcSet = (k, d) => { LC.set(k, { d, t: Date.now() }); if (LC.size > 40) LC.delete(LC.keys().next().value); };
const sig = d => { try { return JSON.stringify(d, (k, x) => k === '_lazy' ? undefined : x) + '#' + (d && d.total); } catch (e) { return String(Math.random()); } };
const typing = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#app').contains(a)); };
const READ_ACTIONS = new Set(['batch', 'me', 'logout', 'getDashboard', 'getInventory', 'getMyStock', 'getDevice', 'getTimeline', 'getHistory', 'getMovements', 'globalSearch', 'listCustomers', 'listPartners', 'listInstallers', 'listTasks', 'getKyc', 'getSimStock', 'getReports', 'listNotifications', 'markNotificationRead', 'listUsers']);

/* ---- files: shrink big phone photos, then base64 (backend limit 5 MB per file) ---- */
const MAX_UPLOAD = 5 * 1024 * 1024, KYC_MIME = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Could not read the image.')); };
    im.src = u;
  });
}
async function prepFile(f) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 900 * 1024) return f;
  try {
    const im = await loadImg(f), k = Math.min(1, 1800 / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (b && b.size < f.size) return new File([b], f.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { /* keep original */ }
  return f;
}
async function fileToPayload(f0) {
  const f = await prepFile(f0);
  if (f.size > MAX_UPLOAD) throw new Error(f.name + ' is larger than 5 MB. Choose a smaller file.');
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res({ name: f.name, mime: f.type, size: f.size, dataBase64: String(rd.result).split(',')[1] || '' });
    rd.onerror = () => rej(new Error('Could not read file ' + f.name));
    rd.readAsDataURL(f);
  });
}
async function collectDocs(ids) {            /* attach selected documents (live mode only) */
  const out = [];
  for (const id of ids) { const x = S.files[id]; if (!x) continue; out.push(Object.assign({ type: id }, await fileToPayload(x.file))); }
  return out;
}
function b64Blob(b64, mime) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || 'application/octet-stream' });
}
function loadXlsx() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('Excel reader did not load.')); s.onerror = () => rej(new Error('Could not load the Excel reader. Check your connection, or save the file as CSV.'));
    document.head.appendChild(s);
  });
}
async function readImportFile(file) {        /* -> { rows } for Excel, { csvText } for CSV */
  if (file.size > MAX_UPLOAD) throw new Error('File is larger than 5 MB. Split it and try again.');
  if (/\.csv$/i.test(file.name)) return { csvText: await file.text() };
  const X = await loadXlsx(), wb = X.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  if (!ws) throw new Error('The Excel file has no sheet.');
  return { rows: X.utils.sheet_to_json(ws, { defval: '', raw: false }) };
}

/* ---- backend row -> UI shape helpers ---- */
const isY = v => ['YES', 'TRUE', 'Y', '1'].includes(String(v).toUpperCase());
const kycToUi = s => ({ PENDING: 'Pending', SUBMITTED: 'Submitted', VERIFIED: 'Verified', CORRECTION: 'Correction' }[String(s || '').toUpperCase()] || 'Pending');
const kycToApi = s => String(s || '').toUpperCase();
const taskToUi = s => s === 'Assigned/Pending' ? 'Pending' : s;
const taskToApi = s => s === 'Pending' ? 'Assigned/Pending' : s;
const DOC_LABEL = { AADHAAR_FRONT: 'Aadhaar Front', AADHAAR_BACK: 'Aadhaar Back', PAN: 'PAN', PHOTO: 'Photo', ADDRESS_PROOF: 'Address Proof', WORK_PROOF: 'Work / Trade Proof' };
const DOC_TYPES = { installer: ['AADHAAR_FRONT', 'AADHAAR_BACK', 'PAN', 'PHOTO', 'ADDRESS_PROOF', 'WORK_PROOF'], partner: ['AADHAAR_FRONT', 'AADHAAR_BACK', 'PAN', 'PHOTO', 'ADDRESS_PROOF'] };
const brOrUndef = b => (b && b !== 'All' && b !== 'ALL') ? b : undefined;

function mapDev(d) {
  d = d || {};
  return {
    id: d.DeviceID || '', imei: String(d.IMEI || ''), sim: d.SIMNumber || '', simMobile: String(d.SIMMobileNumber || d.SimMobileNumber || d.SIMMobile || ''), model: d.Model || '', relay: d.Relay || '', lock: d.LockingStatus || '',
    status: d.DeviceStatus || '', simStatus: d.SimStatus || '', branch: d.Branch || '', state: '', partner: d.PartnerID || '', installer: d.InstallerID || '', display: d.DisplayStatus || '',
    customer: d.CustomerName || '', customerId: d.CustomerID || '', vehicle: d.VehicleNumber || '', vehicleModel: '',
    price: (d.PurchasePrice === undefined || d.PurchasePrice === '') ? null : Number(d.PurchasePrice), order: d.DispatchOrderID || '', recipient: d.RecipientName || '', packOrder: d.PackOrderID || '', inwardDate: d.InwardDate || '', packedDate: d.PackedDate || '', deliveredDate: d.DeliveredDate || '', installedDate: d.InstalledDate || '', dispatchDate: d.DispatchDate || ''
  };
}
function mapDevFull(r) {                      /* getDevice -> UI device */
  const d = mapDev(r.device), c = r.customer;
  if (c) { d.customer = c.Name || ''; d.customerId = c.CustomerID || d.customerId; d.vehicle = c.VehicleNumber || d.vehicle; d.vehicleModel = c.VehicleModel || ''; d.custUid = c.UserID || ''; d.custMobile = c.Mobile || ''; d.custCity = c.City || ''; d.custState = c.State || ''; }
  return d;
}
function tlToHist(t) {                        /* getTimeline -> events the device screen understands */
  const h = [];
  (t.stages || []).forEach(s => { if (s.done) h.push({ ts: s.date, action: s.stage, from: '', to: '', user: '', role: '', branch: '', remarks: s.orderId || '' }); });

  if (sc.perm && !can(sc.perm)) { app.innerHTML = scr(sc.title, empty('Not available', 'Your role does not have access to this section.'), { back: true }); return; }

    S.data = data;

  };

    if (hit && Date.now() - hit.t < 600000) {                       /* show the last result at once, then refresh quietly */
      data = hit.d; paint(data);
      sc.load().then(f => {
        if (tok !== rt || gen !== lcGen) return;
        const m = sc.merge ? sc.merge(data, f) : f; lcSet(ck, m);
        if (sig(m) !== sig(data)) { if (typing()) return; paint(m); }
        else { S.data = m; if (m._lazy && sc.after) sc.after(m); }
      }).catch(() => { /* keep showing the cached screen */ });

    }
    app.innerHTML = scr(sc.title || '', skeleton(4), { tab: sc.tab, back: !sc.tab });
    try { data = await sc.load(); } catch (e) { if (tok !== rt) return; app.innerHTML = scr(sc.title || '', errBox(e.message), { tab: sc.tab, back: !sc.tab }); return; }
    if (tok !== rt) return;

  }

}
function reset(screen, params) { closeScanner(); closeSheet(); S.screen = screen; S.params = params || {}; S.F = {}; S.files = {}; }

/* ---------- 9. QR SCANNER ---------- */
const SC = { stream: null, timer: null, det: null, jsqr: false, cv: null, sid: 0, switching: false, opts: null, cur: '', vid: null };
/* Rear-camera detection. Android Chrome names cameras like "camera2 0, facing back"; iOS/others say "Back Ultra Wide Camera".
   Labels only exist after camera permission is granted, so this runs on the already-open stream. */
const CAM_FRONT = /front|user|selfie/i, CAM_REAR = /back|rear|environment/i, CAM_WIDE = /ultra|wide|0\.5/i, CAM_SKIP = /tele|macro|depth|mono|infra|bokeh|thermal|\bir\b/i;

  const lbl = d => String(d.label || '');

  if (rear.some(d => CAM_REAR.test(lbl(d)))) rear = rear.filter(d => CAM_REAR.test(lbl(d)));
  const good = rear.filter(d => !CAM_SKIP.test(lbl(d))), pool = good.length ? good : rear;

  const normal = (cur && !CAM_WIDE.test(lbl(cur))) ? cur : (pool.find(d => !CAM_WIDE.test(lbl(d))) || cur || pool[0] || null);
  const others = pool.filter(d => d !== normal), wide = others.find(d => CAM_WIDE.test(lbl(d))) || others[0] || null;
  return { normal, wide };
}
const RX_IMEI = /(?<!\d)\d{15}(?!\d)/, RX_SIM = /89\d{17,18}[A-Za-z]?/;

function closeScanner() {

  if (SC.stream) { SC.stream.getTracks().forEach(t => { try { t.stop(); } catch (e) { /* ignore */ } }); SC.stream = null; }
  const n = $('#scanner'); if (n) { const v = n.querySelector('video'); if (v) v.srcObject = null; n.remove(); }
  SC.det = null; S.scan = null; SC.sid++; SC.switching = false; SC.opts = null; SC.cur = ''; SC.vid = null; SC.busy = false;
}
function stopStream() {
  if (SC.stream) { SC.stream.getTracks().forEach(t => { try { t.stop(); } catch (e) { /* ignore */ } }); SC.stream = null; }
}
/* Open one rear camera. deviceId '' = browser's default rear camera. Never returns a front camera. */
async function openCam(opt) {

}

}

/* Stop the old stream first, then start the chosen camera. The scan loop keeps running and just pauses meanwhile. */

function groupActivity(items) {                 /* newest first in, newest first out; one card per order */
  const out = [], idx = {}, party = {};
  (items || []).forEach(m => { if (m.Type === 'DISPATCH' && m.OrderID && m.PartyName && !party[m.OrderID]) party[m.OrderID] = m.PartyName; });
  (items || []).forEach(m => {
    const type = String(m.Type || ''), oid = String(m.OrderID || ''), key = (oid && ['PACKING', 'DISPATCH', 'DELIVERY', 'ASSIGNMENT'].includes(type)) ? type + '|' + oid : null;
    if (key && idx[key] !== undefined) { const g = out[idx[key]]; if (!g.imeis.includes(String(m.IMEI))) g.imeis.push(String(m.IMEI)); if (String(m.DateTime) > String(g.ts)) g.ts = m.DateTime; return; }
    const g = { type, ts: m.DateTime, imeis: [String(m.IMEI)], orderId: oid, party: m.PartyName || m.RecipientName || m.CustomerName || (type === 'DELIVERY' ? party[oid] : '') || '', user: m.User || '', role: m.Role || '', branch: m.Branch || '', status: m.ToStatus || '', remarks: m.Remarks || '', vehicle: m.VehicleNumber || '' };
    if (key) idx[key] = out.length; out.push(g);
  });
  return out;
}

}

}

async function recentOrders() {
  const [d, v] = await Promise.all([rpc('getMovements', { type: 'DISPATCH', limit: 500 }), rpc('getMovements', { type: 'DELIVERY', limit: 500 })]);
  const got = {}; (v.items || []).forEach(m => { const k = String(m.OrderID); (got[k] = got[k] || {})[String(m.IMEI)] = 1; });
  const map = {}, ord = [];
  (d.items || []).forEach(m => {
    const k = String(m.OrderID); if (!k) return;
    let o = map[k]; if (!o) { o = map[k] = { orderId: k, party: m.PartyName || '', partyType: m.PartyType || '', date: m.DateTime, imeis: {}, branch: m.Branch }; ord.push(k); }
    o.imeis[String(m.IMEI)] = 1; if (String(m.DateTime) > String(o.date)) o.date = m.DateTime; if (!o.party) o.party = m.PartyName || '';
  });
  return ord.map(k => { const o = map[k], total = Object.keys(o.imeis).length, done = Object.keys(o.imeis).filter(i => (got[k] || {})[i]).length; o.total = total; o.delivered = done; o.status = done === 0 ? 'Pending' : (done < total ? 'In Progress' : 'Completed'); return o; }).sort((a, b) => String(b.date) > String(a.date) ? 1 : -1);
}

async function upDoc(id, docType) {
  S.F.upl = S.F.upl || {}; if (S.F.upl[id]) return S.F.upl[id];
  const x = S.files[id]; if (!x) return ''; const f = await fileToPayload(x.file);
  const r = await rpc('uploadCustomerDoc', { docType, mimeType: f.mime, base64: f.dataBase64 }); S.F.upl[id] = r.fileId; return r.fileId;
}
ACT.doInstall = el => busy(el, async () => {
  const d = S.dev, mode = S.F.cmode, vn = v('vn').toUpperCase().replace(/[\s-]+/g, ''), rules = [], direct = d.status === 'IN STOCK';
  const needAad = mode !== 'Linked customer' && !(mode === 'Repeat customer' && S.F.cust && S.F.cust.aadhaarOnFile);
  if (mode === 'New customer') {
    const cm = v('cm'), alt = v('calt');
    rules.push(['cuid', /^[A-Za-z0-9_.-]{3,40}$/.test(v('cuid')), 'User ID: 3 to 40 letters, digits, dot, dash or underscore'], ['cn', !!v('cn'), 'Enter the customer name'], ['cm', /^\d{10}$/.test(cm), 'Enter a 10-digit mobile number'], ['calt', !alt || (/^\d{10}$/.test(alt) && alt !== cm), 'Alternate mobile must be 10 digits and different from mobile'], ['ccity', !!v('ccity'), 'Enter the city'], ['cstate', !!v('cstate'), 'Choose a state'], ['cpin', !v('cpin') || /^\d{6}$/.test(v('cpin')), 'PIN must be 6 digits']);
  }
  if (mode === 'Repeat customer') rules.push(['ruid', !!(S.F.cust && S.F.cust.customer && String(S.F.cust.customer.userId).toLowerCase() === v('ruid').toLowerCase()), 'Verify the customer first'], ['ralt', /^\d{10}$/.test(v('ralt')), 'Enter the 10-digit primary mobile']);
  if (mode !== 'Linked customer' || document.getElementById('vn')) rules.push(['vn', /^[A-Z0-9]{4,12}$/.test(vn), 'Enter a valid vehicle number']);
  rules.push(['idate', !!v('idate'), 'Choose the installation date'], ['itime', !!v('itime'), 'Choose the installation time']);
  if (v('ipkg') === 'Others') rules.push(['ipkgo', !!v('ipkgo'), 'Enter Package Name']);
  if (v('isp')) rules.push(['isp', !isNaN(Number(v('isp').replace(/,/g, ''))) && Number(v('isp').replace(/,/g, '')) >= 0, 'Enter a valid price']);
  if (v('idate') && v('itime')) { const t = new Date(v('idate') + 'T' + v('itime')).getTime(); rules.push(['idate', !isNaN(t) && t <= Date.now() + 5 * 60000, 'Installation date/time cannot be in the future']); }
  if (!validate(rules)) return;
  if (!await confirmBox('Complete installation?', `Device <b>${esc(imeiDisp(d.imei))}</b>${vn ? ' on vehicle <b>' + esc(vn) + '</b>' : ''}. SIM will become ACTIVE.${direct ? '<br>This device goes straight from stock to installed.' : ''}`, 'Complete')) return;
  /* one idempotency key per distinct submission: a retry (e.g. after a timeout) re-sends the SAME key, so the server cannot create a second record */
  const sig = [d.imei, mode, vn, v('idate'), v('itime'), v('cuid'), v('ruid'), v('iinst')].join('|');
  if (!S.F.reqSig || S.F.reqSig !== sig) { S.F.reqSig = sig; S.F.reqId = uuid(); }
  let r;
  try {
    const f = S.files.in_aadhaar_f ? await upDoc('in_aadhaar_f', 'AADHAAR_FRONT') : '', b = S.files.in_aadhaar_b ? await upDoc('in_aadhaar_b', 'AADHAAR_BACK') : '', ph = S.files.in_photo ? await upDoc('in_photo', 'INSTALL_PHOTO') : '';
    const common = { requestId: S.F.reqId, imei: d.imei, vehicleNumber: vn || undefined, vehicleModel: v('vm') || undefined, aadhaarFrontFileId: f || undefined, aadhaarBackFileId: b || undefined, photoFileId: ph || undefined, installerId: v('iinst') || undefined, installedAt: (v('idate') && v('itime')) ? new Date(v('idate') + 'T' + v('itime')).toISOString() : undefined, installDate: v('idate'), installTime: v('itime'), softwareUsing: v('csw') || undefined, package: bePkg().package, packageName: bePkg().packageName, sellingPrice: (isRole('ADMIN') && v('isp')) ? v('isp') : undefined };
    if (mode === 'Linked customer') r = await rpc(direct ? 'installFromStock' : 'installDevice', Object.assign({ customerId: d.customerId }, common));
    else if (mode === 'Repeat customer') r = await rpc('installDeviceFull', Object.assign({ customerUserId: v('ruid'), altMobile: v('ralt') }, common));
    else r = await rpc('installDeviceFull', Object.assign({ userId: v('cuid'), name: v('cn'), mobile: v('cm'), altMobile: v('calt'), address: v('cadr'), city: v('ccity'), state: v('cstate'), pin: v('cpin') }, common));
  } catch (e) {
    /* a network/timeout error does not prove the save failed: check the device before telling the user it failed */
    if (e && (e.code === 'NETWORK' || e.code === 'BAD_RESPONSE')) {
      try { const c0 = mapDevFull(await rpc('getDevice', { imei: d.imei })); if (c0.status === 'INSTALLED') r = { verifiedLate: true }; } catch (x) { /* still unknown */ }
      if (!r) { toast(e.message + ' Your installation may not have been saved. Tap Complete installation again — retrying is safe and will not create a duplicate.', 'bad'); return; }
    } else { toast(e.message, 'bad'); return; }
  }
  /* Package + Selling Price are saved inside the installation itself (backend), so there is no separate step that can fail */
  /* a new or repeat customer must come back saved and linked; otherwise this is NOT a success */
  if (mode !== 'Linked customer' && r && !r.verifiedLate && !r.customerId) { toast('The customer record was not confirmed by the server. Please check the customer list and try again.', 'bad'); return; }
  /* never show success on the server's word alone: read the device back */
  let chk = null; try { chk = mapDevFull(await rpc('getDevice', { imei: d.imei })); } catch (x) { /* read-back unavailable */ }
  if (chk && chk.status !== 'INSTALLED') { toast('The server did not confirm the installation (device is ' + chk.status + '). Nothing was marked installed — please try again.', 'bad'); return; }
  await recordInstallExt(d.imei, v('idate'));
  S.files = {}; S.F.upl = {}; S.F.reqSig = ''; S.F.reqId = '';
  const when = chk && chk.installedDate ? ' on ' + fdt(chk.installedDate) : '';
  $('#found').innerHTML = doneCard('Installed', esc('Installation saved' + when + '. Device is INSTALLED and SIM is ACTIVE.' + (r && r.customerId ? ' Customer ' + r.customerId + (r.newCustomer ? ' saved and linked.' : ' linked.') : '') + (r && r.aadhaarReused ? ' Existing Aadhaar was reused.' : '')), `<button class="btn org" ${goA('install')}>Install another</button><button class="btn ghost" ${goA('device', { imei: d.imei })}>Open device</button>`);
});

async function lgRun(g, list, sheetRowOf) {         /* list = [{ i, src }] ; sends 300 rows at a time */
  g.step = 3; render(); const bar = () => $('#lgbar'), txt = () => $('#lgtxt');
  const CH = 300; let done = 0;
  for (let p = 0; p < list.length; p += CH) {
    const part = list.slice(p, p + CH); let r = null, err = '';
    for (let a = 0; a < 3 && !r; a++) {
      try { r = await rpc('legacyImport', { rows: part.map(x => x.src), mapping: g.mapUsed, batchId: g.batchId, startRow: sheetRowOf(part[0].i) }); }
      catch (e) { err = e.message; if (e.code && e.code !== 'NETWORK') break; await sleep(1500); }
    }
    if (!r) { part.forEach(x => { g.failedRows.push({ row: sheetRowOf(x.i), reason: 'Not saved: ' + err, data: x.src, src: x.src, i: x.i }); }); g.tot.failed += part.length; }
    else {
      g.tot.imported += r.imported; g.tot.incomplete += r.incomplete; g.tot.duplicates += r.duplicates; g.tot.failed += r.failed;
      (r.duplicateRows || []).forEach(d => g.dupRows.push({ row: d.row, reason: 'Duplicate (' + d.key + ')', data: g.rows[d.row - 2] || {} }));
      (r.errors || []).forEach(e => g.failedRows.push({ row: e.row, reason: e.reason, data: e.data, src: e.data, i: e.row - 2 }));
    }
    done += part.length;
    if (bar()) bar().style.width = Math.round(done / list.length * 100) + '%';
    if (txt()) txt().textContent = `${done.toLocaleString('en-IN')} of ${list.length.toLocaleString('en-IN')} rows processed — ${g.tot.imported} imported, ${g.tot.duplicates} duplicate, ${g.tot.failed} failed`;
  }
  lcClear(); g.step = 4; render();
}

async function universalSearch(q) {
  const dg = q.replace(/\D/g, ''), cp = q.replace(/[\s-]/g, ''), digitsOnly = /^[\d\s+-]+$/.test(q), canC = can('customer'), lq = q.toLowerCase();
  const jobs = [], add = (k, pr) => jobs.push(pr.then(v => ({ k, v })).catch(e => ({ k, e })));
  if (digitsOnly && dg.length >= 6) add('imei', rpc('searchAll', { mode: 'imei', q: dg }));
  if (cp.length >= 5) add('sim', rpc('searchAll', { mode: 'sim', q }));
  if (cp.length >= 3) add('veh', rpc('searchAll', { mode: 'vehicle', q }));
  if (canC && q.length >= 2) add('cust', rpc('listCustomers', { q: (digitsOnly && dg.length >= 10) ? dg.slice(-10) : q, pageSize: 100 }));
  if (q.length >= 2) add('leg', rpc('legacySearch', { q }));
  const res = await Promise.all(jobs), got = {}; let allFailed = res.length > 0, firstErr = null;
  res.forEach(x => { if (x.e) { if (!firstErr) firstErr = x.e; } else { allFailed = false; got[x.k] = x.v; } });
  if (allFailed) throw firstErr;
  /* customers (name / user id / mobile) */
  const dg10 = dg.slice(-10), hasM = r => dg.length >= 10 && (String(r.Mobile || '').includes(dg10) || String(r.AltMobile || '').includes(dg10));
  const rows = ((got.cust || {}).items || []).filter(r => String(r.Name || '').toLowerCase().includes(lq) || String(r.UserID || '').toLowerCase().includes(lq) || String(r.CustomerID) === q || hasM(r) || (String(r.VehicleNumber || '').toUpperCase().replace(/[\s-]/g, '').includes(cp.toUpperCase()) && !String(r.IMEI || '').trim()));
  const groups = {}, order = [];

/* =====================================================================
   ADD-ON v3 — Direct Installation · Customers · Package list · Package & recharge dates
   ---------------------------------------------------------------------
   BACKEND DEPENDENCY (no backend code has been changed):
   The current backend (a) only accepts the old package names, (b) has no recharge / manual-correction
   fields and (c) has no "installation without a device record". Until it is authorised, everything that
   needs those is kept in a small store on THIS device (localStorage key trak_ext_v1) and every screen

   ===================================================================== */
const BACKEND_EXT = { packages: true, recharge: true, direct: true };   /* backend (Part 19 + Part 20) is authorised and connected */
/* Recharge rule — NOT defined anywhere in the existing system, so nothing is calculated automatically until

   dueOffsetDays = days added to Next Recharge Date to get Recharge Due Date (null = rule unknown). */
const RECHARGE_RULES = { confirmed: false, dueOffsetDays: null };

  '1 Year Basic': { m: 12 }, '1 Year Premium': { m: 12 }, '2 Year Premium': { m: 24 },
  'RAAMO RATANN — 1 Year (Free)': { m: 12, free: true }, 'RAAMO RATANN — 2 Year (Free)': { m: 24, free: true },
  '1 Year': { m: 12 }, '2 Years': { m: 24 }, 'RAAMO RATANN': { free: true }
};
const NOTSET = 'Not set';
const LOCAL_NOTE = '';

/* ---------- dates (all plain YYYY-MM-DD, no time-zone surprises) ---------- */
const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;

const rcCls = s => ({ Upcoming: 'pb', Due: 'py', Overdue: 'pr', Paid: 'pg' }[s] || 'pn_');

/* ---------- package facts for one installation ---------- */
function pkgInfo(raw, rawName, ext) {

  const months = (ext.durationMonths !== undefined && ext.durationMonths !== null && ext.durationMonths !== '') ? Number(ext.durationMonths) : (meta.m || null);
  return {
    sel, name: !sel ? '' : (sel === 'Others' ? (nm || 'Others') : sel), months,
    type: ext.pkgType || (meta.free ? 'Free' : ''),

}
/* everything the screens show about one installation, from backend facts + the add-on store */
function instView(base, ext) {

  const next = ext.nextRecharge || '', due = ext.dueDate || '', last = ext.lastRecharge || '';

/* ---------- the add-on store (this device only) ---------- */
const EXT = (() => {

    read, commit,
    get: imei => read().pk[String(imei)] || null,
    _t: 0, _busy: null,
    syncIfStale(ms) { return (Date.now() - api._t > ms) ? api.sync().catch(() => false) : Promise.resolve(true); },
    /* pull everything from the server (this device only keeps a cache); move older this-device-only records to the server once */
    sync() {

          const local = oldDirect.filter(x => x && x.imei && !srv[x.imei] && String(x.id || '').indexOf('DI-') === 0), keep = [];

/* ---------- duplicate check: IMEI, SIM, customer User ID, vehicle — never overwrites anything ---------- */
async function dupCheck(f) {
  const out = { block: [], warn: [], unver: [], customerId: '', customerName: '' };
  DIRECT.everyone().forEach(r => {
    if (r.imei === f.imei) out.block.push(`IMEI ${f.imei} is already saved as a direct installation (vehicle ${r.vehicle}, customer ${r.customerName}).`);
    if (f.sim && simKey(r.sim) === simKey(f.sim) && r.imei !== f.imei) out.block.push(`SIM ${f.sim} is already used by the direct installation of IMEI ${r.imei} (customer ${r.customerName}).`);
    if (f.uid && String(r.customerUid).toLowerCase() === f.uid.toLowerCase() && last10(r.mobile) !== last10(f.mobile) && last10(r.alt) !== last10(f.mobile)) out.block.push(`User ID ${f.uid} already belongs to ${r.customerName} in the direct installations. The mobile number does not match.`);
    if (f.vehicle && normVeh(r.vehicle) === f.vehicle && String(r.customerUid).toLowerCase() !== String(f.uid || '').toLowerCase()) out.warn.push(`Vehicle ${f.vehicle} is already saved under another customer (${r.customerName}).`);
  });
  const jobs = [];
  if (f.imei) jobs.push((async () => {
    let exists = null;
    if (can('inward')) { try { exists = !!(await rpc('checkImei', { imei: f.imei })).exists; } catch (e) { /* fall through to getDevice */ } }
    if (exists === null) { try { await rpc('getDevice', { imei: f.imei }); exists = true; } catch (e) { if (e.code === 'NOT_FOUND') exists = false; else { out.unver.push('IMEI could not be checked against server stock (' + e.message + ').'); return; } } }
    if (exists) {
      let more = ''; try { const d = mapDevFull(await rpc('getDevice', { imei: f.imei })); more = ' It is ' + d.status + (d.customer ? ' and linked to customer ' + d.customer : '') + '.'; } catch (e) { /* details not visible to this role */ }
      out.block.push(`IMEI ${f.imei} already exists in Inward / Stock.${more} Use the normal Installation screen for this device.`);
    }
  })());
  if (f.sim) jobs.push((async () => {
    try { const r = await rpc('searchAll', { mode: 'sim', q: f.sim }); (r.results || []).filter(x => simKey(x.SIMNumber) === simKey(f.sim)).forEach(h => out.block.push(`SIM ${f.sim} is already linked to device IMEI ${h.IMEI}${h.CustomerName ? ' (customer ' + h.CustomerName + ')' : ''}.`)); }
    catch (e) { out.unver.push('SIM could not be checked against server records (' + e.message + ').'); }
  })());
  if (f.uid) jobs.push((async () => {
    if (!can('customer')) { out.unver.push('Customer records could not be checked: your role cannot view customers.'); return; }
    try {
      const r = await rpc('listCustomers', { q: f.uid, pageSize: 50 }), rows = (r.items || []).filter(x => String(x.UserID).toLowerCase() === f.uid.toLowerCase());
      if (rows.length) {
        const m = last10(f.mobile);
        if (!rows.some(x => last10(x.Mobile) === m || last10(x.AltMobile) === m)) out.block.push(`User ID ${f.uid} already belongs to ${rows[0].Name} (mobile ending ${last10(rows[0].Mobile).slice(-4)}). The mobile number you entered does not match — check the User ID.`);
        else { out.customerId = rows[0].CustomerID; out.customerName = rows[0].Name; }
      }
    } catch (e) { out.unver.push('Customer User ID could not be checked (' + e.message + ').'); }
  })());
  if (f.vehicle) jobs.push((async () => {
    if (!can('customer')) return;
    try { const r = await rpc('listCustomers', { q: f.vehicle, pageSize: 50 }); (r.items || []).filter(x => normVeh(x.VehicleNumber) === f.vehicle && String(x.UserID).toLowerCase() !== String(f.uid || '').toLowerCase()).forEach(x => out.warn.push(`Vehicle ${f.vehicle} is already linked to customer ${x.Name} (${x.UserID}).`)); } catch (e) { /* vehicle check is best-effort */ }
  })());
  await Promise.all(jobs);
  ['block', 'warn', 'unver'].forEach(k => { out[k] = out[k].filter((x, i, a) => a.indexOf(x) === i); });
  return out;
}

/* =====================================================================
   ADD-ON 21 — Passkey (fingerprint / face) LOGIN on the sign-in screen.
   Real WebAuthn: server challenge + server verification (passkeyLoginChallenge / passkeyLogin).
   Password login is untouched and always available. Nothing is faked on the phone.
   ===================================================================== */
(function () {
  const PK = 'trak_pk_uid';
  const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb = s => Uint8Array.from(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const _lv = SCREENS.login.view;
  SCREENS.login.view = function () {
    const h = _lv.call(this);
    if (!window.PublicKeyCredential) return h;
    const btn = '<button type="button" class="btn ghost" data-act="pkLogin" style="margin-top:2px">☝ Fingerprint / Face se login</button><div class="err" id="pk_lerr"></div>';
    return h.replace('<div class="sub" style="text-align:center;margin-top:4px">', btn + '<div class="sub" style="text-align:center;margin-top:4px">');
  };
  /* remember which user enabled a passkey on this phone */
  const _en = ACT.pkEnrol;
  ACT.pkEnrol = async function (el) { await _en(el); const e = document.getElementById('pk_err'); if (e && !e.textContent && S.user) { try { localStorage.setItem(PK, S.user.id); } catch (x) { /* ignore */ } } };
  ACT.pkLogin = async function (el) {
    const err = document.getElementById('pk_lerr'), typed = (document.getElementById('uid') || {}).value;
    const uid = String(typed || '').trim() || (function () { try { return localStorage.getItem(PK) || ''; } catch (e) { return ''; } })();
    if (err) err.textContent = '';
    if (!uid) { if (err) err.textContent = 'Pehli baar User ID + Password se login karke Fingerprint enable karein.'; return; }
    el.disabled = true;
    try {
      const ch = await rpcRaw('passkeyLoginChallenge', { userId: uid }), o = ch.options || ch;
      const cred = await navigator.credentials.get({ publicKey: { challenge: unb(o.challenge), rpId: o.rpId || location.hostname, timeout: 60000, userVerification: 'required', allowCredentials: (o.allowCredentials || []).map(c => ({ type: 'public-key', id: unb(c.id) })) } });
      const r = await rpcRaw('passkeyLogin', { userId: uid, id: cred.id, clientDataJSON: b64u(cred.response.clientDataJSON), authenticatorData: b64u(cred.response.authenticatorData), signature: b64u(cred.response.signature) });
      const u = r.user || {}, role = String(u.Role || u.role || '').toUpperCase();
      if (!r.token || !ROLES.includes(role)) throw new Error('Server ne valid login nahi diya.');
      S.token = r.token; S.perms = r.permissions || r.perms || [];
      S.user = { id: u.UserID || u.id || uid, name: u.Name || u.name || uid, role, branch: (u.Branch || u.branch) === 'ALL' ? 'All' : (u.Branch || u.branch || 'All'), installerId: u.InstallerID || '', partnerId: u.PartnerID || '' };
      if (S.mode === 'live') saveSession(r.expiresInSec || 21600);
      S.branch = 'All'; S.stack = []; reset('home', {});
      try { history.replaceState({ n: 0 }, ''); } catch (e) { /* ignore */ } hn = 0; render();
      EXT.sync().catch(() => { /* retried later */ });
    } catch (e) {
      if (err) err.textContent = 'Biometric login nahi hua: ' + (e.message || e) + ' — password se login karein.';
      el.disabled = false;
    }
  };
})();

}
/* LOCK ALL (Admin / Manager) and COPY ALL SIMs — always limited to the devices of one Delivered group */
const LOCKING = new Set();                                   /* groups being locked right now: survives repaints */
const grpKey = id => { const g = GR[id].g; return g.order || g.name; };
const canLockAll = () => isRole('ADMIN', 'MANAGER') && can('simStatus');
const validSim = v => /^\d{15,22}[Uu]?$/.test(v);              /* same rule as device inward */
function grpActions(id) {
  const busyNow = LOCKING.has(grpKey(id)), B = 'display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;cursor:pointer;font-weight:800';
  const icon = n => svg(n).replace('<svg', '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"');
  return `${canLockAll() ? `<span role="button" tabindex="0" data-act="grpLockAll" data-id="${id}" aria-disabled="${busyNow}" style="${B};background:#0b2a5b;color:#fff;min-height:36px;font-size:11.5px;padding:8px 16px${busyNow ? ';opacity:.6' : ''}">${icon('lock')}${busyNow ? 'Locking…' : 'LOCK ALL'}</span>` : ''}<span role="button" tabindex="0" data-act="grpCopySims" data-id="${id}" style="${B};flex-basis:100%;width:100%;min-height:42px;background:#d5f4fb;color:#0b2a5b;font-size:13px">${icon('copy')}COPY ALL SIMs</span>`;

ACT.grpLockAll = async el => {
  const id = el.dataset.id; if (!grpIsDel(id)) return;
  if (!canLockAll()) return toast('Only an Admin or authorised Manager can lock all devices.', 'bad');
  const key = grpKey(id), devs = GR[id].g.devs.slice(); if (LOCKING.has(key)) return;
  const todo = devs.filter(d => d.imei && !isLocked(d)), skip = devs.length - todo.length, n = todo.length;
  if (!n) return toast('All devices in this group are already LOCKED', 'ok');
  const repaint = () => { for (const k in GR) if (grpKey(k) === key) { const sg = document.getElementById('sg_' + k); if (sg) sg.outerHTML = grpBadges(k); } };
  LOCKING.add(key);                                          /* set before the dialog: a second tap cannot start a second run */
  let ok = 0, bad = 0, msg = '';

    if (!await confirmBox('Lock all devices', `Are you sure you want to lock all ${n} device${n === 1 ? '' : 's'} in this group?${skip ? ' ' + skip + ' already locked will be skipped.' : ''}`, 'Confirm Lock All')) return;
    repaint();
    for (let i = 0; i < n; i += 3) {                         /* three at a time: gentle on the Apps Script backend */
      const part = todo.slice(i, i + 3);
      const res = await Promise.allSettled(part.map(async d => {

      }));

/* =====================================================================
   ADD-ON 25 — Customer Profile: PAYMENT MODE + CUSTOMER BELONGS TO
   Purely additive. Nothing above is changed: existing screens are wrapped, never rewritten.
   Shown (1) in Customer Profile, below the vehicle cards and above Customer history, and
   (2) inside "Complete all details" (Edit customer), where both are REQUIRED.
   Backend actions (Part21.gs): getPaymentBelongs { customerId }  /  savePaymentBelongs { customerId, ...fields }
   Stored per customer (all vehicle rows that share the same User ID): PaymentMode, PaymentValue, BelongsTo, OtherCompanyName.
   ===================================================================== */
(function () {
  const PM = ['UPI', 'CASH'], CB = ['OUR COMPANY', 'OTHER'];
  const PB = { active: false, pending: null };
  ['pmode', 'pm_upi', 'pm_cash', 'cbel', 'cb_other'].forEach(k => KEEP_BLANK_BLOCKS.add(k));   /* these are required — a blank must block saving */
  READ_ACTIONS.add('getPaymentBelongs');

  const normPM = x => { const u = String(x || '').trim().toUpperCase(); return u === 'UPI' || u === 'CASH' ? u : ''; };
  const normCB = x => { const u = String(x || '').trim().toUpperCase().replace(/_/g, ' '); return /^OUR/.test(u) ? 'OUR COMPANY' : (/^OTHER/.test(u) ? 'OTHER' : ''); };
  function pbNorm(r) {
    r = r || {}; const pm = normPM(r.paymentMode), cb = normCB(r.belongsTo);
    return { paymentMode: pm, paymentValue: pm ? String(r.paymentValue || '').trim() : '', belongsTo: cb, otherCompany: cb === 'OTHER' ? String(r.otherCompany || '').trim() : '' };
  }
  async function loadPB(id) {
    try { return pbNorm(await rpc('getPaymentBelongs', { customerId: id })); }
    catch (e) { return { error: (e && e.message) || 'Could not be loaded.' }; }
  }
  function pbInit(pb) { if (S.F.pmode === undefined) S.F.pmode = pb.paymentMode || ''; if (S.F.cbel === undefined) S.F.cbel = pb.belongsTo || ''; }
  function pbCollect() {
    const pm = S.F.pmode || '', cb = S.F.cbel || '';
    return { paymentMode: pm, paymentValue: pm === 'UPI' ? v('pm_upi') : (pm === 'CASH' ? v('pm_cash') : ''), belongsTo: cb, otherCompany: cb === 'OTHER' ? v('cb_other') : '' };
  }
  function pbRulesPay() {
    const x = pbCollect(), r = [['pmode', !!x.paymentMode, 'Select a payment mode (UPI or Cash)']];
    if (x.paymentMode === 'UPI') r.push(['pm_upi', !!x.paymentValue, 'Enter Account Name / UPI ID']);
    if (x.paymentMode === 'CASH') r.push(['pm_cash', !!x.paymentValue, 'Enter who took the cash']);
    return r;
  }
  function pbRulesBel() {
    const x = pbCollect(), r = [['cbel', !!x.belongsTo, 'Select whom the customer belongs to']];
    if (x.belongsTo === 'OTHER') r.push(['cb_other', !!x.otherCompany, 'Enter Other Company Name']);
    return r;
  }
  const pbRules = () => pbRulesPay().concat(pbRulesBel());
  const show = on => on ? '' : 'display:none';

  /* the two cards (editable) or two read-only cards */
  function pbBlock(pb, editable, withSave) {
    if (pb.error) return `<div class="note y">Payment Mode and Customer Belongs To could not be loaded: ${esc(pb.error)}</div>`;
    pbInit(pb);
    const pm = S.F.pmode, cb = S.F.cbel;
    if (!editable) {
      return `<div class="card"><b>Payment Mode</b>${kvn('Payment mode', pb.paymentMode)}${pb.paymentMode === 'UPI' ? kvn('Account Name / UPI ID', pb.paymentValue) : (pb.paymentMode === 'CASH' ? kvn('Cash Taken By', pb.paymentValue) : '')}</div>
<div class="card"><b>Customer Belongs To</b>${kvn('Belongs to', pb.belongsTo)}${pb.belongsTo === 'OTHER' ? kvn('Other Company Name', pb.otherCompany) : ''}</div>`;
    }
    return `<div class="card" id="pb_pay"><b>Payment Mode</b>${segF('pmode', 'Payment mode', PM, pm, { req: 1 })}
<div id="pm_upi_w" style="${show(pm === 'UPI')}">${field('pm_upi', 'Account Name / UPI ID', { req: 1, val: pb.paymentMode === 'UPI' ? pb.paymentValue : '', ph: 'Account holder name or UPI ID', max: 80 })}</div>
<div id="pm_cash_w" style="${show(pm === 'CASH')}">${field('pm_cash', 'Cash Taken By', { req: 1, val: pb.paymentMode === 'CASH' ? pb.paymentValue : '', ph: 'Name of the person who received the cash', max: 80 })}</div>${withSave ? '<button class="btn soft" data-act="pbSavePay">Save payment mode</button>' : ''}</div>
<div class="card" id="pb_bel"><b>Customer Belongs To</b>${segF('cbel', 'Customer belongs to', CB, cb, { req: 1 })}
<div id="cb_other_w" style="${show(cb === 'OTHER')}">${field('cb_other', 'Other Company Name', { req: 1, val: pb.belongsTo === 'OTHER' ? pb.otherCompany : '', ph: 'Company name', max: 80 })}</div>${withSave ? '<button class="btn soft" data-act="pbSaveBel">Save customer belongs to</button>' : ''}</div>`;
  }
  function pbPick(g, val) {
    if (g === 'pmode') { const a = $('#pm_upi_w'), b = $('#pm_cash_w'); if (a) a.style.display = val === 'UPI' ? '' : 'none'; if (b) b.style.display = val === 'CASH' ? '' : 'none'; }
    if (g === 'cbel') { const a = $('#cb_other_w'); if (a) a.style.display = val === 'OTHER' ? '' : 'none'; }
  }

  /* ---------- Customer Profile (view page): load + cards between the vehicles and Customer history ---------- */
  const _cvLoad = SCREENS.customerView.load;
  SCREENS.customerView.load = async function () {
    const id = String(S.params.id || ''), pbp = (id && id.indexOf('LOCAL:') !== 0) ? loadPB(id) : null;

    if (pbp) d.pb = await pbp;
    return d;
  };
  const _cvView = SCREENS.customerView.view;
  SCREENS.customerView.view = function (d) {
    const h = _cvView.call(this, d);
    if (!d || d.local || !d.pb) return h;
    const block = pbBlock(d.pb, S.perms.includes('customer.manage'), true);
    return h.replace('<div class="sec">Customer history</div>', () => block + '<div class="sec">Customer history</div>');
  };
  SCREENS.customerView.onpick = pbPick;

  /* save one card from the profile page */
  async function saveFromProfile(el, rules, body, after) {
    return busy(el, async () => {
      if (!validate(rules())) return;
      const d = S.data, cid = d && d.c && d.c.CustomerID; if (!cid) { toast('Customer not found.', 'bad'); return; }
      const x = pbCollect();
      try { await rpcRaw('savePaymentBelongs', Object.assign({ customerId: cid }, body(x))); }
      catch (e) { toast('Not saved: ' + e.message, 'bad'); return; }
      after(d.pb, x); toast('Saved.', 'ok');
    });
  }
  ACT.pbSavePay = el => saveFromProfile(el, pbRulesPay, x => ({ paymentMode: x.paymentMode, paymentValue: x.paymentValue }), (pb, x) => { pb.paymentMode = x.paymentMode; pb.paymentValue = x.paymentValue; });
  ACT.pbSaveBel = el => saveFromProfile(el, pbRulesBel, x => ({ belongsTo: x.belongsTo, otherCompany: x.otherCompany }), (pb, x) => { pb.belongsTo = x.belongsTo; pb.otherCompany = x.otherCompany; });

  /* ---------- Complete all details (Edit customer): cards + required-field validation ---------- */
  const _cfLoad = SCREENS.customer.load;
  SCREENS.customer.load = async function () {
    const id = S.params.id, pbp = id ? loadPB(id) : null;
    const d = await _cfLoad.apply(this, arguments);
    if (pbp) { const pb = await pbp; if (d && d.customer && d.customer.id) d.pb = pb; }
    return d;
  };
  const _cfView = SCREENS.customer.view;
  SCREENS.customer.view = function (d) {
    const h = _cfView.call(this, d), c = d && d.customer;
    if (!c || !c.id || !d.pb) return h;
    const block = pbBlock(d.pb, true, false);
    return h.replace('<div class="note b">One IMEI', () => block + '<div class="note b">One IMEI');
  };
  const _cfPick = SCREENS.customer.onpick;
  SCREENS.customer.onpick = function (g, val) { if (_cfPick) _cfPick.apply(this, arguments); pbPick(g, val); };

  /* the existing validation runs once; while saving an existing customer our required fields are added to the SAME check,
     so every error shows together and nothing is saved unless everything is valid */
  const _validate25 = validate;
  validate = function (rules) {
    const ok = _validate25.call(this, PB.active ? rules.concat(pbRules()) : rules);
    if (PB.active && ok) PB.pending = pbCollect();
    return ok;
  };
  const _saveCustomer25 = ACT.saveCustomer;
  ACT.saveCustomer = function (el) {
    const c0 = S.data && S.data.customer, pb = S.data && S.data.pb;
    PB.pending = null;
    PB.active = !!(S.params.id && c0 && c0.id && pb && !pb.error && document.getElementById('pb_pay'));
    try { return _saveCustomer25.apply(this, arguments); } finally { PB.active = false; }
  };
  /* after the customer itself is saved, store the two cards (only when they changed) */
  const _customerSave25 = Live.customerSave;
  Live.customerSave = async function (p) {
    const r = await _customerSave25.apply(this, arguments), pend = PB.pending; PB.pending = null;

        try { await rpcRaw('savePaymentBelongs', Object.assign({ customerId: r.id }, pend)); }
        catch (e) { toast('Customer saved, but Payment Mode / Customer Belongs To were NOT saved: ' + e.message, 'bad'); }
      }
    }
    return r;
  };
})();
/* =====================================================================
   ADD-ON 26 — Technician Report: TECHNICIAN PENDING PAYMENT card, payment history + recording,
   and the two-page PDF "Technician Expense & Cash Collection Statement".
   Wraps the existing Installer Reports screen (ADD-ON 27); nothing there is rewritten.
   Backend contract (to be built in the backend step):
     getInstallerReport {from,to} -> installers[]: id, name, count, charges, rate, fuel, km, commission, commissionCount, commissionRate,
        cash (collected by technician), deposit (already deposited/settled), paid (paid to technician in the period),
        records:{ exp:[{date,km,avg,petrolPrice,fuel,...}], pay:[{id,date,amount,mode,ref}] }
     saveInstallerPayment {installerId, amount, date, mode, reference, requestId}  (duplicates rejected by requestId)

    bx.forEach((b, i) => { const x0 = M + i * (bw + 8); box(x0, t, bw, 44, b[2]); text(b[0], x0 + bw / 2, t + 7, 8, bold, [255, 255, 255], 'c'); text(amt(b[1]), x0 + bw / 2, t + 21, 16, bold, [255, 255, 255], 'c', bw - 8); });

      : 'The technician has collected ' + amt(cash) + '. From this amount, the technician may retain ' + amt(F.payable) + ' against installation charges, referral commission and fuel expenses.' + (F.dep > 0 ? ' ' + amt(F.dep) + ' has already been deposited / settled.' : '') + (hand > 0 ? ' The remaining ' + amt(hand) + ' must be deposited into the TRAK MOTION GPS company account.' : ' No further amount is pending to be deposited.');

  /* ---------------- app wiring ---------------- */
  async function loadPdfLib() {
    if (window.PDFLib) return window.PDFLib;
    for (const u of ['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js']) {
      try { await new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = () => rej(new Error('x')); document.head.appendChild(s); }); if (window.PDFLib) return window.PDFLib; } catch (e) { /* try the next address */ }
    }
    throw new Error('The PDF engine could not be loaded. Check the internet connection and try again.');
  }
  function saveBlob(bytes, name) {
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })), a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 120000);
  }
  ACT.tpPdf = async el => {
    if (el.dataset.busy) return;
    const { r, I } = cur(); if (!I) return;
    if (!ready(r, I)) return toast('This statement needs the backend report (commission, cash collection and payments). It is not connected yet, so no PDF was made.', 'bad');
    el.dataset.busy = '1'; const old = el.innerHTML; el.textContent = 'Preparing PDF…'; el.style.opacity = '.7';
    try {
      const PL = await loadPdfLib();
      const D = { name: I.name, id: I.id, from: r.from, to: r.to, count: I.count, rate: I.rate, charges: I.charges, commission: I.commission, commissionCount: I.commissionCount, commissionRate: I.commissionRate, fuel: I.fuel, km: I.km, cash: I.cash, deposit: I.deposit, paid: I.paid, vehicle: I.vehicleType || '',
        daily: (I.recs.exp || []).map(x => ({ date: x.date, km: x.km, fuel: x.fuel, avg: x.avg, petrolPrice: x.petrolPrice || x.pp })) };
      const out = await buildStatementPdf(PL, D);
      if (out.pages !== 2 || out.bottom > out.limit) throw new Error('The statement did not fit on two pages, so it was not downloaded.');
      saveBlob(out.bytes, ('TRAK-MOTION-Statement-' + I.name + '-' + r.from + '_to_' + r.to + '.pdf').replace(/[^A-Za-z0-9._-]+/g, '_'));
      toast('PDF statement downloaded.', 'ok');
    } catch (e) { toast(e.message || 'The PDF could not be created.', 'bad'); }
    finally { delete el.dataset.busy; el.innerHTML = old; el.style.opacity = ''; }
  };

  const pdfBtn = '<button class="btn" data-act="tpPdf" style="background:#0b2a5b;color:#fff;border-radius:999px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px">📄 GENERATE PDF REPORT</button>';
  function pendingCard(r, I) {

    return `<button class="card" data-act="tpOpen" style="background:linear-gradient(135deg,#0b2a5b 0%,#1b4f9c 62%,#f58220 140%);color:#fff;gap:6px;text-align:left;border:0">
<div class="row sp"><span style="font-size:12px;font-weight:800;letter-spacing:.6px;color:#cfe0ff">TECHNICIAN PENDING PAYMENT</span><span style="font-size:26px;line-height:1">₹</span></div>
<div style="font-size:32px;font-weight:800">${ok ? money(F.pending) : 'Needs backend'}</div>
<div class="row sp"><span style="font-size:12.5px;color:#dbe6ff">Amount payable by company</span>${ok ? `<span class="pill" style="background:${sc};color:#0b2a5b;font-weight:800">${st}</span>` : ''}</div>
${ok ? `<div style="font-size:12px;color:#cfe0ff">Payable ${money(F.payable)} − Paid ${money(F.paid)} · tap for payment history</div>` : '<div style="font-size:12px;color:#ffe3b8">Commission, payments and cash come from the backend report.</div>'}</button>

  const _rv = SCREENS.installerReports.view;

  };

  ACT.tpOpen = () => {

    const list = pays.length ? pays.map(x => `<div class="card" style="gap:2px;padding:10px 12px"><div class="row sp"><b>${money(x.amount)}</b><span class="sub">${esc(fmtIso(x.date))}</span></div><div class="sub">${esc([x.mode, x.ref || x.reference].filter(Boolean).join(' · ') || '—')}</div></div>`).join('') : '<div class="sub">No payment recorded in this period.</div>';

    openSheet(`<h3>Technician payment — ${esc(I.name)}</h3><div style="max-height:68vh;overflow:auto;display:flex;flex-direction:column;gap:10px">${kv('Period', fmtIso(r.from) + ' → ' + fmtIso(r.to))}${kv('Total payable', money(F.payable))}${kv('Amount already paid', money(F.paid))}${kv('Remaining pending', money(F.pending))}<div class="sec">Payment history</div>${list}${form}</div><button class="btn ghost" data-act="tpClose">Close</button>`);
  };
  ACT.tpClose = () => closeSheet();
  ACT.tpSave = el => busy(el, async () => {
    const { r, I } = cur(); if (!I || !isRole('ADMIN')) return;
    const F = calcFin(I), a = v('tp_amt').replace(/,/g, ''), n = Number(a), d = v('tp_date'), mode = v('tp_mode'), ref = v('tp_ref');

    const sig = [I.id || I.name, a, d, mode, ref].join('|'); if (!S.F.tpSig || S.F.tpSig !== sig) { S.F.tpSig = sig; S.F.tpReq = uuid(); }   /* a retry of the same entry reuses the id, so it can never be saved twice */
    try { await rpcRaw('saveInstallerPayment', { requestId: S.F.tpReq, installerId: I.id || '', installerName: I.name, amount: String(r2(n)), date: d, mode, reference: ref, from: r.from, to: r.to }); }
